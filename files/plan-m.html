<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Планировка · TS HUB</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://api.yardhub.ru">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Мобильная Планировка (plans/2026-09-05-mobile-planning-page.md). Отдельная лёгкая
   страница для логиста в поле. Токены - DESIGN_SYSTEM.md раздел 1, без нового hex.
   Паттерны, которых нет в ГОСТе (pinch со ступенями, тап-выделение с контекстной шапкой,
   bottom sheet заявки, шапка 2 строки) - раздел 5 плана, ждут «да» Влада по превью. ── */
:root{
  --bg:#0f0f13; --bg2:#17171d; --bg3:#1e1e26; --bg4:#252530;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
  --text:#e8e6df; --muted:#8b8980;
  --green:#1D9E75; --red:#E24B4A; --amber:#EF9F27; --blue:#378ADD; --purple:#7F77DD;
  --tint-green:#4fd4a3; --tint-amber:#f5be6a; --tint-red:#f07b7a;
  --fill-trip:rgba(29,158,117,.30); --fill-noorder:rgba(239,159,39,.26); --fill-repair:rgba(226,75,74,.26);
  --fill-maint:rgba(226,75,74,.16); --fill-driveroff:rgba(139,137,128,.26);
  --past-dim:rgba(0,0,0,.18); --scrim:rgba(0,0,0,.55);
  --font-ui:'Golos Text',system-ui,-apple-system,Roboto,sans-serif;
  --font-num:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --ease-out-strong:cubic-bezier(0.16,1,0.3,1);
  --ease-out-soft:cubic-bezier(0.25,1,0.5,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --ease-overshoot:cubic-bezier(.34,1.45,.5,1);
  --ease-flip:cubic-bezier(.22,.9,.28,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --lane-w:84px; --row-h:48px; --ghead-h:36px; --scale-h:40px; --hdr-row:44px;
  --hw:11.5px; /* px/час, пересчитывается от ширины трека */
}
html[data-theme="light"]{
  --bg:#f4f3ef; --bg2:#ffffff; --bg3:#ecebe6; --bg4:#e2e1db;
  --border:rgba(20,26,38,0.10); --border-strong:rgba(20,26,38,0.20);
  --text:#1b1f27; --muted:#6b6a63;
  --tint-green:#0f6a4c; --tint-amber:#8a5a12; --tint-red:#a23b3a;
  --past-dim:rgba(20,26,38,.07); --scrim:rgba(20,26,38,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{color:var(--text);font-family:var(--font-ui);font-size:14px;font-weight:500;line-height:1.35;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;touch-action:manipulation;cursor:pointer}
input{font:inherit;color:inherit}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── Каркас: шапка 2 строки (88 px) + лента ── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:var(--safe-t)}
.hdr{flex:none;background:var(--bg);border-bottom:1px solid var(--border);position:relative;z-index:40}
.hdr-row{display:flex;align-items:center;gap:6px;height:var(--hdr-row);padding:0 8px}
.hdr-row1 .grow{flex:1 1 auto;min-width:0}
.hbtn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;
  padding:0 10px;font-weight:600;font-size:15px;color:var(--text);white-space:nowrap}
.hbtn:active{background:var(--bg3)}
.hbtn.icon{padding:0;width:44px}
.hbtn.icon svg{width:22px;height:22px}
.hdate{font-size:15px;font-weight:600}
.hdate .wd{color:var(--muted);font-weight:500;margin-right:4px}
.hdate svg{width:16px;height:16px;color:var(--muted)}
.today{height:36px;min-width:0;padding:0 12px;border-radius:18px;background:rgba(29,158,117,.13);color:#2fbe93;font-size:13px;
  font-weight:600;transition:opacity .12s ease}
.today[hidden]{display:none}
.free{height:36px;padding:0 10px;border-radius:18px;background:var(--bg3);border:1px solid var(--border);font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px}
.free .n{font-family:var(--font-num);font-size:14px}
.free.on{background:rgba(55,138,221,.16);border-color:rgba(55,138,221,.4)}
.free .x{display:none;color:var(--muted)}
.free.on .x{display:inline}
/* строка 2: сегмент масштаба ИЛИ панель действий выделения */
.hdr-row2{position:relative}
.zoomseg{display:grid;grid-template-columns:repeat(4,1fr);width:100%;height:36px;background:var(--bg3);border-radius:8px;padding:2px;gap:2px}
.zoomseg button{height:32px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);transition:background-color .15s ease,color .15s ease}
.zoomseg button[aria-pressed="true"]{background:var(--bg4);color:var(--text)}
.actpanel{position:absolute;inset:0;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg);
  opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .12s ease,transform .12s var(--ease-out-soft)}
.actpanel.on{opacity:1;pointer-events:auto;transform:none}
.actpanel .hbtn{flex:1 1 auto;background:var(--bg3);height:40px;font-size:14px}
.actpanel .hbtn.danger{color:var(--tint-red)}
.actpanel .hbtn.icon{flex:none;background:none}
.hdr-row2.acting .zoomseg{opacity:0;pointer-events:none}

/* полоса связи (единственный сдвигающий элемент) и зона отмены драга */
.netbar{display:none;align-items:center;gap:8px;height:40px;padding:0 12px;background:var(--bg4);color:var(--amber);font-size:14px;font-weight:600}
.netbar.on{display:flex}
.netbar .mono{color:var(--text)}
.cancelzone{position:absolute;left:0;right:0;top:100%;height:56px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--bg2);border-bottom:1px solid var(--border);color:var(--muted);font-size:14px;font-weight:600;
  transform:translateY(-100%);opacity:0;pointer-events:none;transition:transform .2s var(--ease-out-soft),opacity .2s ease;z-index:-1}
.cancelzone.on{transform:none;opacity:1}
.cancelzone.hot{background:rgba(226,75,74,.16);color:var(--tint-red)}

/* ── Лента ── */
#board{flex:1 1 auto;min-height:0;position:relative;overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;scrollbar-width:none}
#board::-webkit-scrollbar{display:none}
.scalerow{position:sticky;top:0;z-index:20;display:flex;height:var(--scale-h);width:max-content;background:var(--bg)}
.corner{position:sticky;left:0;z-index:2;width:var(--lane-w);height:var(--scale-h);background:var(--bg);border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);display:flex;align-items:flex-end;padding:0 0 6px 8px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.scale{position:relative;height:var(--scale-h);border-bottom:1px solid var(--border);overflow:hidden}
.scalein{position:absolute;top:0;left:0;height:100%;transform-origin:0 0}
.sday{position:absolute;top:0;height:100%;border-left:1px solid var(--border-strong)}
.sday .dl{position:absolute;left:6px;top:3px;font-size:11px;font-weight:600;white-space:nowrap;color:var(--text)}
.sday .dl.wk{color:var(--tint-amber)}
.sday .dl.td{color:#2fbe93}
.shr{position:absolute;top:22px;font-family:var(--font-num);font-size:10px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.shr.big{font-size:11px;color:var(--text)}
.nowpill{position:absolute;top:20px;transform:translateX(-50%);background:var(--red);color:#fff;font-family:var(--font-num);font-size:11px;
  font-weight:700;padding:2px 6px;border-radius:9px;line-height:1.2;pointer-events:none;z-index:3}
.body{display:flex;width:max-content;position:relative}
.lanes{position:sticky;left:0;z-index:10;width:var(--lane-w);flex:none;background:var(--bg);border-right:1px solid var(--border)}
.rowhead{height:var(--row-h);position:relative;padding:6px 6px 0 8px;border-bottom:1px solid var(--border);background:var(--bg);overflow:hidden}
.rowhead .g{font-family:var(--font-num);font-size:14px;font-weight:600;letter-spacing:.02em;white-space:nowrap;line-height:1.2}
.rowhead .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;margin-top:1px}
.rowhead .d.vac{color:var(--tint-red)}
.rowhead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gc,transparent)}
.rowhead.g-tral{--gc:rgba(29,158,117,.55)}
.rowhead.g-long{--gc:rgba(55,138,221,.55)}
.rowhead.drop{background:var(--bg3)}
.rowhead.halo{animation:halo .3s ease-out 1}
@keyframes halo{0%{box-shadow:inset 0 0 0 2px rgba(55,138,221,.6)}100%{box-shadow:inset 0 0 0 2px rgba(55,138,221,0)}}
.ghead{height:var(--ghead-h);position:sticky;top:var(--scale-h);z-index:3;display:flex;align-items:center;width:max-content;min-width:100%;
  background:var(--bg2);padding:0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;border-bottom:1px solid var(--border)}
.ghead .cnt{font-family:var(--font-num);margin-left:6px;text-transform:none;letter-spacing:0}
.ghead .chev{margin-left:8px;transition:transform .18s var(--ease-out-soft);width:16px;height:16px}
.ghead.col .chev{transform:rotate(-90deg)}
.canvas{position:relative;flex:none}
.past{position:absolute;left:0;top:0;bottom:0;background:var(--past-dim);pointer-events:none}
.tracks{position:absolute;top:0;left:0;transform-origin:0 0;
  background-image:repeating-linear-gradient(90deg,var(--border-strong) 0 1px,transparent 1px calc(var(--hw)*24)),
    repeating-linear-gradient(90deg,var(--border) 0 1px,transparent 1px var(--hw))}
.tracks.anim{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.track{height:var(--row-h);position:relative;border-bottom:1px solid var(--border);contain:layout paint}
.track.gtrack{height:var(--ghead-h);background:var(--bg2)}
.track.drop{background:rgba(55,138,221,.07)}
.hid{display:none!important}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--red);pointer-events:none;z-index:5;margin-left:-1px}
.tracks.pinching + .nowline, .pinching ~ .past{opacity:0}

/* плитка */
.seg{position:absolute;top:7px;height:34px;border-radius:6px;color:var(--text);font-size:11px;line-height:1.2;
  background:var(--fill-driveroff);transition:opacity .14s var(--ease-out-soft)}
.seg::before{content:"";position:absolute;inset:-7px 0;min-width:44px;left:50%;transform:translateX(-50%);width:max(100%,44px)}
.seg.k-trip{background:var(--fill-trip);color:var(--tint-green)}
.seg.k-noorder{background:var(--fill-noorder);color:var(--tint-amber)}
.seg.k-repair{background:var(--fill-repair);color:var(--tint-red)}
.seg.k-maint{background:var(--fill-maint);color:var(--tint-red)}
.seg.k-driveroff{background:var(--fill-driveroff);color:var(--muted)}
.seg.past{opacity:.68}
.seg.src{opacity:.35}
.seg.sel{z-index:6;box-shadow:0 0 0 2px var(--text)}
.seg.bad{box-shadow:0 0 0 2px var(--red);background:rgba(226,75,74,.35)}
.seg.draft{background:rgba(55,138,221,.30);color:#7db9ee;box-shadow:0 0 0 2px var(--blue)}
.seg.halo{animation:seghalo .3s ease-out 1}
@keyframes seghalo{0%{box-shadow:0 0 0 3px rgba(55,138,221,.7)}100%{box-shadow:0 0 0 3px rgba(55,138,221,0)}}
.seg-in{position:absolute;left:0;top:0;height:100%;max-width:100%;display:inline-flex;align-items:center;gap:5px;padding:0 6px;
  white-space:nowrap;overflow:hidden;transform-origin:left center;transform:translateX(var(--pin,0px)) scaleX(calc(1/var(--k,1)))}
.seg-id{font-family:var(--font-num);font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:3px 5px;border-radius:4px;
  background:var(--bg4);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong);flex:none;line-height:1.1}
.seg-txt{overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:11.5px}
.seg.tiny .seg-in{display:none}
.seg.small .seg-id{display:none}
.nd{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--amber);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:0 0 6px 6px;overflow:hidden;background:rgba(139,137,128,.18)}
.prog i{display:block;height:100%;background:var(--green);transform-origin:left;transform:scaleX(var(--p,0))}
.hnd{position:absolute;top:-7px;width:28px;height:48px;touch-action:none;z-index:7}
.hnd::after{content:"";position:absolute;top:10px;width:10px;height:28px;border-radius:5px;background:var(--text);left:9px;
  box-shadow:inset 3px 0 0 var(--bg),inset -3px 0 0 var(--bg)}
.hnd.l{left:-24px}.hnd.r{right:-24px}
.slot{position:absolute;top:7px;height:34px;border-radius:6px;border:2px dashed var(--blue);background:rgba(55,138,221,.10);pointer-events:none;z-index:4;
  transition:box-shadow .12s ease}
.slot.locked{box-shadow:0 0 0 2px rgba(55,138,221,.5)}
.slot.bad{border-color:var(--red);background:rgba(226,75,74,.18)}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;will-change:transform;opacity:.9;
  box-shadow:0 2px 6px rgba(0,0,0,.4),0 16px 32px rgba(0,0,0,.5)}
.ghost.lift{animation:wig .15s ease-in-out 2}
@keyframes wig{0%,100%{rotate:0deg}50%{rotate:1.5deg}}
.pressing{transform:scale(.97);transition:transform .1s ease}

/* HUD и тост */
.hud{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 96px);z-index:70;background:var(--bg4);border:1px solid var(--border-strong);
  border-radius:10px;padding:8px 12px;font-family:var(--font-num);font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .1s ease;text-align:center;line-height:1.35}
.hud.on{opacity:1}
.hud .to{display:block;font-family:var(--font-ui);font-size:12px;color:var(--muted);font-weight:600}
.hud .to b{color:var(--text);font-family:var(--font-num)}
.hud.bad{border-color:var(--red)}
.hud.bad .to{color:var(--tint-red)}
.hud.zoom{top:calc(var(--safe-t) + 100px);font-family:var(--font-ui);font-size:14px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 14px);z-index:80;display:flex;align-items:center;gap:10px;
  background:var(--bg4);border:1px solid var(--border-strong);border-radius:12px;padding:10px 12px 10px 14px;font-size:14px;font-weight:600;
  transform:translateY(20px);opacity:0;transition:transform .2s var(--ease-out-strong),opacity .2s ease;pointer-events:none}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast.err{border-color:var(--red)}
.toast .t{flex:1 1 auto;min-width:0}
.toast .t small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.toast button{flex:none;height:40px;padding:0 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--border-strong);font-size:14px;font-weight:600}

/* ── Листы (bottom sheet) ── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;height:92vh;height:92dvh;z-index:95;background:var(--bg2);border-radius:12px 12px 0 0;
  transform:translateY(100%);transition:transform .32s var(--ease-drawer);display:flex;flex-direction:column;box-shadow:0 -8px 32px rgba(0,0,0,.4)}
.sheet.half{transform:translateY(40vh);transform:translateY(40dvh)}
.sheet.full{transform:none}
.sheet .grip{flex:none;height:22px;display:flex;align-items:center;justify-content:center;touch-action:none}
.sheet .grip::before{content:"";width:44px;height:4px;border-radius:2px;background:var(--border-strong)}
.sh-head{flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 8px 8px;min-height:44px}
.sh-head .ttl{flex:1 1 auto;min-width:0;font-size:18px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-head .ttl small{display:block;font-size:12px;color:var(--muted);font-weight:500;font-family:var(--font-num)}
.sh-body{flex:1 1 auto;min-height:0;overflow:auto;padding:0 12px 12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh-foot{flex:none;display:flex;gap:10px;padding:10px 12px calc(var(--safe-b) + 12px);border-top:1px solid var(--border);background:var(--bg2)}
.btn{height:56px;border-radius:10px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;
  transition:transform .1s ease,opacity .15s ease}
.btn:active{transform:scale(.98)}
.btn.primary{flex:1 1 auto;background:var(--green);color:#0f0f13}
.btn.primary:disabled{opacity:.45}
.btn.ghost{background:var(--bg3);border:2px solid var(--border-strong);color:var(--text)}
.btn.danger{background:var(--red);color:#fff}
.f-label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.f-label:first-child{margin-top:4px}
.seg4{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:44px;background:var(--bg3);border-radius:8px;padding:2px;gap:2px}
.seg4 button{border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg4 button[aria-pressed="true"]{background:var(--bg4);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 14px;border-radius:22px;background:var(--bg3);border:1px solid var(--border-strong);font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.chip[aria-pressed="true"]{background:rgba(29,158,117,.16);border-color:var(--green);color:#2fbe93}
.chip.r[aria-pressed="true"]{background:rgba(226,75,74,.16);border-color:var(--red);color:var(--tint-red)}
.chip .mono{font-size:13px}
.frow{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--border)}
.frow .k{flex:none;width:86px;color:var(--muted);font-size:13px;font-weight:600}
.frow .v{flex:1 1 auto;min-width:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .v.ph{color:var(--muted);font-weight:500}
.frow .v.mono{font-size:16px}
.frow .go{color:var(--muted)}
.frow.tap{cursor:pointer}
.frow.tap:active{background:var(--bg3);margin:0 -12px;padding-left:12px;padding-right:12px}
.stp{width:44px;height:44px;border-radius:8px;background:var(--bg3);border:1px solid var(--border-strong);font-family:var(--font-num);font-size:14px;font-weight:700;flex:none}
.stp:active{background:var(--bg4)}
.timebox{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--border)}
.timebox .cur{text-align:center;font-family:var(--font-num);font-size:18px;font-weight:700;line-height:1.2}
.timebox .cur small{display:block;font-family:var(--font-ui);font-size:12px;color:var(--muted);font-weight:600}
.timepick{padding:8px 0 2px;border-bottom:1px solid var(--border)}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;height:44px;padding:0 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.days button[aria-pressed="true"]{background:var(--bg4);color:var(--text);border-color:var(--border-strong)}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.hours button{height:44px;border-radius:8px;background:var(--bg3);font-family:var(--font-num);font-size:14px;font-weight:600;color:var(--muted)}
.hours button[aria-pressed="true"]{background:var(--bg4);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong)}
.halfsw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.halfsw button{height:40px;border-radius:8px;background:var(--bg3);font-family:var(--font-num);font-weight:600;color:var(--muted)}
.halfsw button[aria-pressed="true"]{background:var(--bg4);color:var(--text)}
.dur{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:13px}
.dur .mono{color:var(--text);font-size:14px}
.tgl{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600}
.sw{width:52px;height:32px;border-radius:16px;background:var(--bg4);position:relative;flex:none;transition:background-color .15s ease}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--muted);transition:transform .15s var(--ease-out-soft),background-color .15s ease}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:#0f0f13}
.info{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg3);font-size:13px;color:var(--muted);margin-top:10px}
.info.warn{background:rgba(239,159,39,.12);color:var(--amber)}
.info.err{background:rgba(226,75,74,.12);color:var(--tint-red)}
.who{font-size:13px;color:var(--muted);margin-top:10px}
.who b{color:var(--text)}
.act-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.act-grid .chip{height:48px;justify-content:center;border-radius:10px}
.list-row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600}
.list-row .sub{display:block;font-size:12px;color:var(--muted);font-weight:500}
.list-row .go{margin-left:auto;color:var(--muted)}
.list-row:active{background:var(--bg3)}
.list-row.danger{color:var(--tint-red)}
.list-row.muted{color:var(--muted)}

/* ── Полноэкранные оверлеи: поиск, пикеры, дата ── */
.ovl{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--safe-t);
  transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .24s var(--ease-out-strong)}
.ovl.on{transform:none;opacity:1;pointer-events:auto}
.ovl-head{flex:none;display:flex;align-items:center;gap:8px;padding:8px}
.ovl-head input{flex:1 1 auto;min-width:0;height:52px;border-radius:10px;background:var(--bg3);border:1px solid var(--border-strong);padding:0 14px;font-size:17px;outline:none}
.ovl-head input:focus{border-color:var(--blue)}
.ovl-head .ttl{flex:1 1 auto;font-size:18px;font-weight:700;padding-left:4px}
.ovl-body{flex:1 1 auto;min-height:0;overflow:auto;padding:0 12px 12px;overscroll-behavior:contain}
.ovl-foot{flex:none;padding:10px 12px calc(var(--safe-b) + 12px);border-top:1px solid var(--border)}
.res{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--border)}
.res .g{font-family:var(--font-num);font-size:15px;font-weight:600;flex:none;min-width:88px}
.res .t{flex:1 1 auto;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.res .st{font-size:12px;color:var(--muted);flex:none}
.res .st.ok{color:#2fbe93}
.res.on{background:var(--bg3);margin:0 -12px;padding:0 12px}
.res:active{background:var(--bg3)}
.sect{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.empty{padding:24px 0;text-align:center;color:var(--muted);font-size:15px}

/* ── Скелет и состояния ── */
.skel .rowhead .g{width:60px;height:14px;background:var(--bg3);border-radius:4px;color:transparent}
.skel .rowhead .d{width:48px;height:10px;background:var(--bg3);border-radius:4px;margin-top:4px;color:transparent}
.state{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.state h1{font-size:22px;font-weight:700}
.state p{color:var(--muted);font-size:15px;max-width:320px}
.demo-tag{position:fixed;left:8px;bottom:calc(var(--safe-b) + 8px);z-index:65;font-size:10px;color:var(--muted);background:var(--bg2);border:1px solid var(--border);
  border-radius:6px;padding:2px 6px;pointer-events:none;letter-spacing:.06em}
@media (orientation:landscape) and (max-height:480px){
  :root{--lane-w:96px}
  .hdr-row2{display:none}
  .hdr-row1 .zoomseg{display:grid;width:220px;flex:none}
}
.hdr-row1 .zoomseg{display:none}
@media (prefers-reduced-motion:reduce){
  .tracks.anim,.sheet,.ovl,.toast,.ghost.lift,.nd,.seg.halo,.rowhead.halo{transition:none;animation:none}
}

var LONG_PRESS_MS = 420, SLOP = 10;

function attachMove(){ board.addEventListener("touchmove", onGestureMove, {passive:false}); }
function detachMove(){ board.removeEventListener("touchmove", onGestureMove); }
board.addEventListener("touchstart", function(e){
  if (sheetState !== "closed" && sheetState !== "half") return;
  cacheGeom();
  if (e.touches.length === 2){
    if (st === "IDLE" || st === "PRESSING"){ clearPress(); e.preventDefault(); startPinch(e); }
    return;
  }
  if (e.touches.length !== 1 || st !== "IDLE") return;
  var t = e.touches[0], tg = e.target;
  var hnd = tg.closest(".hnd");
  if (hnd){ e.preventDefault(); startResize(hnd.closest(".seg"), hnd.classList.contains("l") ? "l" : "r", t); return; }
  press = {x0:t.clientX, y0:t.clientY, t0:Date.now(), segEl:tg.closest(".seg"), rh:tg.closest(".rowhead"), gh:tg.closest(".ghead"), tr:tg.closest(".track"), sc:tg.closest(".scalerow")};
  st = "PRESSING";
  if (press.segEl){ press.pressEl = press.segEl; press.segEl.classList.add("pressing"); }
  press.timer = setTimeout(onLongPress, LONG_PRESS_MS);
}, {passive:false});
board.addEventListener("touchmove", function(e){
  if (st !== "PRESSING") return;
  var t = e.touches[0];
  if (Math.hypot(t.clientX - press.x0, t.clientY - press.y0) > SLOP) clearPress();
}, {passive:true});
board.addEventListener("touchend", function(e){
  if (st === "PRESSING"){ var p = press; clearPress(); e.preventDefault(); handleTap(p, e.changedTouches[0]); return; }
  if (st === "DRAGGING"){ e.preventDefault(); endDrag(false); return; }
  if (st === "RESIZING"){ e.preventDefault(); endResize(); return; }
  if (st === "PINCHING" && e.touches.length < 2){ e.preventDefault(); endPinch(); return; }
}, {passive:false});
board.addEventListener("touchcancel", function(){ abortAll(); }, {passive:true});
board.addEventListener("contextmenu", function(e){ e.preventDefault(); });
board.addEventListener("click", function(e){ e.stopPropagation(); if (!("ontouchstart" in window)) handleMouseClick(e); });
document.addEventListener("gesturestart", function(e){ e.preventDefault(); }, {passive:false});
function abortAll(){
  clearPress();
  if (st === "DRAGGING") endDrag(true);
  else if (st === "RESIZING"){ restoreResize(); finishResize(); }
  else if (st === "PINCHING"){ cleanupPinch(); }
  st = "IDLE";
}
function onGestureMove(e){
  e.preventDefault();
  if (st === "DRAGGING"){ var t = e.touches[0]; drag.lx = t.clientX; drag.ly = t.clientY; }
  else if (st === "RESIZING"){ var t2 = e.touches[0]; rsz.lx = t2.clientX; }
  else if (st === "PINCHING" && e.touches.length >= 2) movePinch(e);
}
/* мышь/трекпад (планшет, десктоп-проверка): тап = клик, без long-press */
function handleMouseClick(e){
  var tg = e.target;
  handleTap({segEl:tg.closest(".seg"), rh:tg.closest(".rowhead"), gh:tg.closest(".ghead"), tr:tg.closest(".track"), sc:tg.closest(".scalerow")}, e);
}

/* ── Тап ── */
function handleTap(p, t){
  if (Date.now() - lastScrollAt < 80) return;
  if (p.gh){ toggleGroup(p.gh.dataset.g); return; }
  if (p.sc){
    var now = Date.now();
    if (now - lastTapScale < 300){ lastTapScale = 0; var hx = hourAtClientX(t.clientX); applyZoom(M.zoom - 1, hx, t.clientX); }
    else { lastTapScale = now; board.scrollTo({top:0, behavior: REDUCED ? "auto" : "smooth"}); }
    return;
  }
  if (p.rh){ var vi = +p.rh.dataset.v; deselect(); openVehicleSheet(M.vehicles[vi]); return; }
  if (p.segEl){
    var id = p.segEl.dataset.id;
    if (id === "draft"){ if (sheetState === "closed") openSegSheet("draft"); else setDetent("full"); return; }
    if (M.sel === id) openSegSheet(id); else { select(id); vib(6); }
    return;
  }
  if (p.tr && p.tr.dataset.v != null){
    if (M.sel){ deselect(); return; }
    if (M.draft){ return; }
    var h = snapH(hourAtClientX(t.clientX), 0.5);
    createDraft(+p.tr.dataset.v, h, 8, "trip");
    openSegSheet("draft");
  }
}
/* ── Long-press ── */
function onLongPress(){
  if (st !== "PRESSING" || !press) return;
  var p = press; press = null; st = "IDLE";
  if (p.pressEl) p.pressEl.classList.remove("pressing");
  if (p.segEl){ startDrag(p.segEl, {clientX:p.x0, clientY:p.y0}); return; }
  if (p.rh){ vib(12); openVehicleSheet(M.vehicles[+p.rh.dataset.v]); return; }
  if (p.tr && p.tr.dataset.v != null && !M.draft && !M.sel){
    var h = snapH(hourAtClientX(p.x0), 0.5);
    createDraft(+p.tr.dataset.v, h, snapStep(), "trip");
    var el = segEls["draft"]; if (!el) return;
    vib(12); startResize(el, "r", {clientX:p.x0, clientY:p.y0}, true);
  }
}
function createDraft(vi, s, l, kind, extra){
  M.draft = Object.assign({id:"draft", v:vi, kind:kind || "trip", s:clamp(s, 0, HOURS - l), l:l, mg:"", lg:M.me.name || "", from:"", to:"", customer:"", needsData:false, reason:"", tripMode:""}, extra || {});
  /* черновик вне окна рендера (копия «на завтра», «новый рейс» после длинного дальнего) -
     сначала подвинуть ленту, иначе плитки черновика физически нет и ручки/тап не работают */
  if (M.draft.s >= win.e || M.draft.s + M.draft.l <= win.s) scrollToHour(M.draft.s, 0.15, false);
  renderWindow(true); select("draft");
}
function dropDraft(){ if (!M.draft) return; if (M.sel === "draft") deselect(); M.draft = null; var el = segEls["draft"]; if (el){ el.remove(); delete segEls["draft"]; } }

/* ── Драг плитки ── */
var ghostEl = null, slotEl = null, dragRaf = 0;
function startDrag(segEl, t){
  var seg = segById(segEl.dataset.id); if (!seg) return;
  if (!M.online){ vib([30,30]); toast("Нет связи - изменения недоступны", null, null, {err:true}); return; }
  st = "DRAGGING"; vib(12);
  var r = segEl.getBoundingClientRect();
  ghostEl = segEl.cloneNode(true); removeHandles(ghostEl); ghostEl.classList.remove("sel","pressing","src"); ghostEl.classList.add("ghost"); if (!REDUCED) ghostEl.classList.add("lift");
  ghostEl.style.width = r.width + "px"; ghostEl.style.height = r.height + "px"; ghostEl.style.left = "0"; ghostEl.style.top = "0";
  ghostEl.style.transform = "translate3d(" + r.left + "px," + r.top + "px,0) scale(1.04)";
  document.body.appendChild(ghostEl);
  segEl.classList.add("src");
  drag = {seg:seg, id:seg.id, rect0:r, x0:t.clientX, y0:t.clientY, lx:t.clientX, ly:t.clientY, v:seg.v, s:seg.s, locked:false, bad:false, cancel:false, dropV:null};
  if (M.sel && M.sel !== seg.id) deselect();
  $("cancelzone").classList.add("on");
  attachMove(); dragRaf = requestAnimationFrame(dragLoop);
}
function autoscroll(x, y, axes){
  var EX = 48, EY = 56, VX = 14, VY = 10, vx = 0, vy = 0;
  var left = G.bl + G.laneW, right = G.bl + G.bw, top = G.bt + G.scaleH, bottom = G.bt + G.bh;
  function ease(d, E, V){ return d >= E ? 0 : V * Math.pow(1 - Math.max(0, d) / E, 2); }
  if (axes !== "y"){ if (x < left + EX) vx = -ease(x - left, EX, VX); else if (x > right - EX) vx = ease(right - x, EX, VX); }
  if (axes !== "x"){ if (y < top + EY) vy = -ease(y - top, EY, VY); else if (y > bottom - EY) vy = ease(bottom - y, EY, VY); }
  if (vx) board.scrollLeft += vx; if (vy) board.scrollTop += vy;
  return vx || vy;
}
function dragLoop(){
  if (st !== "DRAGGING") return;
  var d = drag, dx = d.lx - d.x0, dy = d.ly - d.y0;
  d.cancel = d.ly < G.bt;
  $("cancelzone").classList.toggle("hot", d.cancel);
  if (!d.cancel) autoscroll(d.lx, d.ly);
  renderWindow(false);
  ghostEl.style.transform = "translate3d(" + (d.rect0.left + dx) + "px," + (d.rect0.top + dy) + "px,0) scale(1.04)";
  var row = rowAtClientY(d.ly); var v = (row && row.type === "v") ? row.v.i : d.v;
  var sRaw = hourAtClientX(d.rect0.left + dx), s = snapH(sRaw);
  var mg = magnet(s, d.seg.l, v, d.id); if (mg.locked !== d.locked){ d.locked = mg.locked; if (mg.locked) vib(4); }
  s = clamp(mg.s, 0, HOURS - d.seg.l);
  var bad = overlaps(v, s, d.seg.l, d.id, d.seg.kind);
  if (!!bad !== d.bad){ d.bad = !!bad; if (bad) vib(30); }
  if (v !== d.dropV){ if (d.dropV != null){ trackEls[d.dropV].classList.remove("drop"); headEls[d.dropV].classList.remove("drop"); } d.dropV = v; trackEls[v].classList.add("drop"); headEls[v].classList.add("drop"); if (v !== d.v) vib(6); }
  d.v = v; d.s = s;
  if (!slotEl){ slotEl = document.createElement("div"); slotEl.className = "slot"; }
  if (slotEl.parentNode !== trackEls[v]) trackEls[v].appendChild(slotEl);
  slotEl.style.left = ((s - win.s) * G.hw) + "px"; slotEl.style.width = (d.seg.l * G.hw) + "px";
  slotEl.classList.toggle("locked", d.locked); slotEl.classList.toggle("bad", d.bad);
  var vv = M.vehicles[v];
  if (d.cancel) showHud("Вернуть на место", "");
  else showHud(fmtDay(s) + " · " + fmtTime(s) + " → " + fmtTime(s + d.seg.l) + " · " + fmtDur(d.seg.l) + '<span class="to">' + (bad ? "Занято: " + esc(segLabel(bad)) : "→ <b>" + esc(vv.gosShort) + "</b> · " + esc(vv.driverShort || "нет водителя")) + "</span>", bad ? "bad" : "");
  dragRaf = requestAnimationFrame(dragLoop);
}
function endDrag(aborted){
  cancelAnimationFrame(dragRaf); detachMove();
  var d = drag; drag = null; st = "IDLE";
  $("cancelzone").classList.remove("on","hot"); hideHud(0);
  if (d.dropV != null){ trackEls[d.dropV].classList.remove("drop"); headEls[d.dropV].classList.remove("drop"); }
  if (slotEl){ slotEl.remove(); }
  var srcEl = segEls[d.id]; if (srcEl) srcEl.classList.remove("src");
  var seg = d.seg;
  function flyBack(){ if (!ghostEl) return; var g = ghostEl; ghostEl = null; if (REDUCED || !srcEl){ g.remove(); return; } var r = srcEl.getBoundingClientRect(); g.style.transition = "transform .34s var(--ease-drawer), opacity .3s ease"; g.style.transform = "translate3d(" + r.left + "px," + r.top + "px,0) scale(1)"; g.style.opacity = "0"; setTimeout(function(){ g.remove(); }, 360); }
  if (aborted || d.cancel){ flyBack(); if (d.cancel) vib(8); return; }
  var bad = overlaps(d.v, d.s, seg.l, d.id, seg.kind);
  if (bad){ flyBack(); vib(30); rejectToast(bad, seg, function(after){ var s2 = clamp(after, 0, HOURS - seg.l); if (overlaps(d.v, s2, seg.l, d.id, seg.kind)){ toast("После тоже занято", null, null, {err:true}); return; } var b = {v:seg.v, s:seg.s}; seg.v = d.v; seg.s = s2; commit(seg, b, "Поставлено после", M.vehicles[d.v].gosShort + " · " + fmtDay(s2) + " " + fmtTime(s2)); }); return; }
  if (d.v === seg.v && d.s === seg.s){ if (ghostEl){ ghostEl.remove(); ghostEl = null; } return; }
  if (ghostEl){ ghostEl.remove(); ghostEl = null; }
  var before = {v:seg.v, s:seg.s}; seg.v = d.v; seg.s = d.s;
  if (seg.id === "draft"){ refreshSeg("draft"); renderSheetIfDraft(); return; }
  var vv = M.vehicles[d.v];
  commit(seg, before, "Перенесено на " + vv.gosShort, fmtDay(d.s) + " " + fmtTime(d.s) + (isVacant(vv) ? " · машина без водителя" : ""));
  if (isVacant(vv)) vib([30,30]);
}

/* ── Растяжка ручками (и протяжка черновика) ── */
var rszRaf = 0;
function startResize(segEl, side, t, isDraftStretch){
  var seg = segById(segEl.dataset.id); if (!seg) return;
  if (!M.online && seg.id !== "draft"){ vib([30,30]); toast("Нет связи - изменения недоступны", null, null, {err:true}); return; }
  st = "RESIZING"; if (!isDraftStretch) vib(12);
  rsz = {seg:seg, side:side, s0:seg.s, l0:seg.l, x0:t.clientX, lx:t.clientX, locked:false, bad:false, stretch:!!isDraftStretch};
  attachMove(); rszRaf = requestAnimationFrame(rszLoop);
}
function rszLoop(){
  if (st !== "RESIZING") return;
  var r = rsz, seg = r.seg;
  autoscroll(r.lx, 0, "x"); renderWindow(false);
  var step = snapStep(), dxH = (r.lx - r.x0) / G.hw, s = seg.s, l = seg.l;
  if (r.side === "r"){ l = Math.max(step, snapH(r.l0 + dxH, step)); var e = s + l; var mg = magnet(e - step, step, seg.v, seg.id); /* магнит по правому краю */ if (mg.locked){ e = mg.s + step; l = Math.max(step, e - s); } if (mg.locked !== r.locked){ r.locked = mg.locked; if (mg.locked) vib(4); } l = Math.min(l, HOURS - s); }
  else { s = snapH(r.s0 + dxH, step); s = Math.min(s, r.s0 + r.l0 - step); var mg2 = magnet(s, 0, seg.v, seg.id); if (mg2.locked) s = Math.min(mg2.s, r.s0 + r.l0 - step); if (mg2.locked !== r.locked){ r.locked = mg2.locked; if (mg2.locked) vib(4); } s = Math.max(0, s); l = r.s0 + r.l0 - s; }
  seg.s = s; seg.l = l;
  var bad = overlaps(seg.v, s, l, seg.id, seg.kind); if (!!bad !== r.bad){ r.bad = !!bad; if (bad) vib(30); }
  var el = segEls[seg.id]; if (el){ placeSeg(el, seg); el.classList.toggle("bad", !!bad); if (M.sel === seg.id) el.classList.add("sel"); }
  showHud((r.side === "r" ? "→ " + fmtTime(s + l) : fmtTime(s) + " →") + " · " + fmtDur(l) + (bad ? '<span class="to">Занято: ' + esc(segLabel(bad)) + "</span>" : ""), bad ? "bad" : "");
  rszRaf = requestAnimationFrame(rszLoop);
}
function restoreResize(){ if (!rsz) return; rsz.seg.s = rsz.s0; rsz.seg.l = rsz.l0; var el = segEls[rsz.seg.id]; if (el){ el.classList.remove("bad"); placeSeg(el, rsz.seg); } }
function finishResize(){ cancelAnimationFrame(rszRaf); detachMove(); hideHud(0); var r = rsz; rsz = null; st = "IDLE"; return r; }
function endResize(){
  var r = rsz, seg = r.seg;
  var bad = overlaps(seg.v, seg.s, seg.l, seg.id, seg.kind);
  if (bad){ restoreResize(); finishResize(); vib(30); rejectToast(bad, seg, null); if (r.stretch) dropDraft(); return; }
  finishResize();
  var el = segEls[seg.id]; if (el) el.classList.remove("bad");
  if (seg.id === "draft"){ refreshSeg("draft"); if (r.stretch) openSegSheet("draft"); else renderSheetIfDraft(); return; }
  if (seg.s === r.s0 && seg.l === r.l0) return;
  commit(seg, {s:r.s0, l:r.l0}, "Длительность " + fmtDur(seg.l), fmtTime(seg.s) + " → " + fmtTime(seg.s + seg.l));
}

/* ── Pinch со ступенями ── */
function dist(e){ var a = e.touches[0], b = e.touches[1]; return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
function centroid(e){ var a = e.touches[0], b = e.touches[1]; return {x:(a.clientX + b.clientX)/2, y:(a.clientY + b.clientY)/2}; }
function startPinch(e){
  st = "PINCHING";
  var c0 = centroid(e), hw0 = G.hw, focalT = hourAtClientX(c0.x);
  var ox = focalT * hw0 - win.s * hw0;
  pinch = {d0:dist(e), c0:c0, hw0:hw0, focalT:focalT, k:1, tx:0, py:c0.y, target:M.zoom, hudShown:false, t0:Date.now()};
  [tracks, scalein].forEach(function(el){ el.classList.remove("anim"); el.style.transformOrigin = ox + "px 0"; el.style.willChange = "transform"; });
  tracks.classList.add("pinching"); canvas.classList.add("pinching");
  attachMove();
}
function movePinch(e){
  var p = pinch, k = dist(e) / p.d0, c = centroid(e);
  var kmin = hwFor(LEVELS.length - 1) / p.hw0, kmax = hwFor(0) / p.hw0;
  if (k > kmax) k = kmax * Math.exp(0.3 * Math.log(k / kmax)); if (k < kmin) k = kmin * Math.exp(0.3 * Math.log(k / kmin));
  p.k = k; p.tx = c.x - p.c0.x;
  board.scrollTop -= (c.y - p.py); p.py = c.y;
  var tf = "translateX(" + p.tx + "px) scaleX(" + k + ")";
  tracks.style.transform = tf; scalein.style.transform = tf; tracks.style.setProperty("--k", k);
  var target = M.zoom;
  if (Math.abs(Math.log(k)) >= Math.log(1.12)){
    var hwT = p.hw0 * k, best = 0, bd = 1e9;
    for (var i = 0; i < LEVELS.length; i++){ var dd = Math.abs(Math.log(hwFor(i)) - Math.log(hwT)); if (dd < bd){ bd = dd; best = i; } }
    target = best;
  }
  if (target !== p.target){ p.target = target; vib(8); }
  if (Date.now() - p.t0 > 80){ showHud(esc(LEVELS[M.zoom].label) + (target !== M.zoom ? " → " + esc(LEVELS[target].label) : ""), "zoom"); }
}
function cleanupPinch(){
  detachMove(); tracks.classList.remove("pinching"); canvas.classList.remove("pinching");
  [tracks, scalein].forEach(function(el){ el.style.transform = ""; el.style.willChange = ""; }); tracks.style.removeProperty("--k");
  hideHud(300); pinch = null;
}
function endPinch(){
  var p = pinch; st = "IDLE";
  tracks.classList.remove("pinching"); canvas.classList.remove("pinching"); detachMove(); hideHud(300);
  applyZoom(p.target, p.focalT, p.c0.x + p.tx, p.k);
  pinch = null;
}

/* ── Скролл: окно рендера, «сейчас», прижим подписей ── */
var scrollRaf = 0, scrollEndTimer = null;
board.addEventListener("scroll", function(){
  lastScrollAt = Date.now();
  if (!scrollRaf) scrollRaf = requestAnimationFrame(function(){ scrollRaf = 0; if (st === "IDLE" || st === "PRESSING"){ renderWindow(false); } renderNow(); });
  clearTimeout(scrollEndTimer); scrollEndTimer = setTimeout(onScrollEnd, 120);
}, {passive:true});
function onScrollEnd(){ pinLabels(); try { sessionStorage.setItem("plan_m_scroll", board.scrollLeft + "," + board.scrollTop); } catch(e){} }

/* ═══════════════════════════════════════════════════════════════════════════
   7. Листы (bottom sheet) и оверлеи
   ═══════════════════════════════════════════════════════════════════════════ */
var sheet = $("sheet"), shHead = $("shHead"), shBody = $("shBody"), shFoot = $("shFoot"), scrim = $("scrim");
var sheetState = "closed", sheetKind = null, sheetData = null, sheetOnClose = null;
/* Кнопка Back (TWA/браузер) закрывает лист/оверлей, а не приложение. Свой счётчик глубины,
   НЕ history.state: history.back() асинхронен, и «закрыл лист -> тут же открыл другой» в одном
   тике читал устаревший state, второй back() уходил СО СТРАНИЦЫ (поймано в превью 05.09). */
var hist = {depth:0, ignore:0};
function histPush(){ history.pushState({d:hist.depth + 1}, ""); hist.depth++; }
function histPop(){ if (hist.depth > 0){ hist.depth--; hist.ignore++; history.back(); } }
function openSheet(kind, data, detent){
  sheetKind = kind; sheetData = data || {};
  sheetState = detent || "full";
  sheet.className = "sheet " + sheetState; scrim.classList.toggle("on", sheetState === "full");
  renderSheet();
  if (hist.depth < 1) histPush();
}
function setDetent(d){ sheetState = d; sheet.className = "sheet " + d; scrim.classList.toggle("on", d === "full"); }
function closeSheet(viaBack){
  if (sheetState === "closed") return;
  var cb = sheetOnClose; sheetOnClose = null;
  /* Черновик живёт только вместе со своим листом: закрыли лист любым путём (свайп, Back,
     «Отмена») - черновик снимается. Иначе на ленте оставалась «синяя рамка», в которую не
     войти (Влад, живая проба 05.09). «Поставить» снимает черновик сам ДО закрытия. */
  var wasDraftSheet = M.draft && (sheetKind === "seg" || sheetKind === "vehicle");
  sheetState = "closed"; sheet.className = "sheet"; scrim.classList.remove("on"); sheetKind = null;
  if (wasDraftSheet) dropDraft();
  if (cb) cb();
  if (!viaBack) histPop();
}
window.addEventListener("popstate", function(){
  if (hist.ignore > 0){ hist.ignore--; return; }
  hist.depth = Math.max(0, hist.depth - 1);
  if (ovlState) closeOvl(true); else if (sheetState !== "closed") closeSheet(true);
});
scrim.addEventListener("click", function(){ if (sheetKind === "seg" && sheetData.id === "draft") setDetent("half"); else closeSheet(); });
/* grip: свайп вниз закрывает, тап - переключает детент */
(function(){
  var g = $("grip"), y0 = 0, moved = false;
  g.addEventListener("touchstart", function(e){ y0 = e.touches[0].clientY; moved = false; }, {passive:true});
  g.addEventListener("touchmove", function(e){ var dy = e.touches[0].clientY - y0; if (Math.abs(dy) > 12) moved = true; }, {passive:true});
  g.addEventListener("touchend", function(e){ var dy = e.changedTouches[0].clientY - y0; if (dy > 60){ if (sheetState === "full" && sheetKind === "seg" && sheetData.id === "draft") setDetent("half"); else closeSheet(); } else if (dy < -40) setDetent("full"); else if (!moved) setDetent(sheetState === "full" ? "half" : "full"); });
  g.addEventListener("click", function(){ if (!("ontouchstart" in window)) setDetent(sheetState === "full" ? "half" : "full"); });

    try { var sc = sessionStorage.getItem("plan_m_scroll"); if (sc){ var p = sc.split(","); board.scrollLeft = +p[0]; board.scrollTop = +p[1]; restored = true; } } catch(e){}
    if (!restored) scrollToHour(nowHour(), 0.3, false);
    renderWindow(true); renderNow(); pinLabels();
    setInterval(function(){ renderNow(); refreshAll(); }, 60000);
  });
  window.addEventListener("resize", function(){
    var V = LEVELS[M.zoom].hours, cH = hourAtClientX(G.bl + G.laneW + G.trackW / 2);
    cacheGeom(); setHw(hwFor(M.zoom)); board.scrollLeft = cH * G.hw - G.trackW / 2; renderWindow(true); renderNow();
  });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden){ renderNow(); } });
}
document.addEventListener("DOMContentLoaded", boot);
</script>
