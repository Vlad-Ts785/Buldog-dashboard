/* ---------- автопрокрутка к краю во время захвата (Влад, 29.08: «при захвате
   плитки должна быть навигация по всей планировке вверх-вниз, влево-вправо») ----------
   Курсор подошёл к краю .board во время любого перетаскивания (плитка/перестановка
   машин/протяжка создания) - лента сама едет в ту сторону, скорость растёт ближе
   к самому краю. Один общий цикл на все три вида захвата. */
var asVX = 0, asVY = 0, asRAF = 0;
function updateAutoscroll(cx, cy){
  var r = board.getBoundingClientRect(), margin = 56, maxSpeed = 16;
  asVX = 0; asVY = 0;
  if (cx < r.left + margin) asVX = -maxSpeed * (1 - Math.max(0, cx - r.left) / margin);
  else if (cx > r.right - margin) asVX = maxSpeed * (1 - Math.max(0, r.right - cx) / margin);
  if (cy < r.top + margin) asVY = -maxSpeed * (1 - Math.max(0, cy - r.top) / margin);
  else if (cy > r.bottom - margin) asVY = maxSpeed * (1 - Math.max(0, r.bottom - cy) / margin);
  if ((asVX || asVY) && !asRAF) asRAF = requestAnimationFrame(autoscrollTick);
}
function stopAutoscroll(){ asVX = 0; asVY = 0; }
function autoscrollTick(){
  if (!drag && !create && !arr){ asRAF = 0; asVX = 0; asVY = 0; return; }
  if (asVX || asVY){
    board.scrollLeft += asVX; board.scrollTop += asVY;
    asRAF = requestAnimationFrame(autoscrollTick);
  } else { asRAF = 0; }
}

/* ---------- перестановка машин: только админ и старший логист ---------- */
var arr = null;
rowsEl.addEventListener("pointerdown", function(e){
  if (!canArrange()) return;
  if (e.target.closest(".hide-btn")) return;
  var head = e.target.closest(".rowhead");
  if (!head) return;
  var row = head.closest(".row");
  e.preventDefault();
  head.setPointerCapture && head.setPointerCapture(e.pointerId);
  head.style.transition = "transform 100ms var(--ease-out-soft)";
  head.style.transform = "scale(.97)";
  arr = {row:row, head:head, x0:e.clientX, y0:e.clientY, lifted:false,
         card:null, cur:0, tgt:0, moved:false};
}, {passive:false});

window.addEventListener("pointermove", function(e){
  if (!arr) return;
  updateAutoscroll(e.clientX, e.clientY);
  var dy = e.clientY - arr.y0;
  if (!arr.lifted){
    if (Math.abs(dy) + Math.abs(e.clientX - arr.x0) < 5) return;
    var r = arr.head.getBoundingClientRect();
    arr.card = document.createElement("div");
    arr.card.className = "rowcard";
    arr.card.innerHTML = arr.head.innerHTML;
    arr.card.style.left = r.left + "px";
    arr.card.style.top = r.top + "px";
    document.body.appendChild(arr.card);
    arr.baseY = r.top; arr.grabY = e.clientY - r.top;
    arr.row.classList.add("ghosted");
    arr.head.style.transform = "";
    arr.lifted = true;
    S.lift();
  }
  arr.tgt = (e.clientY - arr.grabY) - arr.baseY;
  if (prefersReduced() || document.hidden) arr.cur = arr.tgt;
  else arr.cur += (arr.tgt - arr.cur) * 0.28;                        /* тот же lerp 0.28 */
  arr.card.style.transform = "translateY(" + arr.cur + "px) scale(1.03)";

  var over = document.elementFromPoint(arr.card.getBoundingClientRect().left + 20, e.clientY);
  over = over && over.closest ? over.closest(".row") : null;
  if (!over || over === arr.row) return;
  if (over.dataset.grp !== arr.row.dataset.grp) return;              /* трал не станет длинномером */
  flipRows(function(){
    var after = e.clientY > over.getBoundingClientRect().top + over.offsetHeight / 2;
    rowsEl.insertBefore(arr.row, after ? over.nextSibling : over);
  });
  arr.moved = true;
}, {passive:true});

window.addEventListener("pointerup", function(){
  if (!arr) return;
  stopAutoscroll();
  var a = arr; arr = null;
  a.head.style.transform = ""; a.head.style.transition = "";
  if (!a.lifted) return;
  a.row.classList.remove("ghosted");
  if (a.card) a.card.remove();
  if (a.moved){
    STATE.order = [].map.call(rowsEl.querySelectorAll(".row"), function(r){ return parseInt(r.dataset.v, 10); });
    saveOrder();
    S.settle();
    toast("Порядок машин сохранён", null);
  }
});

/* FLIP соседей - 300ms, кривая --ease-flip, как в канбане */
function flipRows(mutate){
  var rows = [].slice.call(rowsEl.querySelectorAll(".row"));
  var before = rows.map(function(r){ return r.getBoundingClientRect().top; });
  mutate();
  if (prefersReduced()) return;
  rows.forEach(function(r, i){
    var d = before[i] - r.getBoundingClientRect().top;
    if (!d) return;
    r.style.transition = "none";
    r.style.transform = "translateY(" + d + "px)";
    requestAnimationFrame(function(){
      r.style.transition = "transform 300ms var(--ease-flip)";
      r.style.transform = "";
    });
  });
}

/* ---------- перетаскивание отрезков: ГОСТ, раздел 6, числа буквально ---------- */
var drag = null, raf = 0;

rowsEl.addEventListener("pointerdown", function(e){
  var el = e.target.closest(".seg");
  if (!el) return;
  var seg = STATE.segs.find(function(s){ return s.id === el.dataset.id; });
  if (!seg) return;
  e.preventDefault();
  el.setPointerCapture(e.pointerId);

  var mode = e.target.classList.contains("hnd")
    ? (e.target.classList.contains("l") ? "resizeL" : "resizeR") : "move";

  el.style.transition = "transform 100ms var(--ease-out-soft)";
  el.style.transform = "scale(.97)";                       /* фаза 1: отклик мгновенно */
  el.style.willChange = "transform";                        /* точечно, см. комментарий у .seg в CSS */

  tCache = {};                                              /* сегменты могли измениться с прошлого драга */
  drag = {el:el, seg:seg, mode:mode, x0:e.clientX, y0:e.clientY,
          s0:seg.s, l0:seg.l, v0:seg.v, lifted:false,
          cur:{x:0,y:0}, tgt:{x:0,y:0}, ph:null, row:null, ok:true,
          track:el.parentNode, targets:magnetTargets(seg.v, seg.id),
          lastEdge:null, lastSnap:null, trashArmed:false};
  if (mode !== "move") S.lift();
}, {passive:false});

var tCache = {};
function targetsFor(vi, selfId){
  var k = vi + "|" + selfId;
  if (!tCache[k]) tCache[k] = magnetTargets(vi, selfId);
  return tCache[k];
}
/* шаг сетки - 30 минут (Влад, 29.08); округляем к ближайшей половине часа всюду,
   где нет примагничивания к конкретной границе */
function roundStep(h){ return Math.round(h * 2) / 2; }
function edgeTick(drag, edge){
  var r = roundStep(edge);
  if (drag.lastEdge !== r){ drag.lastEdge = r; S.tick(); }
}

window.addEventListener("pointermove", function(e){
  if (!drag) return;
  var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  var hw = ZOOM[STATE.zoom];

  if (!drag.lifted && Math.abs(dx) + Math.abs(dy) < 4) return;
  updateAutoscroll(e.clientX, e.clientY);

  if (drag.mode !== "move"){
    var raw = (drag.mode === "resizeR" ? drag.s0 + drag.l0 : drag.s0) + dx / hw;
    var snap = snapHour(raw, drag.targets);
    var val = snap !== null ? snap : roundStep(raw);
    if (drag.mode === "resizeR"){
      drag.seg.l = Math.max(.5, Math.min(HOURS - drag.seg.s, val - drag.seg.s));
    } else {
      var ns = Math.max(0, Math.min(val, drag.s0 + drag.l0 - .5));
      drag.seg.s = ns; drag.seg.l = drag.s0 + drag.l0 - ns;
    }
    drag.el.style.transition = "none";
    drag.el.style.transform = "";
    drag.el.style.setProperty("--s", drag.seg.s);
    drag.el.style.setProperty("--l", drag.seg.l);
    edgeTick(drag, val);                                   /* тик на каждый пройденный получас */
    if (snap !== null){
      if (drag.lastSnap !== snap){
        drag.lastSnap = snap; S.magnet();
        kissEffect(drag.track, val, snap); sparkBurst(drag.track, snap); seamOn(drag.track, snap);
      }
      showMagnet(drag.track, snap);
    } else { drag.lastSnap = null; hideMagnet(); seamOff(); }
    showBadge(drag.seg, e.clientX, e.clientY, snap !== null);
    drag.lifted = true;
    return;
  }

  if (!drag.lifted){ lift(e); }
  /* смещение ОТ точки подъёма, не абсолютная координата */
  drag.tgt.x = (e.clientX - drag.grabX) - drag.baseX;
  drag.tgt.y = (e.clientY - drag.grabY) - drag.baseY;
  /* reduced-motion: rAF-цикл tick() не работает, позицию пишем 1:1 прямо здесь -
     без lerp и наклона, но плитка ОБЯЗАНА следовать за курсором (аудит 29.08:
     раньше она визуально замирала на месте до самого отпускания) */
  if (prefersReduced()){
    drag.cur.x = drag.tgt.x; drag.cur.y = drag.tgt.y;
    drag.el.style.transform = "translate(" + drag.cur.x + "px," + drag.cur.y + "px) scale(1.03)";
  }

  /* корзина - как на смартфонах: появилась в момент подъёма, курсор попал в её
     границы - подсветилась, отпустил здесь - удаление (см. pointerup ниже) */
  trashZone.classList.add("on");
  var tz = trashZone.getBoundingClientRect();
  var overTrash = e.clientX >= tz.left && e.clientX <= tz.right &&
                  e.clientY >= tz.top && e.clientY <= tz.bottom;
  if (overTrash !== drag.trashArmed){
    drag.trashArmed = overTrash;
    trashZone.classList.toggle("armed", overTrash);
    if (overTrash) S.magnet();
  }
  if (overTrash){
    /* целимся в корзину - час/строка сейчас не при делах, гасим их подсказки */
    if (drag.row){ drag.row.classList.remove("drop"); drag.row = null; }
    hideBadge(); hideMagnet();
    return;
  }

  var row = document.elementFromPoint(e.clientX, e.clientY);
  row = row && row.closest ? row.closest(".row") : null;
  if (row !== drag.row){
    if (drag.row) drag.row.classList.remove("drop");
    drag.row = row;
    if (row) row.classList.add("drop");
  }

  /* живое время и примагничивание начала рейса */
  var tk = row ? row.querySelector(".track") : drag.track;
  var vi = tk ? parseInt(tk.dataset.v, 10) : drag.seg.v;
  var tr = tk.getBoundingClientRect();
  var rawS = (e.clientX - drag.grabX - tr.left) / hw;
  /* НАЙДЕНО И ИСПРАВЛЕНО 29.08 (магнит-стенд): targetsFor() отдаёт сырые края
     соседей (их начало/конец). При ПЕРЕМЕЩЕНИИ мы примагничиваем НАЧАЛО своей
     плитки - значит «мой конец коснулся начала соседа» требует цели вида
     (край соседа − моя длина), иначе магнит работал только когда сосед СЛЕВА
     (там начало плитки случайно совпадает с сырым краем), а справа не работал
     вовсе, что Влад и поймал на изолированном стенде. */
  var rawTargets = targetsFor(vi, drag.seg.id);
  var moveTargets = rawTargets.concat(rawTargets.map(function(t){ return t - drag.seg.l; }));
  var snapM = snapHour(rawS, moveTargets);
  drag.previewS = Math.max(0, Math.min(HOURS - drag.seg.l, snapM !== null ? snapM : roundStep(rawS)));
  edgeTick(drag, drag.previewS);
  if (snapM !== null){
    if (drag.lastSnap !== snapM){
      drag.lastSnap = snapM; S.magnet();
      /* точка касания - либо НАЧАЛО плитки коснулось цели напрямую (raw-цель),
         либо КОНЕЦ коснулся (raw-цель через сдвиг на -длину, см. moveTargets
         выше) - выясняем, какой случай, чтобы вспышку рисовать в РЕАЛЬНОЙ точке
         стыка, а не всегда у начала */
      var atStart = rawTargets.some(function(t){ return Math.abs(t - drag.previewS) < 0.01; });
      var contact = atStart ? drag.previewS : drag.previewS + drag.seg.l;
      kissEffect(tk, contact, contact); sparkBurst(tk, contact); seamOn(tk, contact);
    }
    showMagnet(tk, snapM);
  } else { drag.lastSnap = null; hideMagnet(); seamOff(); }
  showBadge({s:drag.previewS, l:drag.seg.l}, e.clientX, e.clientY, snapM !== null);
}, {passive:true});

function lift(e){
  var el = drag.el, r = el.getBoundingClientRect();
  drag.grabX = e.clientX - r.left; drag.grabY = e.clientY - r.top;
  drag.baseX = r.left; drag.baseY = r.top;
  var ph = document.createElement("div");
  ph.style.cssText = "position:absolute;top:11px;height:28px;border-radius:4px;" +
    "background:var(--ph-bg);left:" + (drag.seg.s * ZOOM[STATE.zoom]) + "px;width:" +
    (drag.seg.l * ZOOM[STATE.zoom]) + "px;";
  el.parentNode.appendChild(ph);
  drag.ph = ph;

  el.style.transition = "opacity 140ms var(--ease-out-soft)";
  el.classList.add("lifted");
  el.style.position = "fixed";
  el.style.left = r.left + "px"; el.style.top = r.top + "px";
  el.style.width = r.width + "px";
  document.body.appendChild(el);
  drag.cur.x = 0; drag.cur.y = 0; drag.tgt.x = 0; drag.tgt.y = 0;
  drag.lifted = true;
  if (!prefersReduced()) raf = requestAnimationFrame(tick);
  else el.style.transform = "scale(1.03)";
}

function tick(){
  if (!drag || !drag.lifted || drag.mode !== "move"){ raf = 0; return; }
  var prevX = drag.cur.x;
  if (document.hidden){                                   /* ГОСТ: ветка hidden */
    drag.cur.x = drag.tgt.x; drag.cur.y = drag.tgt.y;
  } else {
    drag.cur.x += (drag.tgt.x - drag.cur.x) * 0.28;       /* lerp 0.28 */
    drag.cur.y += (drag.tgt.y - drag.cur.y) * 0.28;
  }
  var tilt = Math.max(-7, Math.min(7, (drag.tgt.x - drag.cur.x) * 0.10));
  /* сжатие-растяжение по скорости - уровень 3 стенда, одобрено 29.08. НОВЫЙ приём
     раздела 6 ГОСТа (был только lerp/наклон/scale) - записать в DESIGN_SYSTEM.md
     как расширение канона перетаскивания, не тихо. Канал тот же (transform). */
  var vx = drag.cur.x - prevX;
  drag.velHist = (drag.velHist || 0) * 0.6 + vx * 0.4;
  var stretch = prefersReduced() ? 0 : Math.max(-.16, Math.min(.16, drag.velHist * 0.05));
  var sx = 1.03 * (1 + Math.abs(stretch)), sy = 1.03 * (1 - Math.abs(stretch) * 0.5);
  drag.el.style.transform = "translate(" + drag.cur.x + "px," + drag.cur.y +
                            "px) rotate(" + tilt + "deg) scale(" + sx + "," + sy + ")";
  raf = requestAnimationFrame(tick);
}

window.addEventListener("pointerup", function(e){
  if (!drag) return;
  stopAutoscroll();
  var d = drag; drag = null;
  if (raf){ cancelAnimationFrame(raf); raf = 0; }
  if (d.row) d.row.classList.remove("drop");

  var el = d.el, seg = d.seg;
  var before = {s:d.s0, l:d.l0, v:d.v0};
  el.style.willChange = "";                    /* сняли точечный хинт - см. .seg в CSS */

  hideBadge(); hideMagnet(); seamOff();

  if (d.mode !== "move"){
    if (seg.s !== d.s0 || seg.l !== d.l0){
      /* проверка пересечений и у растяжки - раньше была только у переноса, из-за
         чего растяжкой можно было молча закоммитить наложение (аудит 29.08) */
      var rClash = STATE.segs.some(function(x){
        return x !== seg && x.v === seg.v && seg.s < x.s + x.l && x.s < seg.s + seg.l;
      });
      if (rClash){
        seg.s = d.s0; seg.l = d.l0;
        el.style.setProperty("--s", seg.s); el.style.setProperty("--l", seg.l);
        flashBad(el); S.reject();
        toast("Пересечение с другим отрезком - вернул как было", null);
      } else { commit(seg, before, "Отрезок изменён"); S.drop(); }
    }
    el.style.transition = "";
    return;
  }
  if (!d.lifted){
    el.style.transform = ""; el.style.transition = "";
    /* кольцо «открыта в шторке» - персистентный маркер, гаснет в closeDrawer() */
    var prev = rowsEl.querySelector(".seg.is-open");
    if (prev) prev.classList.remove("is-open");
    el.classList.add("is-open");
    STATE.openId = seg.id;
    openDrawer(seg);
    return;
  }

  trashZone.classList.remove("on", "armed");
  if (d.trashArmed){
    /* уронили в корзину - плитка втягивается в иконку и исчезает, ЗАТЕМ удаление
       из данных (тот же путь, что и «Удалить» в шторке - отмена тостом работает
       одинаково что там, что здесь) */
    var cur = el.getBoundingClientRect();
    el.style.left = cur.left + "px"; el.style.top = cur.top + "px"; el.style.transform = "";
    var tzr = trashZone.getBoundingClientRect();
    var dxT = (tzr.left + tzr.width / 2) - (cur.left + cur.width / 2);
    var dyT = (tzr.top + tzr.height / 2) - (cur.top + cur.height / 2);
    requestAnimationFrame(function(){
      el.style.transition = "transform 220ms var(--ease-in-out), opacity 220ms var(--ease-in-out)";
      el.style.transform = "translate(" + dxT + "px," + dyT + "px) scale(.12) rotate(14deg)";
      el.style.opacity = "0";
    });
    if (d.ph) d.ph.remove();
    setTimeout(function(){ el.remove(); deleteSeg(seg); }, 230);
    return;
  }

  var track = d.row ? d.row.querySelector(".track") : null;
  var newS = seg.s, newV = seg.v;
  if (track){
    newS = d.previewS != null ? d.previewS : newS;                  /* уже примагничено выше */
    newV = parseInt(track.dataset.v, 10);
  }
  var clash = STATE.segs.some(function(s){
    return s !== seg && s.v === newV && newS < s.s + s.l && s.s < newS + seg.l;
  });

  /* вернуть в поток и уложить по FLIP с overshoot */
  var r1 = el.getBoundingClientRect();
  el.style.position = ""; el.style.left = ""; el.style.top = ""; el.style.width = "";
  el.classList.remove("lifted");
  if (!clash){ seg.s = newS; seg.v = newV; }
  var destTrack = clash ? d.ph.parentNode
    : rowsEl.querySelector('.track[data-v="' + newV + '"]') || d.ph.parentNode;
  el.style.setProperty("--s", seg.s); el.style.setProperty("--l", seg.l);
  destTrack.appendChild(el);
  if (d.ph) d.ph.remove();

  var r2 = el.getBoundingClientRect();
  el.style.transition = "none";
  el.style.transform = "translate(" + (r1.left - r2.left) + "px," + (r1.top - r2.top) + "px) scale(1.03)";
  requestAnimationFrame(function(){
    el.style.transition = "transform 380ms var(--ease-overshoot),opacity 140ms var(--ease-out-soft)";
    el.style.transform = "";
    setTimeout(function(){ el.style.transition = ""; }, 400);  /* вернуть штатные переходы */
  });

  if (clash){ flashBad(el); S.reject(); toast("Пересечение с другим отрезком - не поставил", null); }
  else if (before.s !== seg.s || before.v !== seg.v){
    S.drop();
    commit(seg, before, before.v !== seg.v ? "Перенесено на другую машину" : "Сдвинуто по времени");
  }
});

function flashBad(el){
  el.classList.add("bad");
  setTimeout(function(){ el.classList.remove("bad"); }, 600);
}
function commit(seg, before, text){
  STATE.lastEdited = seg.s;                    /* смена масштаба целится сюда, см. клик по "Масштаб" */
  toast(text, function(){
    S.undo();
    seg.s = before.s; seg.l = before.l; seg.v = before.v;
    STATE.lastEdited = before.s;
    renderRows();
  });
  renderKpis();
}

/* ---------- создание записи: протяжка по пустому месту трека, либо двойной клик
   (Влад, 29.08: «методику создания заказа... может быть правой клавишей, может
   быть двойные щелчки, может быть плитки, которые перетаскиваем на линию»).
   Выбран вариант «рисуем протяжкой прямо на линии времени» - использует ТУ ЖЕ
   физику магнита/тика/бейджика, что и растяжка существующего отрезка (раздел 6),
   плюс двойной клик как быстрый путь без протяжки (создаёт запись на 4 часа). ---------- */
var create = null;
rowsEl.addEventListener("pointerdown", function(e){
  if (e.target.closest(".seg") || e.target.closest(".rowhead") || e.target.closest(".hide-btn")) return;
  var track = e.target.closest(".track");
  if (!track) return;
  var vi = parseInt(track.dataset.v, 10);
  var hw = ZOOM[STATE.zoom];
  var tr = track.getBoundingClientRect();
  var startRaw = (e.clientX - tr.left) / hw;
  var targets = magnetTargets(vi, null);
  var snap0 = snapHour(startRaw, targets);
  create = {track:track, vi:vi, x0:e.clientX, s0:snap0 !== null ? snap0 : roundStep(startRaw),
            targets:targets, ghost:null, lastEdge:null, lastSnap:null, moved:false};
});
window.addEventListener("pointermove", function(e){
  if (!create) return;
  var hw = ZOOM[STATE.zoom];
  var dx = e.clientX - create.x0;
  if (!create.moved && Math.abs(dx) < 4) return;
  updateAutoscroll(e.clientX, e.clientY);
  if (!create.ghost){
    create.ghost = document.createElement("div");
    create.ghost.className = "seg-draft";
    create.track.appendChild(create.ghost);
    create.moved = true;
  }
  var endRaw = create.s0 + dx / hw;
  var snap = snapHour(endRaw, create.targets);
  var endVal = snap !== null ? snap : roundStep(endRaw);
  var lo = Math.min(create.s0, endVal), hi = Math.max(create.s0, endVal);
  create.s = lo; create.l = Math.max(.5, hi - lo);
  create.ghost.style.setProperty("--s", create.s);
  create.ghost.style.setProperty("--l", create.l);
  edgeTick(create, endVal);
  if (snap !== null){
    if (create.lastSnap !== snap){ create.lastSnap = snap; S.magnet(); }
    showMagnet(create.track, snap);
  } else { create.lastSnap = null; hideMagnet(); }
  showBadge({s:create.s, l:create.l}, e.clientX, e.clientY, snap !== null);
});
window.addEventListener("pointerup", function(){
  if (!create) return;
  stopAutoscroll();
  var c = create; create = null;
  hideBadge(); hideMagnet();
  if (c.ghost) c.ghost.remove();
  if (!c.moved) return;                          /* просто клик по пустому месту - ничего не делаем */
  openCreateDrawer(c.vi, c.s, c.l);
});
rowsEl.addEventListener("dblclick", function(e){
  if (e.target.closest(".seg") || e.target.closest(".rowhead")) return;
  var track = e.target.closest(".track");
  if (!track) return;
  var vi = parseInt(track.dataset.v, 10);
  var hw = ZOOM[STATE.zoom];
  var tr = track.getBoundingClientRect();
  var raw = (e.clientX - tr.left) / hw;
  var snap = snapHour(raw, magnetTargets(vi, null));
  openCreateDrawer(vi, snap !== null ? snap : roundStep(raw), 8);   /* смена по умолчанию - 8 часов */
});

/* ---------- шторка ---------- */
var scrim = document.getElementById("scrim"), drawer = document.getElementById("drawer");

function openCreateDrawer(vi, s, l){
  var v = STATE.vehicles[vi];
  var kind = "trip", mgIdx = 0, lgIdx = 0, fromVal = "", toVal = "";
  function render(){
    var isTrip = kind === "trip";
    var logistPool = v.long ? LOG_LONG : LOG_TRAL;
    var typeBtns = [["trip","Рейс"], ["repair","Ремонт"], ["maint","ТО"], ["driveroff","Выходной"]];
    drawer.innerHTML =
      '<div class="dr-eyebrow">Новая запись</div>' +
      '<div class="dr-title">' + v.type + " · " + v.gos + '</div>' +
      '<div class="dr-row"><span>Начало</span><span class="mono">' + fmt(s) + '</span></div>' +
      '<div class="dr-row"><span>Окончание</span><span class="mono">' + fmt(s + l) + " (" + l + ' ч)</span></div>' +
      '<div class="cr-types">' + typeBtns.map(function(p){
        return '<button class="chip cr-type" data-k="' + p[0] + '" aria-pressed="' + (kind === p[0]) + '">' + p[1] + '</button>';
      }).join("") + '</div>' +
      (isTrip ?
        '<div class="cr-field"><span class="grp-label">Менеджер</span><div class="cr-opts" id="crMg">' +
          MANAGERS.map(function(m, i){ return '<button class="chip cr-opt" data-i="' + i + '" aria-pressed="' + (i === mgIdx) + '">' + personShort(m) + '</button>'; }).join("") +
        '</div></div>' +
        '<div class="cr-field"><span class="grp-label">Логист</span><div class="cr-opts" id="crLg">' +
          logistPool.map(function(p, i){ return '<button class="chip cr-opt" data-i="' + i + '" aria-pressed="' + (i === lgIdx) + '">' + personShort(p) + '</button>'; }).join("") +
        '</div></div>' +
        '<div class="cr-field"><span class="grp-label">Откуда</span><input class="cr-input" id="crFrom" list="crPlaces" value="' + fromVal + '"></div>' +
        '<div class="cr-field"><span class="grp-label">Куда</span><input class="cr-input" id="crTo" list="crPlaces" value="' + toVal + '"></div>' +
        '<datalist id="crPlaces">' + PLACES.map(function(p){ return "<option value=\"" + p + "\">"; }).join("") + '</datalist>'
        : '') +
      '<div class="dr-note">Длину и время можно поправить прямо на ленте - потянуть за край, как у обычного отрезка.</div>' +
      '<div class="cr-actions"><button class="chip cr-cancel">Отмена</button><button class="chip cr-submit" aria-pressed="true">Создать</button></div>';

    [].forEach.call(drawer.querySelectorAll(".cr-type"), function(btn){
      btn.onclick = function(){ kind = btn.dataset.k; render(); };
    });
    if (isTrip){
      [].forEach.call(drawer.querySelector("#crMg").children, function(btn, i){ btn.onclick = function(){ mgIdx = i; render(); }; });
      [].forEach.call(drawer.querySelector("#crLg").children, function(btn, i){ btn.onclick = function(){ lgIdx = i; render(); }; });
      drawer.querySelector("#crFrom").oninput = function(ev){ fromVal = ev.target.value; };
      drawer.querySelector("#crTo").oninput = function(ev){ toVal = ev.target.value; };
    }
    drawer.querySelector(".cr-cancel").onclick = closeDrawer;
    drawer.querySelector(".cr-submit").onclick = function(){
      var clash = STATE.segs.some(function(x){ return x.v === vi && s < x.s + x.l && x.s < s + l; });
      if (clash){ S.reject(); toast("Пересечение с другим отрезком - не создал", null); return; }
      if (kind === "driveroff") pushDriver(v, s, l);
      else if (kind === "trip") push(v, "trip", s, l, {mg:MANAGERS[mgIdx], lg:logistPool[lgIdx], from:fromVal || PLACES[0], to:toVal || PLACES[1]});
      else push(v, kind, s, l);
      STATE.lastEdited = s;
      closeDrawer();
      renderRows(); renderKpis();
      S.drop();
      toast(isTrip ? "Заявка создана" : "Запись добавлена", null);
    };
  }
  render();
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
  scrim.classList.add("open");
}
function openDrawer(seg){
  var v = STATE.vehicles[seg.v];
  var rows = [["Машина", v.type + " · " + v.gos], ["Тягач", v.tractor],
              ["Прицеп", (v.trailer || "-") + (v.trailerGos ? " · " + v.trailerGos : "")],
              ["Водитель", v.driver || "нет"], ["График", v.schedule || "-"]];
  if (seg.kind === "trip"){
    rows = [["Маршрут", seg.from + " → " + seg.to], ["Менеджер", seg.mg.code + " " + seg.mg.full],
            ["Логист", seg.lg.code + " " + seg.lg.full],
            ["Начало", fmt(seg.s)], ["Окончание", fmt(seg.s + seg.l)],
            ["Длительность", durLabel(seg.l)]].concat(rows);
  } else {
    rows = [["Состояние", segLabel(seg)], ["Начало", fmt(seg.s)],
            ["Окончание", fmt(seg.s + seg.l)], ["Длительность", durLabel(seg.l)]].concat(rows);
  }
  drawer.innerHTML = '<div class="dr-eyebrow">' +
    (seg.kind === "trip" ? "Рейс" : "Состояние машины") + '</div>' +
    '<div class="dr-title">' + segLabel(seg) + "</div>" +
    rows.map(function(p){
      return '<div class="dr-row"><span>' + p[0] + '</span><span class="' +
        (/Начало|Окончание|Длительность|Машина/.test(p[0]) ? "mono" : "") + '">' + p[1] + "</span></div>";
    }).join("") +
    '<div class="dr-note">Паспортные данные водителя для пропуска здесь не показаны намеренно: ' +
    'они живут в карточке водителя на сервере и отдаются по роли, с записью в журнал. ' +
    'Это следующий шаг - он же убирает у логиста поток запросов «скинь данные на пропуск».</div>' +
    '<div class="dr-actions">' +
    '<button class="chip dr-close" id="drClose">Закрыть</button>' +
    '<button class="chip dr-del" id="drDel" title="Удалить запись">' + ICON_TRASH + " Удалить</button>" +
    '</div>';
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
  scrim.classList.add("open");
  document.getElementById("drClose").onclick = closeDrawer;
  document.getElementById("drDel").onclick = function(){ deleteSeg(seg); };
}
/* корзина - Влад, 29.08: «где-то должна появляться корзина, куда можно удалить
   заказ». Кладём в шторку (уже открыта по клику на плитку) + отмена тостом, как
   у любого другого разрушающего действия на доске. */
function deleteSeg(seg){
  var idx = STATE.segs.indexOf(seg);
  if (idx < 0) return;
  STATE.segs.splice(idx, 1);
  STATE.lastEdited = seg.s;
  closeDrawer();
  renderRows(); renderKpis();
  S.del();
  toast("Запись удалена", function(){
    STATE.segs.splice(idx, 0, seg);
    STATE.lastEdited = seg.s;
    S.undo();
    renderRows(); renderKpis();
  });
}
function closeDrawer(){
  drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true");
  scrim.classList.remove("open");
  var open = rowsEl.querySelector(".seg.is-open");
  if (open) open.classList.remove("is-open");
  STATE.openId = null;
}
scrim.onclick = closeDrawer;
window.addEventListener("keydown", function(e){ if (e.key === "Escape") closeDrawer(); });
function fmt(h){
  var d = Math.floor(h / 24) + 1, rem = ((h % 24) + 24) % 24;
  var hh = Math.floor(rem), mm = Math.round((rem - hh) * 60);
  if (mm === 60){ mm = 0; hh += 1; }
  return (d > DAYS ? DAYS : d) + "." + (MONTH + 1 < 10 ? "0" : "") + (MONTH + 1) +
         " " + (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
}

/* ---------- тост ---------- */
var toastEl = document.getElementById("toast"), toastT = 0;
function toast(text, undoFn){
  document.getElementById("toastText").textContent = text;
  var btn = document.getElementById("toastBtn");
  btn.style.display = undoFn ? "" : "none";
  btn.onclick = function(){ if (undoFn) undoFn(); hideToast(); };
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, 5000);
}
function hideToast(){ toastEl.classList.remove("show"); }

/* ---------- управление ---------- */
document.querySelector(".controls").addEventListener("click", function(e){
  var b = e.target.closest(".chip");
  if (!b) return;

  if (b.dataset.solo){                                    /* переключатели сами по себе */
    if (b === document.getElementById("sndBtn")){
      soundOn = !soundOn;
      b.setAttribute("aria-pressed", String(soundOn));
      b.textContent = soundOn ? "Звук вкл" : "Звук выкл";
    } else if (b === document.getElementById("hiddenBtn")){
      STATE.showHidden = !STATE.showHidden;
      b.setAttribute("aria-pressed", String(STATE.showHidden));
      renderRows();
    } else if (b === document.getElementById("themeBtn")){
      toggleTheme();
    }
    return;
  }

  var grp = b.parentNode;
  [].forEach.call(grp.querySelectorAll(".chip"), function(x){ x.setAttribute("aria-pressed", "false"); });
  b.setAttribute("aria-pressed", "true");

  if (b.dataset.zoom){
    /* Влад, 29.08: «при смене масштаба - попадаешь на блок, который редактировал
       последним». Если за сессию уже что-то трогали - целимся туда, а не в центр
       текущей прокрутки; если ещё ничего не редактировали - ведём себя как раньше
       (остаёмся на том же дне, куда были прокручены). */
    var oldZoom = STATE.zoom;
    var h = STATE.lastEdited != null ? STATE.lastEdited
      : board.scrollLeft / ZOOM[oldZoom] + (board.clientWidth / 2) / ZOOM[oldZoom];
    STATE.zoom = b.dataset.zoom;
    saveSettings();
    renderAll();
    primeTo(rangeStart(h, STATE.zoom));                    /* прицел к началу нового диапазона */
  } else if (b.dataset.color){ STATE.color = b.dataset.color; saveSettings(); renderRows(); renderLegend(); }
  else if (b.dataset.filter){ STATE.filter = b.dataset.filter; saveSettings(); renderRows(); }
  else if (b.dataset.role){
    STATE.role = b.dataset.role;
    if (!canArrange()) STATE.showHidden = false;            /* режим «показать скрытые» - только у роли, что скрывает */
    document.body.classList.toggle("can-arrange", canArrange());
    renderRows(); renderLegend(); renderHiddenCount();
  }
});

function prefersReduced(){
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/* живые значения обязаны тикать - ГОСТ, раздел 0 п.6 */
function tickClock(){
  var d = new Date(), p = function(n){ return (n < 10 ? "0" : "") + n; };
  document.getElementById("clock").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
setInterval(tickClock, 1000);
setInterval(function(){
  var hw = ZOOM[STATE.zoom], x = nowHour() * hw;
  [].forEach.call(document.querySelectorAll(".now"), function(n){ n.style.left = x + "px"; });
  var nh = document.getElementById("nowHead"); if (nh) nh.style.left = x + "px";
  renderKpis();
  /* прошлое/прогресс пересчитываются тем же минутным тиком (не отдельный таймер);
     во время жеста не дёргаем DOM - дорисуем следующим тиком */
  if (!drag && !create && !arr) renderRows();
}, 60000);

loadTheme();
loadOrder();
loadSettings();
buildVehicles();
STATE.typeLegend = buildTypeLegend();
syncControlChips();
renderAll();
tickClock();
/* «Сейчас» ставим в правую треть: в Штатке текущий день заполняют задним числом,
   и если встать вплотную к «сейчас», экран выглядит пустым не по вине ленты. */
board.scrollLeft = Math.max(0, (nowHour() - 42) * ZOOM[STATE.zoom]);
</script>
