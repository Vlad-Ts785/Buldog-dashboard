<title>Планировка ЯРД</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  /* ---- ГОСТ, раздел 1: токены. Дашборд по ГОСТу тёмный единственно, но здесь -
     ЭКСПЕРИМЕНТ по прямой просьбе Влада, 29.08: кнопка светлого режима для этого
     инструмента, НЕ системная тема - логист переключает сам. Явный toggle кладёт
     data-theme="light" на <html>; ниже переопределяются только поверхностные и
     служебные токены, акцентные (green/red/amber/blue/purple) - те же, что в
     остальном дашборде, тема их не трогает. Пока не в DESIGN_SYSTEM.md - решение
     принимать после того, как Влад пощупает переключатель на практике. ---- */
  --bg:#0f0f13; --bg2:#17171d; --bg3:#1e1e26; --bg4:#252530;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
  --text:#e8e6df; --muted:#8b8980;
  --row-hover:#191920; --grid-line:rgba(255,255,255,.055); --weekend-tint:rgba(255,255,255,.022);
  --ph-bg:rgba(255,255,255,.05);
  --green:#1D9E75; --red:#E24B4A; --amber:#EF9F27; --blue:#378ADD; --purple:#7F77DD;
  /* приглушённые надписи ПО ЦВЕТУ поверх translucent-заливок (бейджи техники,
     состояния отрезков) - на тёмном фоне светлый тон, на светлом тёмный тон
     одного и того же hue, чтобы контраст не проваливался при переключении темы */
  --tint-green:#8fd9bf; --tint-blue:#a9cdf2; --tint-amber:#f0c98a;
  --tint-purple:#c1bcf0; --tint-red:#eeadac;
  --seg-text-onfill:#e8e6df;

  /* ---- ГОСТ, раздел 5: кривые (структурные, тема их не касается) ---- */
  --ease-out-strong:cubic-bezier(0.16,1,0.3,1);
  --ease-out-soft:cubic-bezier(0.25,1,0.5,1);
  --ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --ease-flip:cubic-bezier(.22,.9,.28,1);
  --ease-overshoot:cubic-bezier(.34,1.45,.5,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);

  /* ---- ПРЕДЛОЖЕНИЕ, в ГОСТе ещё нет: палитра принадлежности (структурная) ----
     12 слотов для режимов «раскрасить по менеджеру / по логисту».
     Выведены из пяти канонических тонов сдвигом светлоты, новых семейств не заводим. */
  --id-1:#1D9E75; --id-2:#378ADD; --id-3:#EF9F27; --id-4:#7F77DD; --id-5:#E24B4A; --id-6:#2FBF9A;
  --id-7:#5FA8E8; --id-8:#C9812A; --id-9:#A79BE8; --id-10:#B85C5B; --id-11:#158060; --id-12:#2C6DAF;

  /* ВАЖНО: эти три ниже - структурные размеры, НЕ цвет темы. Раньше жили внутри
     :root[data-theme="light"] по ошибке правки 29.08 - в тёмной теме (значение по
     умолчанию) были не определены, из-за чего width:var(--lane-w) у каждой строки
     схлопывался «по содержимому» вместо фиксированных 236px - отсюда была
     диагональная «лестница» замороженной колонки, которую поймал Влад. */
  --hw:17px;          /* ширина одного часа - меняется зумом, не темой */
  --lane-w:236px;     /* замороженная левая колонка */
  --row-h:52px;       /* было 44 - Влад, 29.08: полоски шире по вертикали */
}
:root[data-theme="light"]{
  --bg:#f2f4f7; --bg2:#ffffff; --bg3:#eceff3; --bg4:#e1e5eb;
  --border:rgba(20,26,38,0.10); --border-strong:rgba(20,26,38,0.20);
  --text:#1b1f27; --muted:#5c6474;
  --row-hover:#eaeef3; --grid-line:rgba(20,26,38,.09); --weekend-tint:rgba(20,26,38,.035);
  --ph-bg:rgba(20,26,38,.055);
  --tint-green:#0f6a4c; --tint-blue:#1c5ea8; --tint-amber:#8a5a12;
  --tint-purple:#584fb0; --tint-red:#a23b3a;
  --seg-text-onfill:#1b1f27;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:13px; overflow:hidden;
  /* flex-колонка на всю высоту экрана - раньше .board-wrap считал свою высоту
     как calc(100vh - 128px) магическим числом, а когда шапка выросла (добавился
     ряд перехода по месяцам), число не обновили - .board-wrap стал на ~90px выше
     реального остатка экрана, и корзина у его нижнего края уехала ЗА пределы
     видимой области (Влад, 29.08: «я не увидел корзины» - она рисовалась,
     физически ниже экрана). Flex сам считает остаток независимо от высоты шапки. */
  height:100vh; display:flex; flex-direction:column;
}
.mono{font-family:'JetBrains Mono',ui-monospace,'Cascadia Mono',monospace;font-variant-numeric:tabular-nums;}

/* ================= Шапка ================= */
.top{
  flex:none;
  display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;
  padding:16px 22px 12px;border-bottom:1px solid var(--border);background:var(--bg2);
  position:relative;z-index:30;
}
h1{
  font-family:'Unbounded',system-ui,sans-serif;font-weight:600;font-size:19px;
  margin:0;letter-spacing:-0.01em;line-height:1.1;
}
.sub{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.02em;}
/* переход между месяцами - Влад, 29.08: «стрелки, просто переход, без прогрузки».
   В демо реальные данные есть только за август 2026 - соседний месяц честно
   говорит об этом тостом, а не подсовывает выдуманный график под видом настоящего
   (см. правило проекта "цифры бьются везде" - никогда не показывать похожее на
   реальные данные там, где их нет). */
/* position:absolute, не в потоке .controls - Влад, 29.08: «перенеси в
   противоположную сторону экрана от надписи "Планировка"». Обычным flex-порядком
   («последняя группа в .controls») этого не добиться надёжно: .controls сам
   переносится на вторую строку при узком окне (много чипов фильтров), и тогда
   последняя группа съезжает влево, а не остаётся у правого края - поймано числами
   при проверке (492px из 1400 - это середина экрана, не угол). Абсолютное
   позиционирование от .top (у него уже position:relative) держит правый верхний
   угол железно, независимо от того, сколько чипов ниже переносится. */
.monthnav{
  position:absolute;top:16px;right:22px;z-index:31;
  display:flex;align-items:center;gap:4px;
}
.monthnav-btn{
  appearance:none;border:1px solid var(--border);background:var(--bg3);color:var(--muted);
  width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:color .12s ease-out,border-color .12s ease-out;
}
.monthnav-btn:hover{color:var(--text);border-color:var(--border-strong);}
.monthnav-btn svg{width:13px;height:13px;}
.monthnav-label{font-size:11px;color:var(--muted);min-width:96px;text-align:center;}
.spacer{flex:1 1 auto;}

.kpis{display:flex;gap:2px;align-items:stretch;}
.kpi{padding:4px 14px 4px 0;margin-right:12px;border-right:1px solid var(--border);}
.kpi:last-child{border-right:0;margin-right:0;}
.kpi-label{
  font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px;white-space:nowrap;
}
.kpi-val{font-size:17px;font-weight:600;line-height:1;}

.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.grp{display:flex;align-items:center;gap:6px;}
.grp-label{
  font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  margin-right:2px;
}
.chip{
  appearance:none;border:1px solid var(--border);background:var(--bg3);color:var(--muted);
  font-family:inherit;font-size:11.5px;font-weight:500;padding:5px 11px;border-radius:8px;cursor:pointer;
  transition:border-color .15s var(--ease-out-soft),color .15s var(--ease-out-soft),background-color .15s var(--ease-out-soft);
}
.chip:hover{color:var(--text);border-color:var(--border-strong);}
.chip[aria-pressed="true"]{background:var(--bg4);color:var(--text);border-color:var(--border-strong);}
.chip:focus-visible,.toast button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px;}

/* ================= Легенда ================= */
.legend{
  flex:none;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  padding:8px 22px;border-bottom:1px solid var(--border);background:var(--bg);
  font-size:10.5px;color:var(--muted);position:relative;z-index:20;
}
.lg{display:flex;align-items:center;gap:6px;}
.sw{width:16px;height:9px;border-radius:3px;flex:none;}
.lg-note{margin-left:auto;font-size:10px;opacity:.75;}

/* ================= Доска ================= */
.board-wrap{position:relative;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden;}
.board{position:relative;flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:auto;}
/* Влад, 29.08: «добавить нормальные горизонтальный и вертикальный скроллы, чтобы
   зажал и таскал, как обычный документ/сайт» - было scrollbar-width:thin (едва
   заметная полоска), теперь полноразмерный стилизованный скролл в обе стороны. */
.board::-webkit-scrollbar{width:14px;height:14px;}
.board::-webkit-scrollbar-track{background:var(--bg2);}
.board::-webkit-scrollbar-thumb{
  background:var(--bg4);border:3px solid var(--bg2);border-radius:8px;
}
.board::-webkit-scrollbar-thumb:hover{background:var(--border-strong);}
.board::-webkit-scrollbar-corner{background:var(--bg2);}

/* Мини-скраббер снизу БЫЛ и УДАЛЁН (Влад, 29.08: «убери, основного скролла
   достаточно») - осталась полноразмерная нативная полоса .board выше. */
/* Курсорного света здесь НЕТ - осознанное отступление от ГОСТа раздела 7
   (обычно обязателен на каждой странице). Влад, 29.08: на BI-панели курсор
   почти неподвижен, а здесь логист непрерывно ведёт мышью по сетке весь день -
   бегущее свечение под курсором на рабочем инструменте раздражает, а не украшает.
   См. `plans/2026-08-29-logistics-planning-board.md`, раздел «Отступления от ГОСТа». */

/* width:max-content обязателен: sticky-элемент липнет только внутри своего
   родителя, а строка шириной с экран уносит левую колонку при скролле вправо */
.head{
  position:sticky;top:0;z-index:14;display:flex;background:var(--bg2);
  border-bottom:1px solid var(--border-strong);
  width:max-content;min-width:100%;
}
.head-corner{
  position:sticky;left:0;z-index:16;width:var(--lane-w);flex:none;background:var(--bg2);
  border-right:1px solid var(--border-strong);padding:7px 12px;
  display:flex;flex-direction:column;justify-content:center;
}
.head-corner .t1{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
.head-corner .t2{font-size:11px;color:var(--text);margin-top:3px;}
.head-scale{position:relative;flex:none;height:46px;}
.day{
  position:absolute;top:0;height:46px;border-left:1px solid var(--border-strong);
  padding:5px 0 0 6px;overflow:hidden;cursor:pointer;
}
.day.weekend{background:var(--weekend-tint);}
.day.today{background:rgba(55,138,221,.07);}
.day-n{font-size:11px;font-weight:600;line-height:1;}
.day-w{font-size:9px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}
.hours{position:absolute;left:0;right:0;bottom:0;height:13px;}
.hr{position:absolute;bottom:0;font-size:8.5px;color:var(--muted);line-height:1;}
:root:not(.z-day) .hr{display:none;}

.rows{position:relative;z-index:1;width:max-content;min-width:100%;}
/* Влад, 29.08: «нет разделительной линии, выглядит как незаконченная таблица» -
   так и было: .grouphead был шириной ТОЛЬКО замороженной колонки (var(--lane-w)),
   верх/низ-бордер обрывался ровно на её границе, а вся полоса времени справа
   оставалась вообще без черты. Теперь бордер - на ПОЛНОШИРИННОЙ внешней полосе
   (тот же приём max-content/min-width:100%, что и у .row), текст-ярлык - на
   sticky-обёртке ВНУТРИ неё (тот же паттерн, что у .seg-label). Заодно кликабельна
   вся полоса целиком, не только узкий ярлык слева. */
.grouphead{
  position:relative;z-index:12;display:flex;align-items:center;
  height:26px;background:var(--bg);cursor:pointer;user-select:none;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  width:max-content;min-width:100%;
}
.grouphead-label{
  position:sticky;left:0;z-index:1;display:flex;align-items:center;gap:8px;
  width:var(--lane-w);flex:none;padding:0 12px;
}
.grouphead b{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
.grouphead i{font-style:normal;font-size:10px;color:var(--muted);opacity:.7;}
.gh-chev{width:12px;height:12px;flex:none;color:var(--muted);transition:transform .15s var(--ease-out-soft);}
.grouphead.collapsed .gh-chev{transform:rotate(-90deg);}

.row{display:flex;height:var(--row-h);border-bottom:1px solid var(--border);width:max-content;min-width:100%;}
.row.ghosted .rowhead,.row.ghosted .track{opacity:.28;}
.row.shifting{will-change:transform;}
.rowcard{
  position:fixed;z-index:960;pointer-events:none;width:var(--lane-w);height:var(--row-h);
  background:var(--bg3);border:1px solid var(--border-strong);border-radius:8px;
  padding:5px 10px;overflow:hidden;opacity:.82;
  box-shadow:0 2px 6px rgba(0,0,0,.4),0 16px 32px rgba(0,0,0,.5);
}
.row.drop{background:rgba(29,158,117,.07);box-shadow:inset 0 0 0 1.5px rgba(29,158,117,.4);
  transition:background-color .15s ease-out,box-shadow .15s ease-out;}
.rowhead{
  position:sticky;left:0;z-index:10;width:var(--lane-w);flex:none;background:var(--bg2);
  border-right:1px solid var(--border-strong);padding:5px 10px;overflow:hidden;
  transition:background-color .12s ease-out;
}
.row:hover .rowhead{background:var(--row-hover);}
body.can-arrange .rowhead{cursor:grab;touch-action:none;}
body.can-arrange .rowhead:active{cursor:grabbing;}
.rh1{display:flex;align-items:center;gap:7px;line-height:1;}
.tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.04em;
  padding:2px 5px;border-radius:3px;background:var(--bg4);color:var(--muted);flex:none;
}
/* семейство техники цветом - те же группы, что логисты держат в голове
   (в их таблице это правила «Раздвижка / Корыто / Рапид / Бортовой / Площадка»).
   Внутри razd/koryto - 4 тональности одного оттенка по рангу (см. typeRank в JS):
   больше осей/раздвижнее = темнее заливка, текст остаётся тем же для читаемости. */
.tag.f-razd-1  {background:rgba(29,158,117,.10); color:var(--tint-green);}
.tag.f-razd-2  {background:rgba(29,158,117,.18); color:var(--tint-green);}
.tag.f-razd-3  {background:rgba(29,158,117,.27); color:var(--tint-green);}
.tag.f-razd-4  {background:rgba(29,158,117,.38); color:var(--tint-green);}
.tag.f-koryto-1{background:rgba(55,138,221,.10); color:var(--tint-blue);}
.tag.f-koryto-2{background:rgba(55,138,221,.18); color:var(--tint-blue);}
.tag.f-koryto-3{background:rgba(55,138,221,.27); color:var(--tint-blue);}
.tag.f-koryto-4{background:rgba(55,138,221,.38); color:var(--tint-blue);}
.tag.f-rapid {background:rgba(239,159,39,.20); color:var(--tint-amber);}
.tag.f-bort  {background:rgba(127,119,221,.22);color:var(--tint-purple);}
.tag.f-panel {background:rgba(226,75,74,.18);  color:var(--tint-red);}
.gos{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:-.01em;}
.rh2{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rh2 .nd{color:var(--red);}
.hide-btn{
  position:absolute;right:8px;top:8px;width:18px;height:18px;border-radius:5px;
  background:var(--bg4);border:1px solid var(--border);color:var(--muted);
  display:none;align-items:center;justify-content:center;cursor:pointer;
  transition:color .12s ease-out,border-color .12s ease-out;
}
body.can-arrange .row:hover .hide-btn{display:flex;}
.hide-btn:hover{color:var(--text);border-color:var(--border-strong);}
.hide-btn svg{width:11px;height:11px;}
.row.is-hidden .rowhead{opacity:.5;}

.track{position:relative;flex:none;height:var(--row-h);}
.track::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,var(--grid-line) 0 1px,transparent 1px calc(var(--hw)*24));
}
.now{
  position:absolute;top:0;bottom:0;width:1px;background:var(--blue);z-index:9;pointer-events:none;
  box-shadow:0 0 0 1px rgba(55,138,221,.18);
}
.now-head{position:absolute;top:0;bottom:0;width:1px;background:var(--blue);z-index:17;pointer-events:none;}

/* ---- отрезки ----
   Влад, 29.08: «полоски чуть шире по вертикали, больше информации, не обрезай
   фамилии» - высота выросла с 22 до 28px (строка с 44 до 52px), подпись человека
   и маршрут разведены по ДВУМ строкам внутри бара вместо одной обрезанной.
   «Тонкие подполосы под строкой - непонятно зачем, убрать» - .dstrip больше нет;
   недоступность водителя (выходной/нет водителя) теперь ОБЫЧНЫЙ блок в общей
   полосе, как ремонт - с той же подписью и тем же участием в примагничивании и
   проверке пересечений (см. JS: driveroff больше не исключение). */
.seg{
  /* БЕЗ overflow:hidden И БЕЗ постоянного will-change:transform - важно, оба
     ломают sticky-подпись внутри (.seg-label) одинаковым образом: overflow (даже
     hidden) делает .seg собственным scroll-контейнером, will-change:transform
     (как и сам transform) делает .seg containing block для потомков - в обоих
     случаях sticky начинает считаться от .seg вместо реального скролла .board,
     и подпись просто застывает на месте вместо того чтобы следовать за прокруткой.
     will-change включается ТОЧЕЧНО в JS на время самого драга (см. lift()/pointerup) -
     это и корректнее по смыслу самого свойства (хинт нужен только пока анимируем),
     и чинит sticky в состоянии покоя, когда подпись обязана быть видна. Клип по
     ширине бара - max-width на .seg-label + ellipsis на .seg-txt. */
  /* 32px, не 28 (Влад, 29.08 - «пошире по вертикали») - в строке 52px это центрирует
     плитку с симметричным зазором 10px сверху/снизу, а не 12px как раньше; бейдж
     МЕН/ЛОГ внутри (22px) получает воздух со всех сторон автоматически через
     align-items:center на .seg-label, без отдельных правил под каждую сторону */
  position:absolute;top:10px;height:32px;border-radius:6px;
  left:calc(var(--s) * var(--hw));width:calc(var(--l) * var(--hw));
  font-size:10.5px;line-height:1.3;white-space:nowrap;cursor:grab;touch-action:none;
  user-select:none;
  /* transition ТОЛЬКО opacity - box-shadow/filter из transition убраны (запрет ГОСТа:
     тени и свечения через opacity заранее отрисованного слоя, не анимацией свойств;
     находка аудита состояний 29.08). transform-переход драг ставит inline сам. */
  transition:opacity .14s var(--ease-out-soft);
}
/* hover - световой оверлей вместо filter:brightness (brightness - незаконный канал
   по ГОСТу; и БЕЗ подъёма transform - он ломает sticky-подпись, см. коммент выше) */
.seg .hov{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:rgba(255,255,255,.10);opacity:0;transition:opacity .12s var(--ease-out-soft);}
:root[data-theme="light"] .seg .hov{background:rgba(20,26,38,.07);}
.seg:hover .hov{opacity:1;}
/* кольцо - один слот на плитку, приоритет: конфликт(red) > «под данные»(amber) > открыта(blue) */
.seg .ring{position:absolute;inset:-2px;border-radius:8px;pointer-events:none;
  opacity:0;transition:opacity .15s var(--ease-out-soft);}
.seg.is-open .ring{opacity:1;box-shadow:0 0 0 1.5px var(--blue);}
.seg.needs-passport .ring{opacity:1;box-shadow:0 0 0 1.5px var(--amber);}
.seg.overlap .ring{opacity:1;box-shadow:0 0 0 1.5px var(--red);}
/* завершённый рейс - приглушение всего элемента (значение между .82 драга и .28 ghosted) */
.seg.is-past{opacity:.68;}
.seg.lifted{cursor:grabbing;opacity:.82;z-index:900;pointer-events:none;
  box-shadow:0 2px 6px rgba(0,0,0,.4),0 16px 32px rgba(0,0,0,.5);}
.seg.bad{box-shadow:inset 0 0 0 1.5px var(--red);}
/* ПОДПИСЬ - position:sticky внутри отрезка, привязана к скроллу .board (ближайший
   реальный scroll-контейнер), а .seg{overflow:hidden} держит её в границах самого
   бара. Итог - «Ремонт»/«Без водителя»/маршрут видны, пока в кадре ЛЮБАЯ часть
   длинной (многодневной) полосы, а не только момент, когда виден именно её левый
   край - раньше подпись пропадала за экраном на длинных ремонтах. */
.seg-label{
  /* display:INLINE-flex, не flex - ключевая деталь: обычный (block) flex-контейнер
     без явной ширины растягивается на всю доступную ширину (родитель .seg порой
     шириной в тысячи px на многодневной полосе) - тогда sticky нечего «прилеплять»,
     коробка и так покрывает весь диапазон. inline-flex сжимается по содержимому
     (как раньше делал inline-block), и вот ЭТУ маленькую коробку sticky уже реально
     двигает вслед за скроллом .board. Ловушка поймана и проверена числами 29.08. */
  /* «Бейдж-корпус» по выбору Влада 29.08 (уровень 5 мастерской) с его поправкой:
     бейдж идентичности и маршрут - ОДИН sticky-ряд, едут по скроллу ВМЕСТЕ
     («рейс должен ехать вместе с фамилией»), а не бейдж отдельно от текста. */
  /* left отсчитывается от скролл-контейнера .board, а НЕ от видимого просвета -
     замороженная колонка (--lane-w) сама sticky-контент того же контейнера и
     ПЕРЕКРЫВАЕТ всё, что прилипло левее её ширины. Прилипаем сразу ЗА колонку -
     иначе подпись длинной плитки визуально пряталась под ней (поймано 29.08). */
  position:sticky;left:calc(var(--lane-w) + 8px);display:inline-flex;flex-direction:row;
  align-items:center;gap:6px;height:100%;max-width:calc(100% - 8px);
  /* воздух слева: бейдж не прилипает вплотную к рамке плитки (Влад, 29.08 -
     «как будто обрезает основную рамку») */
  margin-left:4px;
}
.seg-txt{overflow:hidden;text-overflow:ellipsis;font-weight:500;}
/* бейдж идентичности: МЕНеджер (3 буквы, ярко) над ЛОГистом (3 буквы, приглушён);
   непрозрачный - читается поверх любой заливки в любом режиме раскраски */
.seg-id{
  /* БЕЗ фиксированной height:20px - две строки текста (9px, line-height 1.15)
     сами по себе занимают ~20.7px, а нулевой вертикальный паддинг при жёсткой
     высоте 20px давал буквам упираться в собственную рамку (Влад, 29.08:
     «вылазят на границу»). Теперь высота - от паддинга, а не наоборот: бейдж
     растёт под текст, а не текст сжимается под бейдж. */
  position:relative;display:inline-flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;flex:none;padding:3px 8px;border-radius:5px;
  background:var(--idfill,var(--bg4));
  box-shadow:inset 0 0 0 1px var(--border-strong);   /* статичная кромка - бейдж читается
    как самостоятельная бирка, а не обрезок заливки (акцент по просьбе Влада 29.08) */
}
.seg-id b,.seg-id i{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;font-style:normal;
  line-height:1.2;letter-spacing:.04em;color:var(--text);
}
.seg-id i{font-weight:500;color:var(--muted);}
/* точка водителя: залита = назначен на машину, кольцо = вакансия */
.seg-drv{position:absolute;top:-2px;right:-2px;width:6px;height:6px;border-radius:50%;}
.seg-drv.on{display:none;}                     /* норму не отмечаем - только отсутствие */
.seg-drv.off{background:var(--bg2);border:1.5px solid var(--red);}
/* прогресс активного рейса - 2px снизу, transform:scaleX (не width) */
.seg-prog{position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:0 0 6px 6px;
  overflow:hidden;background:rgba(139,137,128,.18);pointer-events:none;}
.seg-prog i{display:block;height:100%;transform:scaleX(calc(var(--progress,0)/100));
  transform-origin:left;background:currentColor;}
.seg-code{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.02em;
  white-space:nowrap;
}
.hnd{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;z-index:2;}
.hnd.l{left:0;} .hnd.r{right:0;}
/* Зумы - стандарт Влада 29.08: «неделя» = только МЕН/ЛОГ (бейдж, без маршрута),
   «месяц» = только ЛОГист, всё - первыми тремя буквами. Служебные плашки (без
   бейджа) на обоих зумах остаются чистым цветом. */
:root.z-week .seg .seg-txt{display:none;}
:root.z-week .seg-label{margin-left:2px;}
:root.z-month .seg{height:16px;top:18px;border-radius:3px;font-size:0;}
:root.z-month .seg .seg-txt{display:none;}
:root.z-month .seg-label{margin-left:1px;}
:root.z-month .seg-id{height:12px;padding:0 3px;background:transparent;box-shadow:none;}
:root.z-month .seg-id b{display:none;}                    /* менеджер уходит */
:root.z-month .seg-id i{font-size:9px;color:var(--text);} /* логист остаётся читаемым */
:root.z-month .seg-drv{display:none;}
:root.z-month .seg-prog{display:none;}

/* Крупное ВРЕМЯ, ЗАФИКСИРОВАННОЕ на экране, пока тянут/растягивают/рисуют
   (Влад, 29.08: «бейджик двигался вместе с плиткой - глазами не уследить; пусть
   время стоит на месте, а я двигаю плиткой рукой не глядя на неё»). Раньше это
   был тултип, гоняющийся за курсором - теперь одна неподвижная точка вверху
   доски, крупный моно-шрифт (25px - 2-й ярус hero по ГОСТу раздел 2), глаза
   отдыхают в одном месте на весь жест. */
.time-hud{
  position:absolute;top:10px;left:50%;z-index:980;pointer-events:none;
  transform:translate(-50%,-6px);opacity:0;width:400px;
  /* ШИРИНА ФИКСИРОВАННАЯ, не по контенту: translateX(-50%) считается от неё, и
     если бы ширина «дышала» вместе с длиной текста (то короче, то с
     «· примагничено»), сам HUD ехал бы по горизонтали вместе с содержимым - ровно
     та беготня за плиткой, от которой Влад просил избавиться. Фиксированная
     ширина = гарантированно одна и та же точка на экране при любом тексте внутри,
     хоть с минутами, хоть без. */
  background:var(--bg4);border:1px solid var(--border-strong);border-radius:10px;
  padding:10px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 10px 26px rgba(0,0,0,.45);
  transition:opacity .12s var(--ease-out-soft),transform .12s var(--ease-out-soft);
}
.time-hud.on{opacity:1;transform:translate(-50%,0);}
.hud-times{display:flex;align-items:baseline;gap:10px;white-space:nowrap;}
.hud-time{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-size:25px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--text);line-height:1;
}
.hud-arrow{color:var(--muted);font-size:15px;}
.hud-dur{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;}

/* Корзина, всплывающая при захвате плитки (Влад, 29.08: «как на смартфонах -
   зажал, внизу появляется корзина, роняешь туда - удаляется»). Стоит НАД
   скраббером (тот 18px внизу доски), появляется только пока плитку реально
   тащат (не во время растяжки за край - там нечего "уронить"), подсвечивается
   красным, когда курсор действительно над ней - тот самый сигнал "отпусти
   здесь". Хит-тест координат - в JS (см. pointermove для drag), pointer-events
   здесь none, чтобы не мешать document.elementFromPoint определять строку. */
.trash-zone{
  position:absolute;bottom:30px;left:50%;z-index:975;pointer-events:none;
  transform:translate(-50%,18px) scale(.85);opacity:0;
  width:60px;height:60px;border-radius:50%;
  background:var(--bg4);border:1px solid var(--border-strong);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(0,0,0,.45);
  transition:opacity .16s var(--ease-out-soft),transform .16s var(--ease-out-soft),
             background-color .12s ease-out,border-color .12s ease-out,color .12s ease-out;
}
.trash-zone.on{opacity:1;transform:translate(-50%,0) scale(1);}
.trash-zone.armed{
  background:var(--red);border-color:var(--red);color:#fff;
  transform:translate(-50%,0) scale(1.18);
}
.trash-zone svg{width:24px;height:24px;}

/* линия примагничивания */
.magnet{
  position:absolute;top:1px;bottom:1px;width:2px;background:var(--amber);z-index:8;
  pointer-events:none;opacity:0;transform:scaleY(.7);
  transition:opacity .12s var(--ease-out-soft),transform .12s var(--ease-overshoot);
  box-shadow:0 0 8px rgba(239,159,39,.5);
}
.magnet.on{opacity:.9;transform:scaleY(1);}

/* Уровень 3 «супер» с изолированного магнит-стенда (Влад, 29.08: «просто супер,
   внедряем срочно») - вспышка на СТЫКЕ обоих краёв, искры, прошитый шов. */
@keyframes kiss{
  0%{opacity:0;transform:scaleY(.35);} 55%{opacity:1;transform:scaleY(1.18);}
  100%{opacity:0;transform:scaleY(1);}
}
.edge-flash{position:absolute;top:3px;bottom:3px;width:3px;background:var(--amber);
  border-radius:2px;pointer-events:none;opacity:0;z-index:7;}
.edge-flash.go{animation:kiss .3s var(--ease-out-strong) 1;}
@keyframes spark{
  0%{opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.25);}
}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--amber);
  pointer-events:none;animation:spark .42s var(--ease-out-strong) 1 forwards;z-index:9;}
.seam{position:absolute;top:0;width:6px;margin-left:-3px;pointer-events:none;z-index:6;opacity:0;}
.seam.on{opacity:1;}
.seam path{fill:none;stroke:var(--amber);stroke-width:1.4;stroke-dasharray:3 3;}

/* прицел в начало нового диапазона при смене масштаба */
.day.primed{animation:primed .5s var(--ease-out-strong) 1;}
@keyframes primed{from{background:rgba(55,138,221,.34);}to{background:rgba(55,138,221,0);}}

/* ================= Шторка ================= */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .32s var(--ease-in-out);z-index:50;}
.scrim.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(390px,90vw);background:var(--bg2);
  border-left:1px solid var(--border-strong);padding:22px 20px;z-index:51;
  transform:translateX(100%);transition:transform .38s var(--ease-overshoot);overflow:auto;
}
.drawer.open{transform:translateX(0);}
.dr-eyebrow{font-size:9px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
.dr-title{font-size:19px;font-weight:600;margin:7px 0 18px;}
.dr-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;}
.dr-row span:first-child{color:var(--muted);}
.dr-row span:last-child{text-align:right;}
.dr-note{margin-top:18px;font-size:11px;color:var(--muted);line-height:1.5;}
.dr-actions{display:flex;gap:8px;margin-top:20px;}
.dr-del{display:inline-flex;align-items:center;gap:6px;color:var(--red);}
.dr-del:hover{border-color:var(--red);}
.dr-del svg{width:13px;height:13px;flex:none;}
.cr-types{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0;}
.cr-field{margin-bottom:12px;}
.cr-field .grp-label{display:block;margin-bottom:6px;}
.cr-opts{display:flex;gap:6px;flex-wrap:wrap;}
.cr-input{
  width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);
  font-family:inherit;font-size:12px;padding:7px 10px;
}
.cr-input:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
.cr-actions{display:flex;gap:8px;margin-top:18px;}
/* черновик отрезка во время протяжки по пустому месту - тот же язык, что и .seg,
   но пунктирная рамка вместо заливки по смыслу состояния (состояние ещё не выбрано) */
.seg-draft{
  position:absolute;top:4px;height:22px;border-radius:4px;pointer-events:none;
  background:rgba(139,137,128,.14);box-shadow:inset 0 0 0 1.5px var(--border-strong);
  left:calc(var(--s) * var(--hw));width:calc(var(--l) * var(--hw));
}

/* ================= Тост ================= */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;
  background:var(--bg3);border:1px solid var(--border-strong);border-radius:10px;
  padding:11px 15px;display:flex;align-items:center;gap:14px;font-size:12px;z-index:60;
  pointer-events:none;transition:opacity .28s var(--ease-in-out),transform .32s var(--ease-drawer);
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast button{
  appearance:none;background:none;border:0;color:var(--blue);font-family:inherit;font-size:12px;
  font-weight:600;cursor:pointer;padding:0;
}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.001ms !important;animation-duration:.001ms !important;}
  .seg:hover{transform:none;}
}

/* Семейство техники по префиксу типа - совпадает с делением, которое логисты уже
   держат в голове (в их таблице это группы «7-8-9 осей» / «Корыто» / «Рапиды» и т.д.). */
function typeFamily(type){
  if (/^Рапид|^П-\d/.test(type)) return "rapid";
  if (/^ПР|^ТПР/.test(type)) return "razd";
  if (/^ТКР|^КР|^К-/.test(type)) return "koryto";
  if (/^Борт/.test(type)) return "bort";
  if (/Панелевоз/.test(type)) return "panel";
  return "razd";
}

   КР-3, тем более от нераздвижного К-3». Ранг растёт с осностью/сложностью машины -
   больше осей/раздвижнее = темнее и насыщеннее заливка бейджа. Только razd/koryto
   имеют подтипы в парке; Рапид/Борт остаются одним тоном (подтипов не заводили). */
var TYPE_RANK = {
  "ПР-3":1, "ПР-4":2, "ПР-5":3, "ПР-8":4,
  "К-3":1, "КР-3":2, "ТКР-4":3, "ТКР-3+5":4
};
function typeRank(type){ return TYPE_RANK[type] || 1; }
function tagClass(type){
  var fam = typeFamily(type);
  return (fam === "razd" || fam === "koryto") ? "f-" + fam + "-" + typeRank(type) : "f-" + fam;
}

var soundOn = true, actx = null;
function getCtx(){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }catch(e){ return null; }

function blip(freqFrom, freqTo, dur, vol, type, delay){
  if (!soundOn || document.hidden) return;
  var ctx = getCtx(); if (!ctx) return;
  try{
    var t = ctx.currentTime + (delay || 0);
    var osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freqFrom, t);
    if (freqTo && freqTo !== freqFrom) osc.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }catch(e){}
}

/* Демо-набор - Влад, 29.08: «мне не нужно вок машин, мне нужно примерное
   понимание, как это выглядит» - полный парк (56 машин из Штатки) урезан до
   представительной выборки: все 4 тональности раздвижки (ПР-3/4/5/8), все 4
   тональности корыта (К-3/КР-3/ТКР-4/ТКР-3+5), пара рапидов, пара бортов разных
   состояний (в рейсе/ремонт/без водителя). Индексы - позиции в FLEET выше;
   полный массив остаётся источником данных, вернуть весь парк - тривиально
   (DEMO_INDEXES = FLEET.map(function(_,i){return i;})). */
var DEMO_INDEXES = [0, 6, 8, 12, 20, 21, 1, 2, 4, 5, 33, 24, 25, 36, 40, 44, 47, 54];

function buildVehicles(){
  var rnd = rnd32(20260829);
  var fleet = DEMO_INDEXES.map(function(i){ return FLEET[i]; });
  fleet.forEach(function(f, vi){
    var isLong = f[0] === "Борт";
    var v = {
      i:vi, type:f[0], tractor:f[1], gos:f[2], trailer:f[3], trailerGos:f[4],
      statusToday:f[5], drivers:(f[6]||"").split("/").filter(Boolean), schedule:f[7],
      days:f[8], long:isLong
    };
    v.driver = v.drivers[0] || "";
    v.vacant = /вакант|арест/i.test(v.driver) || !v.driver;
    STATE.vehicles.push(v);

    var d = 0, busyUntil = 0;
    while (d < DAYS){
      var ch = v.days.charAt(d) || ".";
      if (ch === "."){ d++; continue; }

      if (ch === "R" || ch === "T" || ch === "V" || ch === "W"){
        var run = 1;
        while (d + run < DAYS && v.days.charAt(d + run) === ch) run++;
        var s0 = d * 24, len = run * 24;
        if (ch === "R" || ch === "W") push(v, "repair", s0, len);
        if (ch === "T") push(v, "maint", s0, len);
        if (ch === "V" || ch === "W") pushDriver(v, s0, len);
        d += run;
        continue;
      }

      var n = parseInt(ch, 10);
      if (n === 0){ push(v, "noorder", d * 24, 24); d++; continue; }

      /* выезд 5..9 утра, но не раньше, чем машина освободилась от прошлого рейса */
      var cur = Math.max(busyUntil, d * 24 + 5 + Math.floor(rnd() * 5));
      for (var k = 0; k < n; k++){
        if (cur >= (d + 1) * 24 + 14) break;   /* заявка дня не уезжает дальше суток */
        if (blockedAt(v, cur)) break;
        var dur = 5 + Math.floor(rnd() * 12);                  // 5..16 часов
        if (n === 1 && rnd() < 0.35) dur += Math.floor(rnd() * 8);
        dur = Math.min(dur, freeRun(v, cur));   /* не заезжать в ремонт и ТО */
        if (dur < 3 || cur + dur > HOURS) break;
        var mg = MANAGERS[Math.floor(rnd() * MANAGERS.length)];
        var lg = (v.long ? LOG_LONG : LOG_TRAL)[Math.floor(rnd() * (v.long ? LOG_LONG.length : LOG_TRAL.length))];
        var a = PLACES[Math.floor(rnd() * PLACES.length)], b = PLACES[Math.floor(rnd() * PLACES.length)];
        if (b === a) b = PLACES[(PLACES.indexOf(a) + 5) % PLACES.length];
        push(v, "trip", cur, dur, {mg:mg, lg:lg, from:a, to:b});
        cur += dur + 1 + Math.floor(rnd() * 3);
        busyUntil = cur;
      }
      d++;
    }
  });
}
/* машина физически недоступна в этот час: ремонт, ТО, ремонт+выходной */
function blockedAt(v, hour){
  var ch = v.days.charAt(Math.floor(hour / 24)) || ".";
  return ch === "R" || ch === "T" || ch === "W";
}
/* сколько часов подряд машина свободна начиная с start (потолок 40) */
function freeRun(v, start){
  var n = 0;
  while (n < 40 && start + n < HOURS && !blockedAt(v, start + n)) n++;
  return n;
}
function push(v, kind, s, l, extra){
  var o = {id:"s" + (STATE.seq++), v:v.i, kind:kind, s:s, l:l};
  if (extra) for (var k in extra) o[k] = extra[k];
  STATE.segs.push(o);
}
/* «Без водителя» - раньше отдельная тонкая подполоса без подписи (Влад, 29.08:
   «непонятное назначение, убрать»), теперь ОБЫЧНЫЙ блокирующий отрезок наравне с
   ремонтом - тот же push(), просто отдельная функция для читаемости вызова. */
function pushDriver(v, s, l){ push(v, "driveroff", s, l); }

function visible(v){
  if (STATE.hidden[v.i] && !STATE.showHidden) return false;
  if (STATE.showHidden) return !!STATE.hidden[v.i];
  if (STATE.filter === "tral") return !v.long;
  if (STATE.filter === "long") return v.long;
  if (STATE.filter === "razd") return typeFamily(v.type) === "razd";
  if (STATE.filter === "koryto") return typeFamily(v.type) === "koryto";
  if (STATE.filter === "rapid") return typeFamily(v.type) === "rapid";
  if (STATE.filter === "faymon") return /faymonville/i.test(v.trailer || "");
  if (STATE.filter === "free") return isFreeNow(v.i);
  return true;
}
/* порядок машин задаёт админ перетаскиванием карточки; хранится по индексам */
function orderedVehicles(){
  if (!STATE.order) return STATE.vehicles.slice();
  var byI = {}; STATE.vehicles.forEach(function(v){ byI[v.i] = v; });
  var out = [], seen = {};
  STATE.order.forEach(function(i){ if (byI[i] && !seen[i]){ out.push(byI[i]); seen[i] = 1; } });
  STATE.vehicles.forEach(function(v){ if (!seen[v.i]) out.push(v); });
  return out;
}

function nowHour(){
  var d = new Date();
  var day = (d.getFullYear() === YEAR && d.getMonth() === MONTH) ? d.getDate() : 29;
  return (day - 1) * 24 + d.getHours() + d.getMinutes() / 60;
}
function isFreeNow(vi){
  /* "без водителя" теперь БЛОКИРУЕТ, как ремонт - машину без водителя нельзя
     считать свободной для диспетчеризации, поэтому исключения для driveroff
     больше нет (было раньше, когда это была декоративная подполоса) */
  var h = nowHour();
  return !STATE.segs.some(function(s){
    return s.v === vi && s.s <= h && s.s + s.l > h;
  });
}

/* дата окончания служебной плашки = правый край отрезка (Влад, 29.08).
   Конец ровно в полночь = «по последний занятый день включительно» (26.08),
   иначе - дата и время конца. */
function untilLabel(s){
  var end = s.s + s.l;
  var mm = (MONTH + 1 < 10 ? "0" : "") + (MONTH + 1);
  if (end % 24 === 0) return "до " + Math.min(DAYS, end / 24) + "." + mm;
  return "до " + fmt(end);
}
function segLabel(s){
  if (s.kind === "trip") return s.from + " → " + s.to;
  var base = s.kind === "repair" ? "Ремонт" : s.kind === "maint" ? "ТО" :
             s.kind === "noorder" ? "Без заказа" : s.kind === "driveroff" ? "Без водителя" : "";
  return base ? base + " · " + untilLabel(s) : "";
}
function makeSeg(s){
  var el = document.createElement("div");
  var now = nowHour();
  var cls = "seg";
  if (s.s + s.l <= now) cls += " is-past";                     /* завершён - приглушаем */
  if (STATE.openId === s.id) cls += " is-open";                /* кольцо переживает перерендер */
  var active = s.kind === "trip" && s.s <= now && now < s.s + s.l;
  el.className = cls;
  el.dataset.id = s.id;
  el.style.setProperty("--s", s.s);
  el.style.setProperty("--l", s.l);
  if (active) el.style.setProperty("--progress",
    Math.round((now - s.s) / s.l * 100));
  /* «Бейдж-корпус» (уровень 5 мастерской, выбор Влада 29.08): бейдж МЕН/ЛОГ и
     маршрут - один sticky-ряд, едут по скроллу вместе. Вакансию водителя машины
     отмечает красная точка на бейдже (норму не отмечаем - только отсутствие). */
  var head = "";
  if (s.kind === "trip"){
    var v = STATE.vehicles[s.v];
    head = '<span class="seg-id"><b>' + three(s.mg) + '</b><i>' + three(s.lg) + '</i>' +
      '<span class="seg-drv ' + (v && v.vacant ? "off" : "on") + '"></span></span>';
  }
  el.innerHTML = '<span class="seg-label">' + head +
    '<span class="seg-txt">' + segLabel(s) + "</span></span>" +
    (active ? '<span class="seg-prog"><i></i></span>' : "") +
    '<span class="hov"></span><span class="ring"></span>' +
    '<span class="hnd l"></span><span class="hnd r"></span>';
  paint(el, s);
  return el;
}

/* легенда типов техники - из РЕАЛЬНОГО состава парка (после buildVehicles), не
   статичный список: показывает ровно те типы/тональности, что есть на экране */
function buildTypeLegend(){
  var seen = {}, out = [], famOrder = {razd:0, koryto:1, rapid:2, bort:3, panel:4};
  STATE.vehicles.forEach(function(v){
    if (seen[v.type]) return; seen[v.type] = 1;
    out.push([v.type, tagClass(v.type), typeFamily(v.type)]);
  });
  out.sort(function(a, b){
    if (famOrder[a[2]] !== famOrder[b[2]]) return famOrder[a[2]] - famOrder[b[2]];
    return typeRank(a[0]) - typeRank(b[0]);
  });
  return out;
}
function renderLegend(){
  var items;
  if (STATE.color === "state"){
    items = [["В рейсе", STATE_FILL.trip], ["Без заказа", STATE_FILL.noorder],
             ["Ремонт", STATE_FILL.repair], ["ТО", STATE_FILL.maint],
             ["Водитель недоступен", "rgba(139,137,128,.26)"], ["Вакансия", "rgba(226,75,74,.22)"]];
  } else {
    var src = STATE.color === "manager" ? MANAGERS : LOG_TRAL.concat(LOG_LONG);
    items = src.map(function(p){ return [p.code + " " + p.full, hexA(idColor(p.id), .34)]; });
  }
  var typeBit = STATE.typeLegend.map(function(p){

  var note = canArrange()
    ? "тянуть карточку машины вверх-вниз - переставить порядок · тянуть отрезок - сдвинуть/растянуть/перенести · протянуть по пустому месту или двойной клик - новая запись"
    : "тянуть тело - сдвинуть · тянуть за край - растянуть · протянуть по пустому месту или двойной клик - новая запись";
  document.getElementById("legend").innerHTML =
    items.map(function(p){
      return '<span class="lg"><span class="sw" style="background:' + p[1] + '"></span>' + p[0] + "</span>";
    }).join("") + '<span style="width:1px;height:14px;background:var(--border)"></span>' + typeBit +
    '<span class="lg-note">' + note + '</span>';
}

/* ---------- крупное фиксированное время, пока тянут/растягивают/рисуют ----------
   Шаг сетки - ПОЛЧАСА (Влад, 29.08): часы хранятся дробными (…,8, 8.5, 9,…),
   hm()/fmt() ниже поэтому считают минуты, а не только час. */
var hud = document.getElementById("timeHud");
var hudFrom = document.getElementById("hudFrom"), hudTo = document.getElementById("hudTo"),
    hudDur = document.getElementById("hudDur");
var trashZone = document.getElementById("trashZone");
function hm(h){
  var totalMin = Math.round((((h % 24) + 24) % 24) * 60);
  var hh = Math.floor(totalMin / 60), mm = totalMin % 60;
  var dd = Math.floor(h / 24) + 1;
  return dd + "." + (MONTH + 1 < 10 ? "0" : "") + (MONTH + 1) + " " + (hh < 10 ? "0" : "") + hh +
         ":" + (mm < 10 ? "0" : "") + mm;
}
function durLabel(l){
  var h = Math.floor(l), m = Math.round((l - h) * 60);
  return m ? h + " ч " + m + " мин" : h + " ч";
}
function showBadge(seg, x, y, snapped){
  hudFrom.textContent = hm(seg.s);
  hudTo.textContent = hm(seg.s + seg.l);
  hudDur.textContent = durLabel(seg.l) + (snapped ? " · примагничено" : "");
  hud.classList.add("on");
}
function hideBadge(){ hud.classList.remove("on"); }

/* ---------- примагничивание ---------- */
var magnetEl = null;
function magnetTargets(vi, selfId){
  var t = [];
  for (var d = 0; d <= DAYS; d++){ t.push(d * 24); t.push(d * 24 + 8); }  /* полночь и начало смены */
  STATE.segs.forEach(function(s){
    if (s.v === vi && s.id !== selfId){ t.push(s.s); t.push(s.s + s.l); }
  });
  t.push(Math.round(nowHour()));
  return t;
}
function snapHour(raw, targets){
  var thr = Math.max(0.25, 10 / ZOOM[STATE.zoom]);   /* магнит ~10px экрана, но не меньше 15 минут -
    ниже, чем раньше (было 45 мин): шаг сетки теперь 30 мин, порог не должен глотать сам шаг */
  var best = null, bd = thr;
  for (var i = 0; i < targets.length; i++){
    var d = Math.abs(raw - targets[i]);
    if (d <= bd){ bd = d; best = targets[i]; }
  }
  return best;
}
function showMagnet(track, hour){
  if (!magnetEl){ magnetEl = document.createElement("div"); magnetEl.className = "magnet"; }
  if (magnetEl.parentNode !== track) track.appendChild(magnetEl);
  magnetEl.style.left = (hour * ZOOM[STATE.zoom]) + "px";
  magnetEl.classList.add("on");
}
function hideMagnet(){ if (magnetEl) magnetEl.classList.remove("on"); }

/* ---------- уровень 3 «супер» примагничивания: вспышка на стыке, искры, шов -----
   Перенесено 1:1 с изолированного стенда (examples/prototype-magnet-demo.html,
   уровень 3), Влад одобрил и попросил внедрить срочно, 29.08. Общие переиспользуемые
   элементы, реparent'ятся на текущий трек - тот же приём, что и у showMagnet(). ---------- */
var edgeA = null, edgeB = null, seamEl = null, seamPath = null;
function ensureFx(){
  if (!edgeA){ edgeA = document.createElement("div"); edgeA.className = "edge-flash"; }
  if (!edgeB){ edgeB = document.createElement("div"); edgeB.className = "edge-flash"; }
  if (!seamEl){
    seamEl = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    seamEl.setAttribute("class", "seam");
    seamPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
    seamEl.appendChild(seamPath);
  }
}
function kissEffect(track, myEdgeHour, neighborEdgeHour){
  ensureFx();
  var hw = ZOOM[STATE.zoom];
  if (edgeA.parentNode !== track) track.appendChild(edgeA);
  if (edgeB.parentNode !== track) track.appendChild(edgeB);
  edgeA.style.left = (myEdgeHour * hw - 1.5) + "px";
  edgeA.classList.remove("go"); void edgeA.offsetWidth; edgeA.classList.add("go");
  edgeB.style.left = (neighborEdgeHour * hw - 1.5) + "px";
  edgeB.classList.remove("go"); void edgeB.offsetWidth; edgeB.classList.add("go");
}
function sparkBurst(track, hour){
  if (prefersReduced()) return;
  var hw = ZOOM[STATE.zoom];
  for (var i = 0; i < 4; i++){
    var s = document.createElement("div");
    s.className = "spark";
    var ang = (Math.PI * 2 * i / 4) + Math.random() * .6;
    s.style.setProperty("--dx", (Math.cos(ang) * 14) + "px");
    s.style.setProperty("--dy", (Math.sin(ang) * 10) + "px");
    s.style.left = (hour * hw - 2) + "px";
    s.style.top = "22px";
    track.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 430); })(s);
  }
}
function seamOn(track, hour){
  ensureFx();
  if (seamEl.parentNode !== track) track.appendChild(seamEl);
  seamEl.style.left = (hour * ZOOM[STATE.zoom] - 3) + "px";
  var h = track.clientHeight || 52;
  seamEl.setAttribute("height", h);
  seamEl.setAttribute("width", 6);
  var len = Math.max(1, h - 12);
  seamPath.setAttribute("d", "M3 6 L3 " + (h - 6));
  seamPath.style.transition = "none";
  seamPath.style.strokeDasharray = len;
  seamPath.style.strokeDashoffset = len;
  seamEl.classList.add("on");
  requestAnimationFrame(function(){
    seamPath.style.transition = "stroke-dashoffset .3s var(--ease-out-strong)";
    seamPath.style.strokeDashoffset = 0;
  });
}
function seamOff(){ if (seamEl) seamEl.classList.remove("on"); }

/* ---------- прицел в начало нового диапазона при смене масштаба ---------- */
function rangeStart(hour, zoom){
  var day = Math.floor(hour / 24);
  if (zoom === "month") return 0;
  if (zoom === "week"){
    var wd = (new Date(YEAR, MONTH, day + 1).getDay() + 6) % 7;   /* 0 = понедельник */
    return Math.max(0, (day - wd) * 24);
  }
  return day * 24;                                                 /* сутки и 3 дня - к началу дня */
}
function primeTo(hour){
  var x = Math.max(0, hour * ZOOM[STATE.zoom]);
  if (prefersReduced()) board.scrollLeft = x;
  else board.scrollTo({left:x, behavior:"smooth"});
  var cell = scaleEl.children[Math.floor(hour / 24)];
  if (cell && !prefersReduced()){
    cell.classList.remove("primed");
    void cell.offsetWidth;                                          /* перезапустить анимацию */
    cell.classList.add("primed");
  }
}

/* ---------- клик по дню в шапке - экран сразу переходит на этот день (Влад, 29.08) ---------- */
scaleEl.addEventListener("click", function(e){

/* ---------- переход между месяцами - стрелки, без перезагрузки ---------- */
var MONTH_NAMES = ["январь","февраль","март","апрель","май","июнь","июль","август",
  "сентябрь","октябрь","ноябрь","декабрь"];

}

rowsEl.addEventListener("click", function(e){
