<script>
// Единая точка входа для нативного Android-приложения (TWA) - 03.09.2026, Влад: "все
// используют одно приложение, каждая роль видит своё". Один значок на телефоне у ВСЕХ
// ролей (админ/менеджер/логист/механик/водитель), но НЕ один файл - это специально:
// files/index.html (~2.6 МБ, полный BI-дашборд), files/driver.html (~50 КБ, экран
// водителя под 4G/кабину) и files/plan-m.html (~140 КБ, мобильная Планировка логиста в
// поле, план plans/2026-09-05-mobile-planning-page.md) остаются раздельными по причинам
// из тех же планов - здесь ТОЛЬКО решаем, куда вести при открытии приложения, не смешивая
// сами страницы.
//
// Только чтение localStorage - никаких сетевых запросов, редирект мгновенный. Источники
// истины ролей РАЗНЫЕ и это нормально: у водителя - driver_token (files/driver.html,
// ссылка-приглашение, driver_devices на сервере), у офисных ролей - id_token/
// session_token/user_role (files/index.html И files/plan-m.html - обе пишут одни и те же
// ключи при входе через Google, общий origin). Первый когда-либо запуск на чистом
// телефоне без всех трёх - уводим на index.html, у него уже есть экран входа через
// Google, а user_role появится в localStorage только ПОСЛЕ первого входа; для водителя
// первый вход всегда идёт по ссылке-приглашению напрямую на driver.html (её выдают
// вручную), не через значок приложения - значок нужен со ВТОРОГО открытия и дальше.
try {
  var role = localStorage.getItem('user_role') || '';
  var optOut = sessionStorage.getItem('plan_m_optout') === '1'; // «Полная версия дашборда» в «Ещё» на plan-m.html - разовый выбор на сессию, не навсегда
  var narrowTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches && window.innerWidth <= 680; // тот же порог 680px, что lpIsMobileViewport_ в index.html
  if (localStorage.getItem('driver_token')) {
    location.replace('driver.html');
  } else if (!optOut && narrowTouch && (role === 'logist' || role === 'manager' || role === 'admin')) {
    location.replace('plan-m.html');
  } else {
    location.replace('index.html');
  }
} catch (e) {
  // localStorage/matchMedia недоступны (приватный режим и т.п.) - безопасный дефолт, как и раньше
  location.replace('index.html');
}
</script>
