<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Задание · TS HUB</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://api.yardhub.ru">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Ранний синхронный скрипт темы, ДО <style> - тот же приём, что index.html (21.09,
     общая переменная 'yardhub_theme'), иначе страница на долю секунды мигает тёмным
     даже при сохранённой светлой теме (FOUC). -->
<script>try{if(localStorage.getItem('yardhub_theme')==='light'){document.documentElement.setAttribute('data-theme','light');document.querySelector('meta[name="theme-color"]').setAttribute('content','#eef1f5');}}catch(e){}</script>
<style>
/* ── «Задание» с телефона, вариант «Лента» - утверждён Владом 19.09.2026, перенесён 1:1
   (правило «превью = контракт»). Источник: превью zm_variant_a.html (артефакт
   https://claude.ai/artifact/GqXTnYrH7HWrarK8PgX6Mc). Оболочка - те же приёмы, что
   files/plan-m.html (токены, bottom sheet, --vvh, поллинг, кэш, вход). Единственное отличие
   от демо - здесь position:fixed на весь экран устройства, а не absolute внутри рамки
   телефона, и данные живые (api.yardhub.ru), а не сгенерированные. ── */
:root{
  --bg:#0f0f13; --bg2:#17171d; --bg3:#1e1e26; --bg4:#252530;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
  --text:#e8e6df; --muted:#8b8980;
  --green:#1D9E75; --red:#E24B4A; --amber:#EF9F27; --blue:#378ADD; --purple:#7F77DD;
  --tint-green:#4fd4a3; --tint-amber:#f5be6a; --tint-red:#f07b7a;
  --scrim:rgba(0,0,0,.55);
  --font-ui:'Golos Text',system-ui,-apple-system,Roboto,sans-serif;
  --font-num:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --font-display:'Unbounded',var(--font-ui);
  --ease-out-strong:cubic-bezier(0.16,1,0.3,1);
  --ease-out-soft:cubic-bezier(0.25,1,0.5,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --hdr-row:44px;
}
/* Светлая тема (21.09) - та же палитра, что уже утверждена и живёт в index.html
   (plans/2026-08-29-light-theme-toggle.md, "утверждено вживую через 3 варианта в чате"),
   один в один по значениям токенов - не отдельный, местный вариант. */
html[data-theme="light"]{
  --bg:#eef1f5; --bg2:#ffffff; --bg3:#e2e7ed; --bg4:#d3dae2;
  --border:rgba(15,22,35,0.16); --border-strong:rgba(15,22,35,0.30);
  --text:#0f1623; --muted:#4a5568;
  --tint-green:#0a5940; --tint-amber:#6f480d; --tint-red:#8a2c2b;
  --scrim:rgba(15,22,35,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{color:var(--text);font-family:var(--font-ui);font-size:14px;font-weight:500;line-height:1.35;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;touch-action:manipulation;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:none;border:0}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ── вход ── */
.state{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.state h1{font-size:22px;font-weight:700}
.state p{color:var(--muted);font-size:15px;max-width:320px}

/* ── каркас ── */
.app{display:flex;flex-direction:column;height:100vh;height:var(--vvh,100dvh);padding-top:var(--safe-t);background:var(--bg)}
.hdr{flex:none;background:var(--bg);border-bottom:1px solid var(--border);position:relative;z-index:40}
.hdr-row{display:flex;align-items:center;gap:6px;height:var(--hdr-row);padding:0 8px}
.hbtn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;
  padding:0 10px;font-weight:600;font-size:15px;color:var(--text);white-space:nowrap}
.hbtn:active{background:var(--bg3)}
.hbtn.icon{padding:0;width:40px;min-width:40px}
.grow{flex:1 1 auto;min-width:0}
.hdate{font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.hdate .wd{color:var(--muted);font-weight:500;margin-right:2px}
.hdate svg{width:14px;height:14px;color:var(--muted)}
.today{height:36px;min-width:0;padding:0 12px;border-radius:18px;background:rgba(29,158,117,.13);color:#2fbe93;font-size:13px;font-weight:600}

/* row2: карусель дат «Маяк» - утверждено Владом 19.09 на превью (артефакт
   claude.ai/artifact/CJ29KgstWjQQza63LE9ucs), заменяет фиксированную неделю «Картограф»
   выше (та остаётся каноном для десктопа/логиста-таблицы - здесь только «Задание» с
   телефона). Непрерывная лента, крутится пальцем с инерцией и снапом на день, вместо
   заливки - статичное свечение по центру + текст выбранного дня зеленеет. */
.hdr-row2{padding:6px 8px 8px;gap:6px;height:auto;align-items:stretch}
.carousel-wrap{position:relative;flex:1 1 auto;min-width:0;height:56px;overflow:hidden;touch-action:pan-y}
.carousel-wrap.dragging{cursor:grabbing}
.carousel-wrap .fade-l,.carousel-wrap .fade-r{position:absolute;top:0;bottom:0;width:22px;z-index:5;pointer-events:none}
.carousel-wrap .fade-l{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.carousel-wrap .fade-r{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.beacon-glow{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(29,158,117,.26) 0%,rgba(29,158,117,.09) 55%,transparent 75%)}
.dstrip{position:absolute;top:0;left:50%;height:56px;will-change:transform}
.dchip{position:absolute;top:0;width:52px;height:52px;border-radius:10px;background:var(--bg3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:12px;font-weight:600;color:var(--text);line-height:1.15;user-select:none;z-index:3}
.dchip .cnt{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted);margin-top:1px}
.dchip.weekend{color:var(--tint-red)}
.dchip.weekend .cnt{color:var(--tint-red);opacity:.75}
.dchip.today{box-shadow:inset 0 0 0 1.5px var(--green)}
.dchip.sel{background:var(--bg4);color:#2fbe93}
.dchip.sel .cnt{color:#2fbe93}
.mgrseg{flex:none;display:flex;height:44px;align-self:center;background:var(--bg3);border-radius:8px;padding:2px;gap:2px}
.mgrseg button{padding:0 10px;border-radius:6px;font-size:12px;font-weight:700;color:var(--muted)}
.mgrseg button[aria-pressed="true"]{background:var(--bg4);color:var(--text)}

/* строка-вердикт */
.verdict{flex:none;padding:8px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg2)}
.verdict b{color:var(--text);font-weight:700}

/* фильтры логиста (ряд 2) */
.logfilters{flex:none;border-bottom:1px solid var(--border);background:var(--bg2)}
.lf-row{display:flex;align-items:center;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none}
.lf-row::-webkit-scrollbar{display:none}
.fchip{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--bg3);border:1px solid var(--border-strong);font-size:12px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:5px}
.fchip[aria-pressed="true"]{background:rgba(29,158,117,.16);border-color:var(--green);color:#2fbe93}
.fchip .n{font-family:var(--font-num)}
.fchip.warn[aria-pressed="true"]{background:rgba(239,159,39,.16);border-color:var(--amber);color:var(--tint-amber)}
.fchip.new[aria-pressed="true"]{background:rgba(55,138,221,.16);border-color:var(--blue);color:#7fb8ef}
.mgracc{border-top:1px solid var(--border)}
.mgracc>summary{list-style:none;padding:8px 12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.mgracc>summary::-webkit-details-marker{display:none}
.mgracc>summary svg{width:14px;height:14px;transition:transform .15s}
.mgracc[open]>summary svg{transform:rotate(180deg)}
.mgracc .mlist{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.mchip{height:32px;padding:0 10px 0 8px;border-radius:16px;background:var(--bg3);border:1px solid var(--border-strong);font-size:12px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.mchip[aria-pressed="true"]{border-color:var(--border-strong);background:var(--bg4)}
.mchip .dot{width:8px;height:8px;border-radius:50%;flex:none}

/* список карточек */
.body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 10px calc(16px + var(--safe-b))}
.card{background:var(--bg2);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:inset 3px 0 0 var(--muted)}
.card:active{background:var(--bg3)}
.card.st-unconfirmed{box-shadow:inset 3px 0 0 var(--tint-amber)}
.card.st-confirmed{box-shadow:inset 3px 0 0 var(--tint-green)}
.card.st-cancelled{box-shadow:inset 3px 0 0 var(--tint-red)}
.card.st-done{box-shadow:inset 3px 0 0 var(--blue)}
.card.blink{animation:cardblink 1.2s ease-in-out infinite}
@keyframes cardblink{0%,100%{background:var(--bg2)}50%{background:rgba(226,75,74,.14)}}
.c-r1{display:flex;align-items:baseline;gap:7px;margin-bottom:4px}
.c-no{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1}
.c-no.strike{text-decoration:line-through;color:var(--muted)}
.c-time{font-family:var(--font-num);font-size:13px;color:var(--muted)}
.c-cust{flex:1 1 auto;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-st{flex:none;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.c-st.st-unconfirmed{color:var(--tint-amber)}
.c-st.st-confirmed{color:var(--tint-green)}
.c-st.st-cancelled{color:var(--tint-red)}
.c-st.st-done{color:#7fb8ef}
.c-nd{width:6px;height:6px;border-radius:50%;background:var(--tint-amber);animation:blink 1.4s ease-in-out infinite}
.c-r2{display:flex;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:6px;align-items:flex-start}
.c-r2 .eqcol{flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-start;padding-top:1px}
.c-r2 .eq{font-weight:600;color:var(--text);line-height:1.2}
.c-r2 .route{flex:1 1 auto;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding-top:1px}
.c-r2 .route b{color:var(--text);font-weight:700}
.c-r2 .arr{color:var(--muted)}
/* бейдж менеджера (Влад 20.09: «нужно, чтобы была видна фамилия менеджера») - фамилия из
   sprav/roster, первые 3 буквы, цвет закреплён за человеком - тот же PERSON_COLOR, что уже
   красит точки в фильтре «Все менеджеры» у логиста. Превью-выбор из трёх вариантов
   размещения (в шапке / у машины / под техникой) - утверждено «В» (под техникой). */
.mgr{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:10px;font-weight:700;letter-spacing:.02em;width:28px;height:18px;border-radius:5px;flex:none}
/* c-r3 (машина·водитель) - ДВЕ колонки, не flex-wrap (Влад 20.09: «кнопка снять бегает
   из стороны в сторону, иконка своя тоже» - раньше весь ряд переносился одним блоком, и
   кнопка/бейдж оказывались в разных местах карточка от карточки в зависимости от длины
   госномера+ФИО водителя). .veh-info - переменная длина, обрезается многоточием, НЕ
   переносится; .veh-actions - тег СВОЯ/НАЁМ + кнопка, фиксированная колонка справа,
   всегда в одном и том же месте. */
.c-r3{display:flex;align-items:center;gap:8px;font-size:13px}
.veh-info{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.veh-info .gos{font-family:var(--font-num);font-weight:700}
.veh-info .drv{color:var(--text)}
.veh-info .empty{color:var(--muted);font-style:normal}
.veh-actions{flex:none;display:flex;align-items:center;gap:6px}
.veh-actions .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.03em}
.veh-actions .tag.own{background:rgba(29,158,117,.18);color:#2fbe93}
.veh-actions .tag.hired{background:rgba(239,159,39,.18);color:var(--tint-amber)}
.c-btn{height:32px;padding:0 12px;border-radius:16px;font-size:12px;font-weight:700}
.c-btn.accept{background:rgba(29,158,117,.18);color:#2fbe93;border:1.5px solid var(--green)}
.c-btn.put{background:none;border:1.5px dashed var(--border-strong);color:var(--text)}
.c-btn.ackoff{background:none;border:1.5px solid var(--red);color:var(--tint-red)}
.c-btn.rm{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.c-transfer{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.c-transfer b{color:var(--text)}
.c-pend{margin-top:8px;padding:8px 9px;border-radius:8px;background:rgba(239,159,39,.10);font-size:12px;color:var(--tint-amber);line-height:1.4}
.c-pend .btns{display:flex;gap:6px;margin-top:6px}
.c-pend button{height:30px;padding:0 10px;border-radius:14px;font-size:11.5px;font-weight:700}
.c-pend .ok{background:rgba(29,158,117,.2);color:#2fbe93}
.c-pend .no{background:rgba(226,75,74,.2);color:var(--tint-red)}
.empty-day{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.skel-card{height:88px;border-radius:12px;background:var(--bg2);margin-bottom:8px;position:relative;overflow:hidden}
.skel-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* сеть/загрузка */
.netbar{display:none;align-items:center;gap:8px;padding:6px 12px;background:rgba(226,75,74,.14);color:var(--tint-red);font-size:12px;font-weight:600;flex:none}
.netbar.on{display:flex}
.loadbar{display:none;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:6px 12px;background:var(--bg4);color:var(--muted);font-size:13px;font-weight:600;flex:none}
.loadbar.on{display:flex}
.loadbar.err{color:var(--tint-red)}
.loadbar button{flex:none;min-height:32px;padding:0 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--border-strong);color:var(--text);font-size:13px;font-weight:600}
.loadbar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:8px;animation:blink 1.2s ease-in-out infinite}

/* ── bottom sheet (ВЕРБАТИМ структура plan-m 245-345, fixed вместо absolute) ── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;height:calc(var(--vvh,100vh) * .52);z-index:95;background:var(--bg2);border-radius:12px 12px 0 0;
  transform:translateY(105%);transition:transform .32s var(--ease-drawer),height .28s var(--ease-drawer);display:flex;flex-direction:column;box-shadow:0 -8px 32px rgba(0,0,0,.4)}
.sheet.half{transform:none;height:calc(var(--vvh,100vh) * .52)}
.sheet.full{transform:none;height:calc(var(--vvh,100vh) * .92)}
.sheet .grip{flex:none;height:24px;display:flex;align-items:center;justify-content:center;touch-action:none}
.sheet .grip::before{content:"";width:44px;height:4px;border-radius:2px;background:var(--border-strong)}
.sh-head{flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 8px 12px;min-height:40px;touch-action:none}
.sh-head .cancel{flex:none;font-size:15px;font-weight:600;color:var(--muted)}
.sh-head .ttl{flex:1 1 auto;min-width:0;font-size:18px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-head .ttl small{display:block;font-size:12px;color:var(--muted);font-weight:500;font-family:var(--font-num)}
.sh-body{flex:1 1 auto;min-height:0;overflow:auto;padding:0 14px 14px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh-foot{flex:none;display:flex;gap:8px;padding:10px 12px calc(16px + var(--safe-b));border-top:1px solid var(--border);background:var(--bg2)}
.btn{height:52px;border-radius:10px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.btn:active{transform:scale(.98)}
.btn.primary{flex:1 1 auto;background:var(--green);color:#0f0f13}
.btn.primary:disabled{opacity:.45}
.btn.primary[data-blocked="1"]{opacity:.45}
.btn.primary[data-bad="1"]{background:var(--bg3);color:var(--tint-red);border:2px solid var(--red);font-size:14px}
.btn.ghost{background:var(--bg3);border:2px solid var(--border-strong);color:var(--text)}
.btn.danger{background:var(--red);color:#fff}
.btn.wide{flex:1 1 100%}
.f-label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.f-label:first-child{margin-top:6px}
.seg3,.seg4{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:44px;background:var(--bg3);border-radius:8px;padding:2px;gap:2px}
.seg3 button,.seg4 button{border-radius:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg3 button[aria-pressed="true"],.seg4 button[aria-pressed="true"]{background:var(--bg4);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 14px;border-radius:22px;background:var(--bg3);border:1px solid var(--border-strong);font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.chip[aria-pressed="true"]{background:rgba(29,158,117,.16);border-color:var(--green);color:#2fbe93}
/* Гармошка «Ещё N» (desktop op2-ent-enter/op2-ent-close, 1:1 - те же тайминги/easing) -
   Влад 20.09: «тип техники»/«от кого» на телефоне показывали ВСЕ варианты плоским
   списком, на десктопе - только основные + «Ещё N», раскрывающееся по тапу. */
.chip .n{font-family:var(--font-num);color:var(--amber)}
.chip.chip-enter{animation:chipPop .22s cubic-bezier(.34,1.45,.5,1) both}
@keyframes chipPop{from{opacity:0;transform:translateY(3px) scale(.88)}to{opacity:1;transform:none}}
.chip.chip-close{transition:transform .3s cubic-bezier(.22,.9,.28,1)}
.frow{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--border);transition:border-color .15s}
.frow .k{flex:none;width:92px;color:var(--muted);font-size:13px;font-weight:600}
/* «Откуда»/«Куда» как кнопка (fFromBase/fToBase) - тап по самому лейблу подставляет База/
   По месту (desktop op2-addr-base), без лишней кнопки-довеска в узкой строке. */
.frow button.k{background:none;border:none;padding:0;font:inherit;text-align:left;color:var(--muted)}
.frow button.k:active{color:var(--tint-green)}
.frow .v{flex:1 1 auto;min-width:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .v.ph{color:var(--muted);font-weight:500}
.frow.tap:active{background:var(--bg3);margin:0 -14px;padding-left:14px;padding-right:14px}
.frow input,.frow textarea{width:100%;font-size:16px;font-weight:600;text-align:right;outline:none}
.frow textarea{text-align:left;resize:none}
/* Влад 20.09: голый белый браузерный outline на фокусе поля - режет глаз на тёмном фоне и
   нигде в ГОСТе не описан (у desktop-версии свой приём - border-color:var(--blue) на
   .op2-fld, здесь аналог через подсветку нижней линии .frow, т.к. поля здесь - строки без
   рамки, не боксы). */
.frow:focus-within{border-bottom-color:var(--blue)}
/* подсказки заказчика/адресов (19.09) - 1:1 логика с десктопным order-plan-v2.js
   (fetchCustomers/fetchGeoSuggest/fetchCustomerHistory), простой блок под полем вместо
   плавающего дропдауна - надёжнее на телефоне с клавиатурой. */
.sugg{background:var(--bg3);border-radius:10px;margin:-2px 0 10px;overflow:hidden}
.sugg-sec{padding:7px 12px 5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sugg-it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-top:1px solid var(--border);font-size:14px}
.sugg-it:first-child{border-top:none}
.sugg-it:active{background:var(--bg4)}
.sugg-it .m{flex:none;color:var(--muted);font-size:12px}
.info{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg3);font-size:13px;color:var(--muted);margin-top:10px}
.info.warn{background:rgba(239,159,39,.12);color:var(--amber)}
.info.err{background:rgba(226,75,74,.12);color:var(--tint-red)}
.list-row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600}
.list-row .sub{display:block;font-size:12px;color:var(--muted);font-weight:500}
.list-row .go{margin-left:auto;color:var(--muted)}
.list-row:active{background:var(--bg3)}
.list-row.danger{color:var(--tint-red)}
.list-row.muted{color:var(--muted)}
.badge-new{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(55,138,221,.2);color:#7fb8ef;margin-left:6px}
.sw{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-bottom:1px solid var(--border)}
.sw .knob{width:46px;height:28px;border-radius:14px;background:var(--bg4);position:relative;flex:none;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-pressed="true"] .knob{background:rgba(29,158,117,.4)}
.sw[aria-pressed="true"] .knob::after{transform:translateX(18px);background:var(--tint-green)}
.timebox{display:flex;align-items:center;gap:10px;padding:10px 0}
.timebox button{width:44px;height:44px;border-radius:8px;background:var(--bg3);font-size:18px;font-weight:700}
.timebox .t{flex:1 1 auto;text-align:center;font-family:var(--font-num);font-size:28px;font-weight:700}
/* «Повторить заявку» (20.09, Влад: "тот же принцип, что в десктопной - несколько раз
   нажал на дату - несколько заявок") - счётчик ×N на чипе дня (клик = +1, копится) и
   компактный ряд для каждой будущей заявки в списке ниже (.timebox выше слишком крупный
   для повтора N раз подряд). */
.chip .n{font-family:var(--font-num);font-size:12px;font-weight:700;opacity:.75}
.rep-day{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.rep-row{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--border)}
.rep-row .no{flex:none;width:18px;color:var(--muted);font-size:12px;font-weight:700;font-family:var(--font-num)}
.rep-row .t{flex:1 1 auto;text-align:center;font-family:var(--font-num);font-size:15px;font-weight:700}
.rep-row button{flex:none;width:34px;height:34px;border-radius:8px;background:var(--bg3);font-size:13px;font-weight:700;color:var(--text)}
.rep-row .rm{color:var(--tint-red);font-size:15px}
.kv{display:grid;grid-template-columns:100px 1fr;gap:4px 10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)}
.kv .k{color:var(--muted)}
.kv .v{color:var(--text);font-weight:600}
.hist-row{padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.hist-row b{color:var(--text)}

/* ── overlay «пикер машины» / «перейти к дню» ── */
.ovl{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s var(--ease-drawer)}
.ovl.on{transform:none}
.ovl-head{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 8px;border-bottom:1px solid var(--border)}
.ovl-head input{flex:1 1 auto;height:38px;background:var(--bg3);border-radius:8px;padding:0 12px;font-size:15px}
.ovl-body{flex:1 1 auto;overflow:auto;padding:8px 14px 14px}
.sect-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.sect-h:first-child{margin-top:6px}
.res{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid var(--border);border-radius:8px;padding:0 6px}
.res:active{background:var(--bg3)}
.res[aria-pressed="true"]{background:rgba(29,158,117,.14);outline:1.5px solid var(--green)}
.res.dis{opacity:.4;pointer-events:none}
.res .gos{font-family:var(--font-num);font-weight:700;font-size:15px}
.res .meta{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .until{flex:none;font-size:12px;color:var(--muted)}
.res.hire{color:var(--tint-amber)}
.ovl-foot{flex:none;padding:10px 12px calc(16px + var(--safe-b));border-top:1px solid var(--border);background:var(--bg2)}
.jump-row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--border)}
.jump-row .d{width:70px;font-weight:700}
.jump-row .wd{width:36px;color:var(--muted);font-size:12px}
.jump-row .c{margin-left:auto;font-family:var(--font-num);color:var(--muted);font-size:13px}
.jump-row.today{color:#2fbe93}

/* ── меню-шторка ── */
.navdrawer{position:fixed;inset:0 30% 0 0;z-index:97;background:var(--bg2);transform:translateX(-100%);transition:transform .25s var(--ease-drawer);display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(0,0,0,.4)}
.navdrawer.open{transform:none}
.nd-head{flex:none;height:52px;display:flex;align-items:center;padding:0 14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--border)}
.nd-body{flex:1 1 auto;overflow:auto;padding:6px 8px calc(8px + var(--safe-b))}
.nd-sec{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.nd-item{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px;border-radius:8px;font-size:14px;font-weight:600}
.nd-item:active{background:var(--bg3)}
.nd-item.on{background:rgba(29,158,117,.14);color:#2fbe93}
.nd-item svg{width:18px;height:18px;color:var(--muted)}
.nd-item.on svg{color:#2fbe93}

/* ── тост ── */
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + var(--safe-b));z-index:106;background:var(--bg4);border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(140%);transition:transform .25s var(--ease-out-strong);font-size:14px;font-weight:600}
.toast.on{transform:none}
.toast .sub{color:var(--muted);font-weight:500}
.toast .act{flex:none;color:#7fb8ef;font-weight:700}
.toast.err{background:rgba(226,75,74,.9);color:#fff}
</style>

/* Адрес хранится одной строкой ("Михнево, ул. Промышленная, 4") - первый сегмент до запятой

function splitAddr(addr){
  if(!addr) return ['',''];

    weight: o.cargo_weight_t, rework: o.rework_terms||'—', gabarit: o.gabarit||'Габарит',

    payment_status: o.payment_status||'', cash: !!o.cash

  // просматривать экран, исходя из роли... неважно видеть тот же интерфейс, который видят
  // сотрудники»). У admin своей роли заявок нет - по умолчанию видит экран менеджера.
  // Роль вьювера ("Смотреть как") - через effectiveIdentity_(), не напрямую ME.role
  // (19.09, тот же фикс, что и в меню - иначе admin в вьювере логиста видел бы экран
  // менеджера, а не логиста).
  var eff = effectiveIdentity_();
  if(eff.role==='logist') ROLE='log';
  else ROLE='mgr';
  // «Мои/Все» - у настоящего менеджера ИЛИ у вьювера "как менеджер" (последний должен вести
  // себя ТОЧНО как реальный менеджер - Влад: "имитировать именно роль этого сотрудника").
  $('mgrSeg').hidden = eff.role!=='manager';
  // Реальный admin БЕЗ вьювера - показываем ВСЕ заявки всегда, иначе список пуст (ни одна
  // заявка не создана от его email). В вьювере - НЕ трогаем MGR_ALL здесь (иначе каждый
  // loadOrders() при смене дня сбрасывал бы ручной тумблер «Мои/Все» обратно) - тумблер
  // ведёт себя как у настоящего менеджера, стартуя с дефолта MGR_ALL=false («Мои»).
  if(ME.role==='admin' && !eff.viewingAs) MGR_ALL=true;
}

/* ---- карусель дат «Маяк» (утверждено 19.09, превью CJ29KgstWjQQza63LE9ucs) ----

var DC_BACK = 21, DC_FWD = 45;       // окно дат: TODAY-21 .. TODAY+45
var DC_CHIP_W = 52, DC_GAP = 10, DC_STEP = DC_CHIP_W + DC_GAP;

var dcLastTicked = 0;
var dcDragging=false, dcStartX=0, dcStartIdx=0, dcLastX=0, dcLastT=0, dcVel=0, dcRaf=null;
var AC_ = null;
function dcUnlockAudio_(){
  // AudioContext должен создаваться/резюмироваться синхронно ВНУТРИ настоящего
  // пользовательского жеста (не внутри requestAnimationFrame) - иначе на мобильном
  // WebView (TS HUB.apk) первый звук может молча не сыграть. Вызывается из pointerdown
  // и тапа по чипу - оба места, откуда реально стартует жест, до любых rAF-циклов.
  try{
    AC_ = AC_ || new (window.AudioContext||window.webkitAudioContext)();
    if(AC_.state==='suspended') AC_.resume();
  }catch(e){}
}
function dcBlip(f1,f2,dur,vol,type){
  try{
    AC_ = AC_ || new (window.AudioContext||window.webkitAudioContext)();
    var o=AC_.createOscillator(), g=AC_.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f1, AC_.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, AC_.currentTime+dur);
    g.gain.setValueAtTime(vol, AC_.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC_.currentTime+dur);
    o.connect(g); g.connect(AC_.destination); o.start(); o.stop(AC_.currentTime+dur);
  }catch(e){}
}
/* Звук «Трещотка» (утверждено 19.09 взамен «Стекло» - Влад: тише некуда, не слышно на

   были в парах для сравнения, но ничего не мешает взять звук от одной пары и визуал от
   другой после утверждения). */
function dcTickFwd(){ dcBlip(300,260,.035,.03,'square'); }
function dcTickBwd(){ dcBlip(260,300,.035,.03,'square'); }

/* Звуки формы «Новая заявка» (19.09) - те же частоты/семантика, что desktop order-plan-v2.js
   S.nav/S.stepUp/S.stepDown/S.toggle/S.attention (см. комментарий у S там: nav - любой

   оценки, attention - блокирующая ошибка). Общий AudioContext/движок с каруселью дат. */
function sNav(){ dcUnlockAudio_(); dcBlip(392,440,.05,.022); }
function sStepUp(){ dcUnlockAudio_(); dcBlip(440,560,.05,.03); }
function sStepDown(){ dcUnlockAudio_(); dcBlip(560,440,.05,.03); }

/* Гармошка «Ещё N» (desktop S.unfold/S.fold, order-plan-v2.js) - «звук должен
   соответствовать раскрытию, не просто пик, а как раскрытие гармошки»: бег коротких нот
   вверх, ОДНА НА КАЖДЫЙ появляющийся чип (тот же шаг 35мс, что несёт .chip-enter в CSS -
   ухо и глаз раскрывают меха вместе), triangle - не sine, «язычковый» тембр. Свёртка -
   бег вниз, втрое короче. Портировано дословно, не изобретено заново. */
function sUnfold(n){
  dcUnlockAudio_();
  var steps=Math.max(1,Math.min(8,n||1));
  for(var i=0;i<steps;i++){ (function(i){ setTimeout(function(){ dcBlip(258+i*32,278+i*32,.05,.026,'triangle'); }, i*35); })(i); }
}
function sFold(){
  dcUnlockAudio_();
  for(var i=0;i<3;i++){ (function(i){ setTimeout(function(){ dcBlip(360-i*40,340-i*40,.04,.022,'triangle'); }, i*22); })(i); }
}

function buildDateCarousel(){
  DAYS = [];
  for(var i=-DC_BACK;i<=DC_FWD;i++){
    var d=addDays(TODAY,i);
    DAYS.push({ date:d, iso:iso(d), wd:WD[(d.getDay()+6)%7], weekend:(d.getDay()===0||d.getDay()===6), isToday:i===0 });
  }
  var strip=$('dcStrip');
  strip.innerHTML=''; dcChipEls=[];
  DAYS.forEach(function(day,i){
    var el=document.createElement('div');
    el.className='dchip'+(day.weekend?' weekend':'')+(day.isToday?' today':'');
    el.style.left=(i*DC_STEP)+'px';
    el.innerHTML=day.wd+' '+day.date.getDate()+'<span class="cnt">—</span>';
    el.addEventListener('click', function(){ dcUnlockAudio_(); dcTravelTo(i); });
    strip.appendChild(el);
    dcChipEls.push(el);
  });
  strip.style.width=(DAYS.length*DC_STEP-DC_GAP)+'px';
  var startOffset = Math.round((SELECTED_DATE-TODAY)/86400000);
  dcIdx = Math.max(0, Math.min(DAYS.length-1, startOffset+DC_BACK));
  dcLastTicked = Math.round(dcIdx);
  dcApplyTransform();
  dcOnSettled(DAYS[Math.round(dcIdx)]);
  var wrap=$('dcWrap');
  wrap.addEventListener('pointerdown', dcOnDown);
  wrap.addEventListener('pointermove', dcOnMove);
  wrap.addEventListener('pointerup', dcOnUp);
  wrap.addEventListener('pointercancel', dcOnUp);
}
function renderCarouselCounts(){
  dcChipEls.forEach(function(el,i){
    var c=COUNTS[DAYS[i].iso];
    var cnt=el.querySelector('.cnt'); if(cnt) cnt.textContent = c?c.total:'—';
  });
}
function dcApplyTransform(){
  var centerFromOrigin = dcIdx*DC_STEP + DC_CHIP_W/2;
  $('dcStrip').style.transform = 'translateX(' + (-centerFromOrigin) + 'px)';
  dcChipEls.forEach(function(el,i){
    var dist = Math.abs(i-dcIdx);
    el.style.transform = 'scale(' + Math.max(0.66,1-dist*0.12) + ')';
    el.style.opacity = Math.max(0.32,1-dist*0.26);
  });
}
function dcOnSettled(day){
  dcChipEls.forEach(function(el,i){ el.classList.toggle('sel', i===Math.round(dcIdx)); });
  SELECTED_DATE = day.date;
  $('btnDate').innerHTML = fmtHeaderDate(SELECTED_DATE);
  $('btnToday').hidden = day.isToday;
  startLoad_();
}
function dcMaybeTick(){
  var nearest=Math.round(dcIdx);
  if(nearest===dcLastTicked) return;
  var dir = nearest>dcLastTicked?1:-1, steps=Math.abs(nearest-dcLastTicked);
  for(var s=1;s<=steps;s++){ (function(s){ setTimeout(function(){ (dir>0?dcTickFwd:dcTickBwd)(); }, (s-1)*16); })(s); }
  vib(4);
  dcLastTicked=nearest;
}
function dcOnDown(e){
  dcUnlockAudio_();
  dcDragging=true; $('dcWrap').classList.add('dragging');
  cancelAnimationFrame(dcRaf);
  dcStartX=e.clientX; dcLastX=e.clientX; dcLastT=performance.now();
  dcStartIdx=dcIdx; dcVel=0;
  try{ $('dcWrap').setPointerCapture(e.pointerId); }catch(err){}
}
function dcOnMove(e){
  if(!dcDragging) return;
  var now=performance.now();
  var dt=Math.max(8, now-dcLastT);
  var instVel=Math.max(-2.2,Math.min(2.2,(e.clientX-dcLastX)/dt));
  dcVel = 0.7*dcVel + 0.3*instVel;
  dcLastX=e.clientX; dcLastT=now;
  dcIdx = Math.max(0, Math.min(DAYS.length-1, dcStartIdx - (e.clientX-dcStartX)/DC_STEP));
  dcApplyTransform(); dcMaybeTick();
}
function dcOnUp(){
  if(!dcDragging) return;
  dcDragging=false; $('dcWrap').classList.remove('dragging');
  dcInertia(-(dcVel*16)/DC_STEP);
}
function dcInertia(v){
  function step(){
    v*=0.93; dcIdx=Math.max(0,Math.min(DAYS.length-1, dcIdx+v));
    dcApplyTransform(); dcMaybeTick();
    if(Math.abs(v)>0.001 && dcIdx>0 && dcIdx<DAYS.length-1) dcRaf=requestAnimationFrame(step);
    else dcSnap();
  }
  if(Math.abs(v)<0.02){ dcSnap(); return; }
  dcRaf=requestAnimationFrame(step);
}
function dcSnap(){
  var target=Math.max(0,Math.min(DAYS.length-1,Math.round(dcIdx)));
  dcTravelTo(target);
}
function dcTravelTo(target){
  var from=dcIdx, start=performance.now(), dur=(Math.abs(target-from)<1.2)?180:260;
  cancelAnimationFrame(dcRaf);
  function step(){
    var t=Math.min(1,(performance.now()-start)/dur);
    dcIdx = from + (target-from)*(1-Math.pow(1-t,3));
    dcApplyTransform(); dcMaybeTick();
    if(t<1) dcRaf=requestAnimationFrame(step);
    else { dcIdx=target; dcApplyTransform(); dcOnSettled(DAYS[target]); }
  }
  dcRaf=requestAnimationFrame(step);
}
/* Переход на конкретную дату извне (сегодня, «Перейти к дню», после сохранения/переноса
   заявки) - если дата вне построенного окна (редкий перенос далеко вперёд), карусель просто
   останавливается у ближайшего края, но SELECTED_DATE и список заявок - настоящие. */
function goToDate(d){
  var offset = Math.round((d-TODAY)/86400000);
  var target = Math.max(0, Math.min(DAYS.length-1, offset+DC_BACK));
  dcTravelTo(target);
}

function visibleOrders(){
  var list = ORDERS.slice();
  if(ROLE==='mgr'){
    // Сравнение по имени, не по email (19.09) - у ME всегда РЕАЛЬНАЯ почта admin'а, даже
    // во вьювере "как Савиток"; заявки несут имя менеджера (o.manager), не email, из
    // которого можно узнать email вьювера - имя надёжнее и уже есть в данных.
    if(!MGR_ALL) list = list.filter(function(o){ return o.manager===effectiveIdentity_().name; });
    if(SEARCH_Q) list = list.filter(function(o){ return (o.customer||'').toLowerCase().indexOf(SEARCH_Q.toLowerCase())>=0; });
  } else {
    if(LOG_TYPE_FILTER!=='all') list = list.filter(function(o){ return o.equipment_type===LOG_TYPE_FILTER; });
    var mgrKeys=Object.keys(LOG_MGR_FILTER).filter(function(k){return LOG_MGR_FILTER[k];});
    if(mgrKeys.length) list = list.filter(function(o){ return LOG_MGR_FILTER[o.manager]; });
    if(LOG_STAT_FILTER==='nocar') list = list.filter(function(o){ return !o.vehicle && o.status!=='cancelled' && o.status!=='done'; });
    if(LOG_STAT_FILTER==='nd') list = list.filter(function(o){ return o.needs_data; });
    if(LOG_STAT_FILTER==='new') list = list.filter(function(o){ return o.created_new; });
    if(SEARCH_Q) list = list.filter(function(o){ return (o.customer||'').toLowerCase().indexOf(SEARCH_Q.toLowerCase())>=0; });
  }
  list.sort(function(a,b){ return (a.day_no||0)-(b.day_no||0); });
  return list;
}

/* Фамилия + имя, без отчества (Влад 20.09: «не обязательно в мобильном приложении

   только на карточке списка (тесно), в самой заявке при открытии - полное ФИО как было. */
function shortName_(s){ var p=String(s||'').trim().split(/\s+/); return p.slice(0,2).join(' '); }
/* Бейдж менеджера (Влад 20.09: «нужно, чтобы была видна на заявке фамилия менеджера») -
   первые 3 буквы фамилии, цвет закреплён за человеком - тот же PERSON_COLOR, что уже
   красит точки в фильтре «Все менеджеры». Сырое o.manager_name (не показное o.manager,
   которое normalizeOrder() подменяет на «внутр.»/«—» для карточки) - для внутренних/
   самообслуживаемых заявок без реального менеджера бейдж просто не рисуется. */
function mgrBadge_(o){
  if(!o.manager_name) return '';
  var color = PERSON_COLOR[o.manager_name] || '#8b8980';
  return '<span class="mgr" style="background:'+color+'26;color:'+color+'">'+esc(String(o.manager_name).trim().slice(0,3).toUpperCase())+'</span>';
}
function vehLineHtml(o){
  var info, actions='';
  if(o.status==='cancelled'){
    var g = o.vehicle ? o.vehicle.gos : '—';
    if(!o.cancel_ack){
      info = '<span class="gos strike">'+esc(g)+'</span> <span class="empty">отбой не принят</span>';
      if(ROLE==='log') actions = '<button class="c-btn ackoff" data-act="ack" data-id="'+o.id+'">✕ Принять отбой</button>';
    } else {
      info = '<span class="gos strike">'+esc(g)+'</span> <span class="empty">отбой принят</span>';
      if(o.vehicle && ROLE==='log') actions = '<button class="c-btn rm" data-act="rm" data-id="'+o.id+'">Снять</button>';
    }
  } else if(!o.vehicle){
    info = '<span class="empty">машину ещё не поставили</span>';
    if(ROLE==='log'){
      actions = !o.taken_by
        ? '<button class="c-btn accept" data-act="take" data-id="'+o.id+'">✓ Принять</button>'
        : '<button class="c-btn put" data-act="put" data-id="'+o.id+'">Поставить</button>';
    }
  } else {
    var v=o.vehicle;
    info = '<span class="gos">'+esc(v.gos)+'</span> <span class="drv">'+esc(shortName_(v.driver)||'—')+'</span>'+
      (!v.own && v.company ? ' <span class="empty">'+esc(v.company)+'</span>' : '');
    actions = v.own ? '<span class="tag own">СВОЯ</span>' : '<span class="tag hired">НАЁМ</span>';
    if(ROLE==='log' && o.status!=='done') actions += '<button class="c-btn rm" data-act="rm" data-id="'+o.id+'">Снять</button>';
  }
  return '<span class="veh-info">'+info+'</span>'+(actions?('<span class="veh-actions">'+actions+'</span>'):'');
}
function pendHtml(o){
  if(!o.pending) return '';
  if(ROLE==='mgr'){

function apiErrToast_(r){ toast((r.data&&r.data.error)||'Ошибка', null, null, null, {err:true}); }

document.addEventListener('click', function(e){
  var actBtn = e.target.closest('[data-act]');
  if(actBtn){
    e.stopPropagation();
    var id=actBtn.getAttribute('data-id'), act=actBtn.getAttribute('data-act');
    var o=findOrder(id);
    if(!o) return;
    if(act==='take'){
      vib(6);
      apiPost_('/orders/take', {id:o.id}).then(function(r){ if(!r.ok) return apiErrToast_(r); replaceOrder(r.data.order); toast('Взяли в работу','№'+o.day_no+' · '+o.customer); render(); });
    } else if(act==='put'){ openVehiclePicker(o); }
    else if(act==='rm'){
      vib(30);
      if(!o.vehicle || !o.vehicle.executor_id) return;
      apiPost_('/orders/executor_remove', {executor_id:o.vehicle.executor_id}).then(function(r){ if(!r.ok) return apiErrToast_(r); replaceOrder(r.data.order); toast('Машина снята','№'+o.day_no); render(); });
    } else if(act==='ack'){
      vib(40);
      apiPost_('/orders/otboy_ack', {id:o.id}).then(function(r){ if(!r.ok) return apiErrToast_(r); replaceOrder(r.data.order); toast('Отбой принят','№'+o.day_no); render(); });
    } else if(act==='pend_ok'){
      vib([8,40,8]);
      apiPost_('/orders/change_request_resolve', {id:o.pending.id, action:'approve'}).then(function(r){ if(!r.ok) return apiErrToast_(r); replaceOrder(r.data.order); toast('Замена подтверждена'); render(); });
    } else if(act==='pend_no'){
      vib(30);
      apiPost_('/orders/change_request_resolve', {id:o.pending.id, action:'reject'}).then(function(r){ if(!r.ok) return apiErrToast_(r); replaceOrder(r.data.order); toast('Замена отклонена'); render(); });
    }
    return;
  }
  var card = e.target.closest('.card');
  if(card){
    var o2=findOrder(card.getAttribute('data-id'));
    if(!o2) return;
    if(card.getAttribute('data-canview')==='0'){ toast('Подробности этой заявки видит только её менеджер'); return; }
    /* Логисту нужны детали (груз, адреса, телефон водителя) сразу, не за жестом «потянуть
       вверх» - Влад 20.09: «должно быть больше информации по заявке». Менеджер работает
       больше со статусом/списком - для него полный лист по-прежнему за свайпом. */
    openSheet('view', o2, ROLE==='log' ? 'full' : 'half');
  }
});

function openSheet(kind, data, detent){
  sheetKind=kind; sheetData=data||{}; sheetState=detent||'full';
  var sheet=$('sheet'), scrim=$('scrim');
  sheet.className='sheet '+sheetState;
  scrim.classList.add('on');
  renderSheet();
  if(hist.depth<1) histPush();
}
function closeSheet(fromHist){
  if(sheetState==='closed') return;
  sheetState='closed';
  $('sheet').className='sheet';
  $('scrim').classList.remove('on');
  if(!fromHist) histPop();
  sheetKind=null; sheetData=null;
}
$('scrim').addEventListener('click', function(){ closeSheet(); closeDrawer(); });
$('grip').addEventListener('click', function(){
  if(sheetState==='half') setDetent('full'); else if(sheetState==='full') setDetent('half');
});
function setDetent(d){ sheetState=d; $('sheet').className='sheet '+d; }
/* свайп вниз по grip/шапке листа - закрыть/свернуть (тот же приём, что plan-m 1518-1531) */
(function initSheetSwipe_(){
  var startY=null, startState=null;
  function onStart(e){ if(sheetState==='closed') return; startY=(e.touches?e.touches[0]:e).clientY; startState=sheetState; }
  function onEnd(e){
    if(startY==null) return;
    var endY=(e.changedTouches?e.changedTouches[0]:e).clientY; var dy=endY-startY; startY=null;
    if(dy>60){ if(startState==='full') setDetent('half'); else closeSheet(); }
    else if(dy<-40 && startState==='half') setDetent('full');
  }
  ['grip','shHead'].forEach(function(id){
    var el=$(id);
    el.addEventListener('touchstart', onStart, {passive:true});
    el.addEventListener('touchend', onEnd);
  });
})();

function renderSheet(){
  var head=$('shHead'), body=$('shBody'), foot=$('shFoot');
  if(sheetKind==='view') return renderViewSheet(head,body,foot);
  if(sheetKind==='new') return renderNewSheet(head,body,foot);
  if(sheetKind==='more') return renderMoreSheet(head,body,foot);

function driverTaskText_(o){

  lines.push('Выгрузка: '+(o.to[0]||'уточнить')+(o.to[1]?(', '+o.to[1]):''));

function copyText_(text, btn, doneLabel){
  var ok=false;
  try{ document.execCommand && document.execCommand('copy'); }catch(e){}
  var p = (navigator.clipboard && navigator.clipboard.writeText) ? navigator.clipboard.writeText(text).then(function(){return true;}).catch(function(){return false;}) : Promise.resolve(false);
  return p.then(function(res){
    ok=res;
    vib([8,40,8]);
    if(btn){ var orig=btn.innerHTML; btn.innerHTML=doneLabel||'Скопировано ✓'; setTimeout(function(){ btn.innerHTML=orig; }, 1800); }
    if(!ok) toast('Не удалось скопировать','текст: '+text.split('\n')[0]);
    return ok;
  });
}

function renderMoreSheet(head,body,foot){
  var o=sheetData;
  head.innerHTML = shHeadHtml('Ещё · №'+o.day_no);
  $('shCancel').addEventListener('click', function(){ closeSheet(); });
  /* «Отбой» - функция менеджера, не логиста (Влад 20.09: «отбой и подтверждение заявки -
     это функция менеджера»). Исключение - заявки БЕЗ реального менеджера (o.manager_name
     пусто - логист завёл её сам как «внутреннюю»/самообслуживание, см. /orders/save на
     сервере: у логиста без явного manager_email заявка остаётся без менеджера) - там
     логист и есть единственный, кто может её отменить, то есть выступает и логистом, и
     менеджером сразу. Сравнивать нужно СЫРОЕ o.manager_name, не отображаемое o.manager -
     normalizeOrder() всегда подставляет туда «внутр.»/«—» вместо пустой строки для показа
     в карточке, оно никогда не бывает falsy. */
  var selfManaged = ROLE==='log' && !o.manager_name;
  var rows = [];
  if(ROLE==='mgr' || selfManaged){
    rows.push(['repeat','Повторить',false]);
    rows.push(['transfer','Перенести', (o.status!=='cancelled'&&o.status!=='done')]);
    rows.push(['contract','Договор-заявка ⤓',false]);
  }
  if(ROLE==='log'){
    rows.push(['rmveh','Снять машину',false]);
    rows.push(['relog','Переназначить логиста',false]);
    if(selfManaged) rows.push(['cancel','Отбой по заявке',false]);
  }
  rows.push(['edit','Редактировать',false]);
  body.innerHTML = rows.map(function(r){
    var badge = (r[0]==='transfer' && r[2]) ? '<span class="badge-new">новое</span>' : '';
    var cls = r[0]==='cancel' ? 'list-row danger' : 'list-row';
    return '<div class="'+cls+'" data-mact="'+r[0]+'">'+esc(r[1])+badge+'<span class="go"><svg><use href="#i-chev"/></svg></span></div>';
  }).join('');
  foot.innerHTML='';
  body.querySelectorAll('[data-mact]').forEach(function(el){
    el.addEventListener('click', function(){
      var a=el.getAttribute('data-mact');
      if(a==='repeat'){ openSheet('repeat', o, 'half'); }
      else if(a==='transfer'){ openSheet('transfer', o, 'half'); }
      else if(a==='contract'){ toast('Договор-заявка','пока доступна в десктопной версии «Задания»'); closeSheet(); }
      else if(a==='edit'){ loadMeta().then(function(){ openSheet('new', o, 'full'); }); }
      else if(a==='cancel'){
        vib(40);
        apiPost_('/orders/status', {id:o.id, status:'cancelled'}).then(function(r){ if(!r.ok) return apiErrToast_(r); replaceOrder(r.data.order); toast('Отбой оформлен'); closeSheet(); render(); });
      }
      else if(a==='rmveh'){
        vib(30);
        if(!o.vehicle || !o.vehicle.executor_id){ closeSheet(); return; }
        apiPost_('/orders/executor_remove', {executor_id:o.vehicle.executor_id}).then(function(r){ if(!r.ok) return apiErrToast_(r); replaceOrder(r.data.order); toast('Машина снята'); closeSheet(); render(); });
      }
      else if(a==='relog'){ openSheet('relog', o, 'half'); }
    });
  });
}

/* ---- «Повторить» ---- */
/* «Повторить заявку» (20.09, Влад: "тот же принцип, что в десктопной - несколько раз
   нажал на дату - несколько заявок появилось, выбор времени тоже") - 1:1 логика с
   openRepeat()/runRepeat() в order-plan-v2.js: клик по дню = +1 заявка НА ЭТОТ день
   (копится, чип показывает счётчик ×N), под чипами - список будущих заявок по дням,
   время у каждой своё (по умолчанию - как в образце), регулируется −30/+30. Убрать
   лишнюю заявку - крестик у её строки (десктопный правый клик на чипе недоступен на
   тач-экране, отдельный жест для этого не заводим - список и так под рукой).
   Presets «Будни»/«Все 7 дней» - те же +1 на каждый день группы, «Сбросить» - очистка. */
function repDayLabel_(d,i){
  if(i===0) return 'Сегодня '+fmtDate(d);
  if(i===1) return 'Завтра '+fmtDate(d);
  return WD[(d.getDay()+6)%7]+' '+d.getDate();
}
function repStepTime_(t,delta){
  var p=(t||'08:00').split(':'); var mins=((+p[0])*60+(+p[1])+delta); mins=((mins%1440)+1440)%1440;
  return pad2(Math.floor(mins/60))+':'+pad2(mins%60);
}
function renderRepeatSheet(head,body,foot){
  var o=sheetData;
  head.innerHTML = shHeadHtml('Повторить заявку', '№'+o.day_no+' · '+o.customer);
  $('shCancel').addEventListener('click', function(){ closeSheet(); });
  var days=[]; for(var i=0;i<7;i++) days.push(addDays(new Date(),i));
  var defTime = o.service_time||'';
  var rows=[]; // {di, t} - по одной на будущую заявку, di = индекс в days
  function countOf(di){ return rows.filter(function(r){return r.di===di;}).length; }
  function addDay(di){ rows.push({di:di, t:defTime}); }
  function groupDays(p){ var arr=[]; days.forEach(function(d,i){ var wd=d.getDay(); if(p==='all'||(p==='wd'&&wd!==0&&wd!==6)) arr.push(i); }); return arr; }
  function renderChips(){
    body.querySelectorAll('#repDays .chip').forEach(function(c){
      var i=+c.getAttribute('data-i'); var n=countOf(i);
      c.setAttribute('aria-pressed', n>0?'true':'false');
      c.innerHTML = esc(repDayLabel_(days[i],i)) + (n ? (' <span class="n">×'+n+'</span>') : '');
    });
  }
  function renderList(){
    var byDay={}; rows.forEach(function(r,idx){ (byDay[r.di]=byDay[r.di]||[]).push(idx); });
    var h='';
    days.forEach(function(d,i){
      var idx=byDay[i]; if(!idx) return;
      h+='<div class="rep-day">'+esc(repDayLabel_(d,i))+' · '+idx.length+' '+plural(idx.length,'заявка','заявки','заявок')+'</div>';
      idx.forEach(function(ri,k){
        h+='<div class="rep-row"><span class="no">'+(k+1)+'</span>'+
          '<button data-ri="'+ri+'" data-dm="-30">−30</button>'+
          '<span class="t">'+esc(rows[ri].t||'--:--')+'</span>'+
          '<button data-ri="'+ri+'" data-dm="30">+30</button>'+
          '<button class="rm" data-ri="'+ri+'" data-rm="1" aria-label="Убрать">✕</button></div>';
      });
    });
    $('repList').innerHTML = h;
    var btn=$('btnRepGo');
    btn.disabled = !rows.length;
    btn.textContent = rows.length ? ('Создать '+rows.length+' '+plural(rows.length,'заявку','заявки','заявок')) : 'Создать заявки';
    $('repInfo').textContent = rows.length ? 'Все - «Не подтверждено», подтверди каждую отдельно' : 'Клик по дню - +1 заявка на этот день';
  }
  function render(){ renderChips(); renderList(); }

  body.innerHTML = '<div class="f-label">На какие дни и сколько</div>'+
    '<div class="chips" id="repDays">' + days.map(function(d,i){
      return '<button class="chip" data-i="'+i+'">'+esc(repDayLabel_(d,i))+'</button>';
    }).join('') + '</div>'+
    '<div class="chips" id="repPresets" style="margin-top:8px">'+
      '<button class="chip" data-preset="wd">Будни</button>'+
      '<button class="chip" data-preset="all">Все 7 дней</button>'+
      '<button class="chip" data-preset="none">Сбросить</button>'+
    '</div>'+
    '<div class="info" id="repInfo">Клик по дню - +1 заявка на этот день</div>'+
    '<div id="repList" style="margin-top:6px"></div>';

  var dayBox=$('repDays'), preBox=$('repPresets'), list=$('repList');
  dayBox.addEventListener('click', function(e){ var c=e.target.closest('.chip'); if(!c) return; addDay(+c.getAttribute('data-i')); vib(4); render(); });
  preBox.addEventListener('click', function(e){
    var c=e.target.closest('.chip'); if(!c) return;
    var p=c.getAttribute('data-preset');
    if(p==='none'){ rows=[]; render(); return; }
    groupDays(p).forEach(addDay); vib(4); render();
  });
  list.addEventListener('click', function(e){
    var b=e.target.closest('button[data-ri]'); if(!b) return;
    var ri=+b.getAttribute('data-ri');
    if(b.getAttribute('data-rm')){ rows.splice(ri,1); vib(4); render(); return; }
    rows[ri].t = repStepTime_(rows[ri].t||defTime, +b.getAttribute('data-dm'));
    vib(4); renderList();
  });
  /* Кнопка подвала должна существовать в DOM ДО первого render() - renderList() внутри
     него сразу обращается к #btnRepGo (disabled/textContent). Раньше foot.innerHTML
     ставился ПОСЛЕ render() - на самом первом рендере $('btnRepGo') был null,
     "btn.disabled=..." падал с TypeError, и код после (сама вставка кнопки в foot,
     навешивание клика) не выполнялся вообще - лист оставался без кнопки подтверждения
     на каждое открытие (Влад 20.09: «кнопка где-то непонятно где»). */
  foot.innerHTML='<button class="btn primary wide" id="btnRepGo" disabled>Создать заявки</button>';
  render();

  $('btnRepGo').addEventListener('click', function(){
    if(!rows.length){ toast('Кликни по дню - добавь хотя бы одну заявку'); return; }
    var btn=$('btnRepGo'); btn.disabled=true; btn.textContent='Создаю…';
    // Полный набор полей образца - тот же base, что и в openRepeat()/runRepeat()
    // (order-plan-v2.js) - не только адрес/цена/тип, но и контакты, координаты,
    // габариты, документы, переработка, внутренний заказчик и т.д.
    var base = {
      needs_data:o.needs_data?1:0, customer:o.customer, customer_entity_id:o.customer_entity_id||'',
      executor_entity_id:o.executor_entity_id||'', customer_contact_name:o.customer_contact_name||'', customer_contact_phone:o.customer_contact_phone||'',
      equipment_type:o.equipment_type, cargo:o.cargo||'', cargo_weight_t:o.cargo_weight_t||'', cargo_dims:o.cargo_dims||'',
      gabarit:o.gabarit||'', rework_terms:o.rework_terms||'', documents:o.documents||'', note:o.note||'', cash:o.cash?1:0,
      load_address:o.load_address||'', load_lat:o.load_lat||'', load_lon:o.load_lon||'', load_contact_name:o.load_contact_name||'', load_contact_phone:o.load_contact_phone||'',
      unload_address:o.unload_address||'', unload_lat:o.unload_lat||'', unload_lon:o.unload_lon||'', unload_contact_name:o.unload_contact_name||'', unload_contact_phone:o.unload_contact_phone||'',
      price:o.price||0, payment_status:o.payment_status||'', internal:o.internal?1:0
    };
    Promise.all(rows.map(function(r){
      var p={}; Object.keys(base).forEach(function(k){ p[k]=base[k]; });
      p.service_date=iso(days[r.di]); p.service_time=r.t||'';
      return apiPost_('/orders/save', p).then(function(res){ return {r:res, di:r.di}; });
    })).then(function(res){
      btn.disabled=false;
      var good=res.filter(function(x){ return x.r && x.r.ok; });
      var bad=res.length-good.length;
      var perDay={}; good.forEach(function(x){ perDay[x.di]=(perDay[x.di]||0)+1; });
      vib([8,40,8]);
      toast('Создано '+good.length+' '+plural(good.length,'заявка','заявки','заявок')+
        (bad ? (' · '+bad+' не создалось') : '') + ' · все «Не подтверждено»');
      closeSheet(); loadCounts();
    });
  });
}

/* ---- «Перенести» ---- */
function renderTransferSheet(head,body,foot){
  var o=sheetData;
  head.innerHTML = shHeadHtml('Перенести заявку', '№'+o.day_no+' · '+o.customer);
  $('shCancel').addEventListener('click', function(){ closeSheet(); });
  var days=[]; for(var i=1;i<=13;i++) days.push(addDays(fromIso(o.service_date),i));
  var chosen=null;
  body.innerHTML = '<div class="f-label">Новая дата</div><div class="chips" id="trDays">' + days.map(function(d,i){
    return '<button class="chip" data-i="'+i+'">'+WD[(d.getDay()+6)%7]+' '+d.getDate()+'</button>';
  }).join('') + '</div><div class="info warn">Текущая заявка получит статус «Отбой», связь между заявками сохранится</div>';
  body.querySelectorAll('#trDays .chip').forEach(function(c){
    c.addEventListener('click', function(){ body.querySelectorAll('#trDays .chip').forEach(function(x){x.setAttribute('aria-pressed','false');}); c.setAttribute('aria-pressed','true'); chosen=days[+c.getAttribute('data-i')]; vib(6); });
  });
  foot.innerHTML='<button class="btn primary wide" id="btnTrGo">Перенести</button>';
  $('btnTrGo').addEventListener('click', function(){
    if(!chosen){ toast('Выберите дату'); return; }
    apiPost_('/orders/transfer', {id:o.id, new_date:iso(chosen)}).then(function(r){
      if(!r.ok) return apiErrToast_(r);
      replaceOrder(r.data.old_order);
      vib([8,40,8]); toast('Заявка перенесена','на '+fmtDate(chosen)); closeSheet(); render(); loadCounts();
    });
  });
}

/* ---- лист «Новая заявка» / редактирование ---- */
function renderNewSheet(head,body,foot){
  var editing = !!sheetData.id;
  var o = editing ? sheetData : {};
  /* Контакты (заказчика/погрузки/выгрузки) и «От кого» (executor_entity_id) - десктоп их
     давно имеет (op2-f-custcontact/-fromcontact/-tocontact/-ent в order-plan-v2.js), на
     телефоне не было НИ ОДНОГО из них с самого первого переноса формы (Влад 20.09:
     «невозможно добавить контакты, это основное поле»). payment_status раньше по
     умолчанию был «Безнал» - это вообще не значение из словаря оплаты (словарь - «Не
     оплачено»/«Предоплата»/«Оплачено», «нал/безнал» - отдельная ось, уже есть переключатель
     «Наличные» ниже) - похоже на случайную путаницу способа/статуса оплаты при первом
     переносе, дефолт исправлен на пусто, как у desktop. */
  var F = editing ? {
    service_date:o.service_date, service_time:o.service_time, equipment_type:o.equipment_type, customer:o.customer||'',
    from:o.from, to:o.to, cargo:o.cargo||'', gabarit:o.gabarit||'Габарит', price:o.price, payment_status:o.payment_status||'',
    cash:!!o.cash, note:o.note||'', needs_data:!!o.needs_data, weight:o.weight, cargo_dims:o.cargo_dims, documents:o.documents, rework:o.rework,
    customer_contact_name:o.customer_contact_name||'', customer_contact_phone:o.customer_contact_phone||'',
    load_contact_name:o.load_contact_name||'', load_contact_phone:o.load_contact_phone||'',
    unload_contact_name:o.unload_contact_name||'', unload_contact_phone:o.unload_contact_phone||'',
    executor_entity_id:o.executor_entity_id||''
  } : { service_date: iso(SELECTED_DATE), service_time:null, equipment_type:null, customer:'', from:['',''], to:['',''],
    cargo:'', gabarit:'Габарит', price:null, payment_status:'', cash:false, note:'', needs_data:false, internal_customer:null,
    customer_contact_name:'', customer_contact_phone:'', load_contact_name:'', load_contact_phone:'',
    unload_contact_name:'', unload_contact_phone:'', executor_entity_id:'' };
  head.innerHTML = shHeadHtml(editing ? ('Заявка №'+o.day_no) : 'Новая заявка');
  $('shCancel').addEventListener('click', function(){ closeSheet(); });

  var d=fromIso(F.service_date);
  /* primary сохраняется (не .map(x=>x.value), как раньше) - нужен для гармошки «Ещё N»
     ниже, тот же флаг is_primary из словаря, что и у desktop eqRowHtml(). */
  var EQUIP = (META && META.dictionary && META.dictionary.equipment && META.dictionary.equipment.length) ? META.dictionary.equipment : [{value:'Трал',primary:true},{value:'Длинномер',primary:true}];
  var GABS = (META && META.dictionary && META.dictionary.gabarit && META.dictionary.gabarit.length) ? META.dictionary.gabarit.map(function(x){return x.value;}) : ['Габарит','Негабарит'];
  /* «Документы»/«Переработка» - те же словари, что у desktop <select> (op2-f-docs/
     op2-f-rework, dict('documents')/dict('rework')) - были голым текстовым полем без
     единого варианта выбора, хотя справочник для них уже существует и уже приходит с
     /orders/meta (тот же вызов, что уже кормит EQUIP/GABS выше - новых запросов не нужно). */
  var DOCS = (META && META.dictionary && META.dictionary.documents && META.dictionary.documents.length) ? META.dictionary.documents.map(function(x){return x.value;}) : ['Путевой лист','Путевой лист и ТТН'];
  var REWORKS = (META && META.dictionary && META.dictionary.rework && META.dictionary.rework.length) ? META.dictionary.rework.map(function(x){return x.value;}) : ['Без переработки','Переработка по согласованию с логистом'];
  var internalCustomers = (META && META.internal_customers) || [];
  /* «Статус оплаты» - тот же словарь, что desktop <select> (op2-f-pay, dict('payment_status')),
     реальные значения «Не оплачено»/«Предоплата»/«Оплачено» - было голым текстовым полем. */
  var PAYSTATUSES = (META && META.dictionary && META.dictionary.payment_status && META.dictionary.payment_status.length) ? META.dictionary.payment_status.map(function(x){return x.value;}) : ['Не оплачено','Предоплата','Оплачено'];
  /* «От кого» (юрлицо-исполнитель с нашей стороны, executor_entity_id) - тот же
     META.own_entities, что уже приходит с /orders/meta (op2-f-ent на desktop). Дефолт -
     первое юрлицо в списке, если ничего не выбрано (1:1 с desktop curEnt) - поле никогда
     не остаётся пустым, это НЕ то же самое, что «Кто заказывает»/«Заказчик» (тот - клиент,
     этот - какое из НАШИХ юрлиц оформляет сделку, важно для договора/счёта). */
  var ownEntities = (META && META.own_entities) || [];
  if(!F.executor_entity_id && ownEntities[0]) F.executor_entity_id = String(ownEntities[0].id);

  var html='';
  html += '<div class="f-label">Дата'+(editing?' - заблокирована':'')+'</div>';
  if(!editing){
    /* Дата по умолчанию = SELECTED_DATE (там, где остановилась карусель дат «Маяк»), не
       всегда «сегодня» - draft.service_date уже так и заводится (см. F выше). Здесь чинится
       только ВИДИМОСТЬ: раньше «Завтра» никогда не подсвечивался как выбранный (aria-pressed
       был захардкожен в false), а если карусель стояла НЕ на сегодня/завтра, вообще ни один
       чип не показывал, какая дата реально выбрана - на вид казалось, что дата «не
       подхватилась», хотя внутри всё было верно. */
    var isToday_=isSameDay(d,new Date()), isTomorrow_=isSameDay(d,addDays(new Date(),1));
    html += '<div class="chips"><button class="chip" data-datepreset="0" aria-pressed="'+isToday_+'">Сегодня '+fmtDate(new Date())+'</button>' +
      '<button class="chip" data-datepreset="1" aria-pressed="'+isTomorrow_+'">Завтра '+fmtDate(addDays(new Date(),1))+'</button>' +
      (!isToday_&&!isTomorrow_ ? '<button class="chip" id="fDateOther" aria-pressed="true">'+fmtDate(d)+'</button>' : '') +
      '<button class="chip icon" id="fCalBtn" aria-label="Другая дата"><svg><use href="#i-cal2"/></svg></button>' +
      '<input type="date" id="fDateNative" value="'+esc(F.service_date)+'" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1" autocomplete="off"></div>';
  } else {
    html += '<div class="frow"><div class="k">Дата</div><div class="v" style="display:inline-flex;align-items:center;gap:6px">'+fmtDateLong(d)+' <svg width="14" height="14"><use href="#i-lock"/></svg></div></div>';
  }
  html += '<div class="f-label">Время подачи</div><div class="timebox"><button id="fTimeMinus">−30</button><div class="t mono" id="fTimeVal">'+(F.service_time||'--:--')+'</div><button id="fTimePlus">+30</button></div>';
  html += '<div class="chips" id="fQuick">'+['06:00','08:00','10:00','13:00'].map(function(t){return '<button class="chip qk" data-t="'+t+'">'+t+'</button>';}).join('')+'<button class="chip" id="fUnclear">Уточнить</button></div>';

  /* «Тип техники»/«От кого» - гармошка «Ещё N» 1:1 с desktop eqRowHtml()/entRowHtml()
     (Влад 20.09: «такой же принцип, как в десктопе»). Тип техники: показываем ТОЛЬКО
     primary-варианты словаря (Трал/Длинномер) + «Ещё N» на остальные - если текущий
     выбор уже редкий (не primary), он спрятан за «Ещё» до раскрытия, тот же нюанс, что
     и на desktop (счётчик считает ВСЕ non-primary, не «оставшиеся кроме текущего»).
     «От кого» иначе - там нет понятия primary, свёрнуто видно ТЕКУЩИЙ выбор + «Ещё N»
     (N = все остальные юрлица кроме текущего). */
  function eqChipHtml_(t,on){ return '<button class="chip" data-t="'+esc(t.value)+'" aria-pressed="'+(!!on)+'">'+esc(t.value)+'</button>'; }
  function eqRowHtml_(curVal){
    var primary=EQUIP.filter(function(x){return x.primary;}), rest=EQUIP.filter(function(x){return !x.primary;});
    var html=primary.map(function(x){return eqChipHtml_(x, x.value===curVal);}).join('');
    if(rest.length) html+='<button class="chip" data-more>Ещё <span class="n">'+rest.length+'</span></button>';
    return html;
  }
  function entChipHtml_(e,on){ return '<button class="chip" data-ent="'+esc(e.id)+'" aria-pressed="'+(!!on)+'">'+esc(e.short_name||e.name)+'</button>'; }
  function entRowHtml_(curId){
    var cur=ownEntities.filter(function(e){return String(e.id)===String(curId);})[0]||ownEntities[0];
    var restN=Math.max(0, ownEntities.length-1);
    return (cur?entChipHtml_(cur,true):'') + (restN?'<button class="chip" data-more>Ещё <span class="n">'+restN+'</span></button>':'');
  }

  html += '<div class="f-label">Тип техники</div><div class="chips" id="fType">'+eqRowHtml_(F.equipment_type)+'</div>';

  if(ownEntities.length>1){
    html += '<div class="f-label">От кого (наше юрлицо)</div><div class="chips" id="fEnt">'+entRowHtml_(F.executor_entity_id)+'</div>';
  }

  if(ROLE==='log'){
    html += '<div class="f-label">Кто заказывает</div><div class="chips" id="fWho"><button class="chip" data-w="" aria-pressed="'+(!F.internal_customer)+'">Внешний заказчик</button>' +
      internalCustomers.map(function(w){ return '<button class="chip" data-w="'+w.id+'" data-name="'+esc(w.name)+'" aria-pressed="false">'+esc(w.short||w.name)+'</button>'; }).join('') + '</div>';
  }

  html += '<div class="f-label">Заказчик</div><div class="frow"><input id="fCust" placeholder="Начните вводить" value="'+esc(F.customer||'')+'"></div>';
  html += '<div class="sugg" id="fCustSugg" hidden></div>';
  html += '<div class="frow"><div class="k">Контакт</div><input id="fCustContact" placeholder="Имя · телефон" value="'+esc([F.customer_contact_name,F.customer_contact_phone].filter(Boolean).join(' · '))+'"></div>';
  html += '<div class="sw" id="fNd" aria-pressed="'+(!!F.needs_data)+'"><span>Под данные</span><span class="knob"></span></div>';

  html += '<div class="f-label">Откуда — куда</div>';
  html += '<div class="frow"><button type="button" class="k" id="fFromBase">Откуда</button><input id="fFrom" placeholder="'+(ROLE==='log'?'База':'По месту')+'" value="'+esc((F.from&&F.from[0])||'')+(F.from&&F.from[1]?(', '+esc(F.from[1])):'')+'"></div>';
  html += '<div class="sugg" id="fFromSugg" hidden></div>';
  html += '<div class="frow"><div class="k">Контакт</div><input id="fFromContact" placeholder="Имя · телефон" value="'+esc([F.load_contact_name,F.load_contact_phone].filter(Boolean).join(' · '))+'"></div>';
  html += '<div class="frow"><button type="button" class="k" id="fToBase">Куда</button><input id="fTo" placeholder="Адрес" value="'+esc((F.to&&F.to[0])||'')+(F.to&&F.to[1]?(', '+esc(F.to[1])):'')+'"></div>';
  html += '<div class="sugg" id="fToSugg" hidden></div>';
  html += '<div class="frow"><div class="k">Контакт</div><input id="fToContact" placeholder="Имя · телефон" value="'+esc([F.unload_contact_name,F.unload_contact_phone].filter(Boolean).join(' · '))+'"></div>';

  html += '<div class="f-label">Что везём</div>';
  html += '<div class="frow"><div class="k">Груз</div><input id="fCargo" placeholder="напр. экскаватор" value="'+esc(F.cargo||'')+'"></div>';
  html += '<div class="frow"><div class="k">Вес, т</div><input id="fWeight" inputmode="decimal" value="'+esc(F.weight||'')+'"></div>';
  html += '<div class="chips" id="fGab">'+GABS.map(function(g){ return '<button class="chip" data-g="'+esc(g)+'" aria-pressed="'+(F.gabarit===g)+'">'+esc(g)+'</button>'; }).join('')+'</div>';
  html += '<div class="frow"><div class="k">Габариты</div><input id="fDims" maxlength="100" value="'+esc(F.cargo_dims||'')+'"></div>';
  html += '<div class="f-label">Документы</div><div class="chips" id="fDocs"><button class="chip" data-d="" aria-pressed="'+(!F.documents)+'">—</button>' +
    DOCS.map(function(d){ return '<button class="chip" data-d="'+esc(d)+'" aria-pressed="'+(F.documents===d)+'">'+esc(d)+'</button>'; }).join('') + '</div>';
  html += '<div class="f-label">Условия переработки</div><div class="chips" id="fRework"><button class="chip" data-r="" aria-pressed="'+(!F.rework||F.rework==='—')+'">—</button>' +
    REWORKS.map(function(r){ return '<button class="chip" data-r="'+esc(r)+'" aria-pressed="'+(F.rework===r)+'">'+esc(r)+'</button>'; }).join('') + '</div>';

  html += '<div class="f-label">Деньги</div>';
  html += '<div class="frow"><div class="k">Стоимость</div><input id="fPrice" class="mono" inputmode="numeric" placeholder="₽" value="'+(F.price?fmtPrice(F.price).replace(' ₽',''):'')+'"></div>';
  html += '<div class="f-label">Статус оплаты</div><div class="chips" id="fPay"><button class="chip" data-p="" aria-pressed="'+(!F.payment_status)+'">—</button>' +
    PAYSTATUSES.map(function(p){ return '<button class="chip" data-p="'+esc(p)+'" aria-pressed="'+(F.payment_status===p)+'">'+esc(p)+'</button>'; }).join('') + '</div>';
  html += '<div class="sw" id="fCash" aria-pressed="'+(!!F.cash)+'"><span>Наличные</span><span class="knob"></span></div>';

  html += '<div class="f-label">Примечание</div><div class="frow"><textarea id="fNote" rows="2">'+esc(F.note||'')+'</textarea></div>';

  body.innerHTML=html;
  var draft = Object.assign({}, F);
  /* normalizeOrder() кладёт «—» вместо пустой rework_terms (для читаемого отображения в
     карточке/деталях) - если чипы «Условия переработки» не тронуть при редактировании,
     литеральное тире иначе улетело бы в payload как настоящее значение поля. */
  if(draft.rework==='—') draft.rework='';

  function bindChip(sel, cb){ body.querySelectorAll(sel).forEach(function(el){ el.addEventListener('click', function(){ cb(el); sToggle(); tick(); }); }); }
  bindChip('#fGab button', function(el){ body.querySelectorAll('#fGab button').forEach(function(x){x.setAttribute('aria-pressed','false');}); el.setAttribute('aria-pressed','true'); draft.gabarit=el.getAttribute('data-g'); vib(4); });
  bindChip('#fDocs button', function(el){ body.querySelectorAll('#fDocs button').forEach(function(x){x.setAttribute('aria-pressed','false');}); el.setAttribute('aria-pressed','true'); draft.documents=el.getAttribute('data-d'); vib(4); });
  bindChip('#fRework button', function(el){ body.querySelectorAll('#fRework button').forEach(function(x){x.setAttribute('aria-pressed','false');}); el.setAttribute('aria-pressed','true'); draft.rework=el.getAttribute('data-r'); vib(4); });
  bindChip('#fPay button', function(el){ body.querySelectorAll('#fPay button').forEach(function(x){x.setAttribute('aria-pressed','false');}); el.setAttribute('aria-pressed','true'); draft.payment_status=el.getAttribute('data-p'); vib(4); });

  /* Гармошка «Ещё N» (desktop expandEqRow/collapseEqRow/expandEntRow/collapseEntRow,
     1:1 включая FLIP-переход «Ещё»→«×» и каскад появления чипов 35мс). Один и тот же
     механизм для «Тип техники» и «От кого» - отличаются только источник данных и то,
     что кладётся в draft. */
  function expandChips_(seg, restItems, chipHtmlFn){
    var more=seg.querySelector('[data-more]'); if(!more) return;
    vib(4);
    var oldRect=more.getBoundingClientRect();
    more.outerHTML='<button type="button" class="chip chip-close" data-close>×</button>';
    seg.insertAdjacentHTML('beforeend', restItems.map(function(it){ return chipHtmlFn(it,false).replace('class="chip','class="chip chip-enter'); }).join(''));
    var closeBtn=seg.querySelector('.chip-close');
    var newRect=closeBtn.getBoundingClientRect();
    closeBtn.style.transform='translate('+(oldRect.left-newRect.left)+'px,'+(oldRect.top-newRect.top)+'px)';
    requestAnimationFrame(function(){ closeBtn.style.transform='none'; });
    seg.querySelectorAll('.chip-enter').forEach(function(c,i){ c.style.animationDelay=(i*35)+'ms'; });
    sUnfold(restItems.length);
  }
  var fType=$('fType');
  fType.addEventListener('click', function(e){

  /* ── подсказки заказчика/адресов (19.09) - 1:1 логика с десктопным order-plan-v2.js:

  var custSuggT_=null;

  function fetchCustSugg_(q){

  var addrHistHtml_={from:'',to:''}, addrGeoHtml_={from:'',to:''}, addrSuggT_={from:null,to:null};
  function renderAddrSugg_(side){
    var box=$(side==='from'?'fFromSugg':'fToSugg');
    var html=addrHistHtml_[side]+addrGeoHtml_[side];
    box.innerHTML=html; box.hidden=!html;
  }
  function dadataAddrParts_(d){
    d=d||{};
    var line=[d.street_with_type,d.house].filter(Boolean).join(', ');
    var first=line||d.settlement_with_type||d.city_with_type||d.region_with_type||'';
    var rest=[];
    if(line && line!==first) rest.push(line);
    if(d.city_district_with_type) rest.push(d.city_district_with_type);
    if(d.settlement_with_type && d.settlement_with_type!==first) rest.push(d.settlement_with_type);
    if(d.city_with_type && d.city_with_type!==first) rest.push(d.city_with_type);
    if(d.region_with_type && d.region_with_type!==d.city_with_type) rest.push(d.region_with_type);
    var seen={};
    return [first].concat(rest).filter(function(v){ if(!v||seen[v]) return false; seen[v]=true; return true; });

  function fetchAddrGeo_(side,q){

      apiGet_('/geocoder/suggest', {q:q.trim()}).then(function(r){
        if(!r.ok) return;
        var sug=r.data.suggestions||[], seen={}, h='';
        sug.forEach(function(f){
          if(f.lat==null || f.lon==null) return;
          var parts=dadataAddrParts_(f); if(!parts[0]) return;
          var main=parts[0], sub=parts.slice(1,3).join(', '), key=main+'|'+sub;
          if(seen[key]) return; seen[key]=true;
          h += '<div class="sugg-it" data-address="'+esc(f.value||main)+'" data-lat="'+esc(f.lat)+'" data-lon="'+esc(f.lon)+'"><span>'+esc(main)+'</span><span class="m">'+esc(sub)+'</span></div>';
        });
        addrGeoHtml_[side] = h ? '<div class="sugg-sec">Адреса</div>'+h : '';

      }).catch(function(){});
    }, 400);
  }
  function fetchAddrHistory_(name){
    if(!name) return;

     (order-plan-v2.js) - тот же разбор, чтобы сервер получал те же по смыслу два поля. */
  function splitContact_(s){
    s = String(s||'').trim();
    if(!s) return {name:'', phone:''};
    var parts = s.split('·');
    if(parts.length>=2) return {name:parts[0].trim(), phone:parts.slice(1).join('·').trim()};
    var m = s.match(/([+\d][\d\s\-()]{6,})$/);

      documents:draft.documents||'', rework_terms:draft.rework||'', price:draft.price||'', payment_status:draft.payment_status||'',
      cash:draft.cash?1:0, note:draft.note||'', needs_data:draft.needs_data?1:0,

       заказчик группы) - не когда entity_id просто пришёл из подсказки обычного заказчика
       (desktop: op2-f-who ветка отдельно от op2-f-cust.dataset.entityId, см.
       collectForm()). Раньше оба случая молча метились internal=1 - до подсказок заказчика
       это было незаметно, поскольку entity_id вообще неоткуда было взять кроме fWho. */
    if(draft.customer_entity_id){ payload.customer_entity_id=draft.customer_entity_id; if(draft.customer_is_internal) payload.internal=1; }
    if(editing){ payload.id=o.id; }
    else { payload.service_date=draft.service_date; }
    apiPost_('/orders/save', payload).then(function(r){
      if(!r.ok){ btn.disabled=false; tick(); return apiErrToast_(r); }
      vib([8,40,8]);
      var savedId = r.data.id;

  if(freeOther.length){ html += '<div class="sect-h">Свободны (другой тип)</div>'; freeOther.forEach(function(v){ html += resRow(v.gos, v.type+' · '+(v.driver||'—'), '', false, v.gos); }); }

      else toast('Поставлено '+ovlData.chosen, o.service_time?('на '+o.service_time):'');
      closeOvl(); render();
