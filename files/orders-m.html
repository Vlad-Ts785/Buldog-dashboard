<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Задание · TS HUB</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://api.yardhub.ru">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ── «Задание» с телефона, вариант «Лента» - утверждён Владом 19.09.2026, перенесён 1:1
   (правило «превью = контракт»). Источник: превью zm_variant_a.html (артефакт
   https://claude.ai/artifact/GqXTnYrH7HWrarK8PgX6Mc). Оболочка - те же приёмы, что
   files/plan-m.html (токены, bottom sheet, --vvh, поллинг, кэш, вход). Единственное отличие
   от демо - здесь position:fixed на весь экран устройства, а не absolute внутри рамки
   телефона, и данные живые (api.yardhub.ru), а не сгенерированные. ── */
:root{
  --bg:#0f0f13; --bg2:#17171d; --bg3:#1e1e26; --bg4:#252530;
  --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
  --text:#e8e6df; --muted:#8b8980;
  --green:#1D9E75; --red:#E24B4A; --amber:#EF9F27; --blue:#378ADD; --purple:#7F77DD;
  --tint-green:#4fd4a3; --tint-amber:#f5be6a; --tint-red:#f07b7a;
  --scrim:rgba(0,0,0,.55);
  --font-ui:'Golos Text',system-ui,-apple-system,Roboto,sans-serif;
  --font-num:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --font-display:'Unbounded',var(--font-ui);
  --ease-out-strong:cubic-bezier(0.16,1,0.3,1);
  --ease-out-soft:cubic-bezier(0.25,1,0.5,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --hdr-row:44px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{color:var(--text);font-family:var(--font-ui);font-size:14px;font-weight:500;line-height:1.35;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;touch-action:manipulation;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:none;border:0}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ── вход ── */
.state{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.state h1{font-size:22px;font-weight:700}
.state p{color:var(--muted);font-size:15px;max-width:320px}

/* ── каркас ── */
.app{display:flex;flex-direction:column;height:100vh;height:var(--vvh,100dvh);padding-top:var(--safe-t);background:var(--bg)}
.hdr{flex:none;background:var(--bg);border-bottom:1px solid var(--border);position:relative;z-index:40}
.hdr-row{display:flex;align-items:center;gap:6px;height:var(--hdr-row);padding:0 8px}
.hbtn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;
  padding:0 10px;font-weight:600;font-size:15px;color:var(--text);white-space:nowrap}
.hbtn:active{background:var(--bg3)}
.hbtn.icon{padding:0;width:40px;min-width:40px}
.grow{flex:1 1 auto;min-width:0}
.hdate{font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.hdate .wd{color:var(--muted);font-weight:500;margin-right:2px}
.hdate svg{width:14px;height:14px;color:var(--muted)}
.today{height:36px;min-width:0;padding:0 12px;border-radius:18px;background:rgba(29,158,117,.13);color:#2fbe93;font-size:13px;font-weight:600}

/* row2: карусель дат «Маяк» - утверждено Владом 19.09 на превью (артефакт
   claude.ai/artifact/CJ29KgstWjQQza63LE9ucs), заменяет фиксированную неделю «Картограф»
   выше (та остаётся каноном для десктопа/логиста-таблицы - здесь только «Задание» с
   телефона). Непрерывная лента, крутится пальцем с инерцией и снапом на день, вместо
   заливки - статичное свечение по центру + текст выбранного дня зеленеет. */
.hdr-row2{padding:6px 8px 8px;gap:6px;height:auto;align-items:stretch}
.carousel-wrap{position:relative;flex:1 1 auto;min-width:0;height:56px;overflow:hidden;touch-action:pan-y}
.carousel-wrap.dragging{cursor:grabbing}
.carousel-wrap .fade-l,.carousel-wrap .fade-r{position:absolute;top:0;bottom:0;width:22px;z-index:5;pointer-events:none}
.carousel-wrap .fade-l{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.carousel-wrap .fade-r{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.beacon-glow{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(29,158,117,.26) 0%,rgba(29,158,117,.09) 55%,transparent 75%)}
.dstrip{position:absolute;top:0;left:50%;height:56px;will-change:transform}
.dchip{position:absolute;top:0;width:52px;height:52px;border-radius:10px;background:var(--bg3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:12px;font-weight:600;color:var(--text);line-height:1.15;user-select:none;z-index:3}
.dchip .cnt{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted);margin-top:1px}
.dchip.weekend{color:var(--tint-red)}
.dchip.weekend .cnt{color:var(--tint-red);opacity:.75}
.dchip.today{box-shadow:inset 0 0 0 1.5px var(--green)}
.dchip.sel{background:var(--bg4);color:#2fbe93}
.dchip.sel .cnt{color:#2fbe93}
.mgrseg{flex:none;display:flex;height:44px;align-self:center;background:var(--bg3);border-radius:8px;padding:2px;gap:2px}
.mgrseg button{padding:0 10px;border-radius:6px;font-size:12px;font-weight:700;color:var(--muted)}
.mgrseg button[aria-pressed="true"]{background:var(--bg4);color:var(--text)}

/* строка-вердикт */
.verdict{flex:none;padding:8px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--bg2)}
.verdict b{color:var(--text);font-weight:700}

/* фильтры логиста (ряд 2) */
.logfilters{flex:none;border-bottom:1px solid var(--border);background:var(--bg2)}
.lf-row{display:flex;align-items:center;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none}
.lf-row::-webkit-scrollbar{display:none}
.fchip{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--bg3);border:1px solid var(--border-strong);font-size:12px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:5px}
.fchip[aria-pressed="true"]{background:rgba(29,158,117,.16);border-color:var(--green);color:#2fbe93}
.fchip .n{font-family:var(--font-num)}
.fchip.warn[aria-pressed="true"]{background:rgba(239,159,39,.16);border-color:var(--amber);color:var(--tint-amber)}
.fchip.new[aria-pressed="true"]{background:rgba(55,138,221,.16);border-color:var(--blue);color:#7fb8ef}
.mgracc{border-top:1px solid var(--border)}
.mgracc>summary{list-style:none;padding:8px 12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.mgracc>summary::-webkit-details-marker{display:none}
.mgracc>summary svg{width:14px;height:14px;transition:transform .15s}
.mgracc[open]>summary svg{transform:rotate(180deg)}
.mgracc .mlist{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.mchip{height:32px;padding:0 10px 0 8px;border-radius:16px;background:var(--bg3);border:1px solid var(--border-strong);font-size:12px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.mchip[aria-pressed="true"]{border-color:var(--border-strong);background:var(--bg4)}
.mchip .dot{width:8px;height:8px;border-radius:50%;flex:none}

/* список карточек */
.body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 10px calc(16px + var(--safe-b))}
.card{background:var(--bg2);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:inset 3px 0 0 var(--muted)}
.card:active{background:var(--bg3)}
.card.st-unconfirmed{box-shadow:inset 3px 0 0 var(--tint-amber)}
.card.st-confirmed{box-shadow:inset 3px 0 0 var(--tint-green)}
.card.st-cancelled{box-shadow:inset 3px 0 0 var(--tint-red)}
.card.st-done{box-shadow:inset 3px 0 0 var(--blue)}
.card.blink{animation:cardblink 1.2s ease-in-out infinite}
@keyframes cardblink{0%,100%{background:var(--bg2)}50%{background:rgba(226,75,74,.14)}}
.c-r1{display:flex;align-items:baseline;gap:7px;margin-bottom:4px}
.c-no{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1}
.c-no.strike{text-decoration:line-through;color:var(--muted)}
.c-time{font-family:var(--font-num);font-size:13px;color:var(--muted)}
.c-cust{flex:1 1 auto;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-st{flex:none;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.c-st.st-unconfirmed{color:var(--tint-amber)}
.c-st.st-confirmed{color:var(--tint-green)}
.c-st.st-cancelled{color:var(--tint-red)}
.c-st.st-done{color:#7fb8ef}
.c-nd{width:6px;height:6px;border-radius:50%;background:var(--tint-amber);animation:blink 1.4s ease-in-out infinite}
.c-r2{display:flex;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:6px;align-items:baseline}
.c-r2 .eq{flex:none;font-weight:600;color:var(--text)}
.c-r2 .route{flex:1 1 auto;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-r2 .route b{color:var(--text);font-weight:700}
.c-r2 .arr{color:var(--muted)}
.c-r3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.c-r3 .gos{font-family:var(--font-num);font-weight:700}
.c-r3 .drv{color:var(--text)}
.c-r3 .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.03em}
.c-r3 .tag.own{background:rgba(29,158,117,.18);color:#2fbe93}
.c-r3 .tag.hired{background:rgba(239,159,39,.18);color:var(--tint-amber)}
.c-r3 .empty{color:var(--muted);font-style:normal}
.c-r3 .sp{flex:1 1 auto}
.c-btn{height:32px;padding:0 12px;border-radius:16px;font-size:12px;font-weight:700}
.c-btn.accept{background:rgba(29,158,117,.18);color:#2fbe93;border:1.5px solid var(--green)}
.c-btn.put{background:none;border:1.5px dashed var(--border-strong);color:var(--text)}
.c-btn.ackoff{background:none;border:1.5px solid var(--red);color:var(--tint-red)}
.c-btn.rm{background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.c-transfer{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.c-transfer b{color:var(--text)}
.c-pend{margin-top:8px;padding:8px 9px;border-radius:8px;background:rgba(239,159,39,.10);font-size:12px;color:var(--tint-amber);line-height:1.4}
.c-pend .btns{display:flex;gap:6px;margin-top:6px}
.c-pend button{height:30px;padding:0 10px;border-radius:14px;font-size:11.5px;font-weight:700}
.c-pend .ok{background:rgba(29,158,117,.2);color:#2fbe93}
.c-pend .no{background:rgba(226,75,74,.2);color:var(--tint-red)}
.empty-day{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.skel-card{height:88px;border-radius:12px;background:var(--bg2);margin-bottom:8px;position:relative;overflow:hidden}
.skel-card::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* сеть/загрузка */
.netbar{display:none;align-items:center;gap:8px;padding:6px 12px;background:rgba(226,75,74,.14);color:var(--tint-red);font-size:12px;font-weight:600;flex:none}
.netbar.on{display:flex}
.loadbar{display:none;align-items:center;justify-content:space-between;gap:10px;min-height:40px;padding:6px 12px;background:var(--bg4);color:var(--muted);font-size:13px;font-weight:600;flex:none}
.loadbar.on{display:flex}
.loadbar.err{color:var(--tint-red)}
.loadbar button{flex:none;min-height:32px;padding:0 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--border-strong);color:var(--text);font-size:13px;font-weight:600}
.loadbar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:8px;animation:blink 1.2s ease-in-out infinite}

/* ── bottom sheet (ВЕРБАТИМ структура plan-m 245-345, fixed вместо absolute) ── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;height:calc(var(--vvh,100vh) * .52);z-index:95;background:var(--bg2);border-radius:12px 12px 0 0;
  transform:translateY(105%);transition:transform .32s var(--ease-drawer),height .28s var(--ease-drawer);display:flex;flex-direction:column;box-shadow:0 -8px 32px rgba(0,0,0,.4)}
.sheet.half{transform:none;height:calc(var(--vvh,100vh) * .52)}
.sheet.full{transform:none;height:calc(var(--vvh,100vh) * .92)}
.sheet .grip{flex:none;height:24px;display:flex;align-items:center;justify-content:center;touch-action:none}
.sheet .grip::before{content:"";width:44px;height:4px;border-radius:2px;background:var(--border-strong)}
.sh-head{flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 8px 12px;min-height:40px;touch-action:none}
.sh-head .cancel{flex:none;font-size:15px;font-weight:600;color:var(--muted)}
.sh-head .ttl{flex:1 1 auto;min-width:0;font-size:18px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-head .ttl small{display:block;font-size:12px;color:var(--muted);font-weight:500;font-family:var(--font-num)}
.sh-body{flex:1 1 auto;min-height:0;overflow:auto;padding:0 14px 14px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh-foot{flex:none;display:flex;gap:8px;padding:10px 12px calc(16px + var(--safe-b));border-top:1px solid var(--border);background:var(--bg2)}
.btn{height:52px;border-radius:10px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.btn:active{transform:scale(.98)}
.btn.primary{flex:1 1 auto;background:var(--green);color:#0f0f13}
.btn.primary:disabled{opacity:.45}
.btn.primary[data-bad="1"]{background:var(--bg3);color:var(--tint-red);border:2px solid var(--red);font-size:14px}
.btn.ghost{background:var(--bg3);border:2px solid var(--border-strong);color:var(--text)}
.btn.danger{background:var(--red);color:#fff}
.btn.wide{flex:1 1 100%}
.f-label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.f-label:first-child{margin-top:6px}
.seg3,.seg4{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:44px;background:var(--bg3);border-radius:8px;padding:2px;gap:2px}
.seg3 button,.seg4 button{border-radius:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg3 button[aria-pressed="true"],.seg4 button[aria-pressed="true"]{background:var(--bg4);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 14px;border-radius:22px;background:var(--bg3);border:1px solid var(--border-strong);font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.chip[aria-pressed="true"]{background:rgba(29,158,117,.16);border-color:var(--green);color:#2fbe93}
.frow{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--border)}
.frow .k{flex:none;width:92px;color:var(--muted);font-size:13px;font-weight:600}
.frow .v{flex:1 1 auto;min-width:0;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .v.ph{color:var(--muted);font-weight:500}
.frow.tap:active{background:var(--bg3);margin:0 -14px;padding-left:14px;padding-right:14px}
.frow input,.frow textarea{width:100%;font-size:16px;font-weight:600;text-align:right}
.frow textarea{text-align:left;resize:none}
.info{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg3);font-size:13px;color:var(--muted);margin-top:10px}
.info.warn{background:rgba(239,159,39,.12);color:var(--amber)}
.info.err{background:rgba(226,75,74,.12);color:var(--tint-red)}
.list-row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600}
.list-row .sub{display:block;font-size:12px;color:var(--muted);font-weight:500}
.list-row .go{margin-left:auto;color:var(--muted)}
.list-row:active{background:var(--bg3)}
.list-row.danger{color:var(--tint-red)}
.list-row.muted{color:var(--muted)}
.badge-new{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(55,138,221,.2);color:#7fb8ef;margin-left:6px}
.sw{display:flex;align-items:center;justify-content:space-between;min-height:52px;border-bottom:1px solid var(--border)}
.sw .knob{width:46px;height:28px;border-radius:14px;background:var(--bg4);position:relative;flex:none;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-pressed="true"] .knob{background:rgba(29,158,117,.4)}
.sw[aria-pressed="true"] .knob::after{transform:translateX(18px);background:var(--tint-green)}
.timebox{display:flex;align-items:center;gap:10px;padding:10px 0}
.timebox button{width:44px;height:44px;border-radius:8px;background:var(--bg3);font-size:18px;font-weight:700}
.timebox .t{flex:1 1 auto;text-align:center;font-family:var(--font-num);font-size:28px;font-weight:700}
.kv{display:grid;grid-template-columns:100px 1fr;gap:4px 10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)}
.kv .k{color:var(--muted)}
.kv .v{color:var(--text);font-weight:600}
.hist-row{padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.hist-row b{color:var(--text)}

/* ── overlay «пикер машины» / «перейти к дню» ── */
.ovl{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s var(--ease-drawer)}
.ovl.on{transform:none}
.ovl-head{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 8px;border-bottom:1px solid var(--border)}
.ovl-head input{flex:1 1 auto;height:38px;background:var(--bg3);border-radius:8px;padding:0 12px;font-size:15px}
.ovl-body{flex:1 1 auto;overflow:auto;padding:8px 14px 14px}
.sect-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.sect-h:first-child{margin-top:6px}
.res{display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid var(--border);border-radius:8px;padding:0 6px}
.res:active{background:var(--bg3)}
.res[aria-pressed="true"]{background:rgba(29,158,117,.14);outline:1.5px solid var(--green)}
.res.dis{opacity:.4;pointer-events:none}
.res .gos{font-family:var(--font-num);font-weight:700;font-size:15px}
.res .meta{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .until{flex:none;font-size:12px;color:var(--muted)}
.res.hire{color:var(--tint-amber)}
.ovl-foot{flex:none;padding:10px 12px calc(16px + var(--safe-b));border-top:1px solid var(--border);background:var(--bg2)}
.jump-row{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--border)}
.jump-row .d{width:70px;font-weight:700}
.jump-row .wd{width:36px;color:var(--muted);font-size:12px}
.jump-row .c{margin-left:auto;font-family:var(--font-num);color:var(--muted);font-size:13px}
.jump-row.today{color:#2fbe93}

/* ── меню-шторка ── */
.navdrawer{position:fixed;inset:0 30% 0 0;z-index:97;background:var(--bg2);transform:translateX(-100%);transition:transform .25s var(--ease-drawer);display:flex;flex-direction:column;box-shadow:2px 0 20px rgba(0,0,0,.4)}
.navdrawer.open{transform:none}
.nd-head{flex:none;height:52px;display:flex;align-items:center;padding:0 14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--border)}
.nd-body{flex:1 1 auto;overflow:auto;padding:6px 8px calc(8px + var(--safe-b))}
.nd-sec{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.nd-item{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px;border-radius:8px;font-size:14px;font-weight:600}
.nd-item:active{background:var(--bg3)}
.nd-item.on{background:rgba(29,158,117,.14);color:#2fbe93}
.nd-item svg{width:18px;height:18px;color:var(--muted)}
.nd-item.on svg{color:#2fbe93}

/* ── тост ── */
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + var(--safe-b));z-index:106;background:var(--bg4);border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(140%);transition:transform .25s var(--ease-out-strong);font-size:14px;font-weight:600}
.toast.on{transform:none}
.toast .sub{color:var(--muted);font-weight:500}
.toast .act{flex:none;color:#7fb8ef;font-weight:700}
.toast.err{background:rgba(226,75,74,.9);color:#fff}
</style>

function rebuildRoster_(list){
  ROSTER = list || [];
  MANAGERS = ROSTER.filter(function(p){ return p.role==='manager'; }).map(function(p){ return p.name; });
  LOGISTS = ROSTER.filter(function(p){ return p.role==='logist' || p.role==='admin'; }).map(function(p){ return p.name; });
  PERSON_COLOR = {};
  ROSTER.forEach(function(p,i){ PERSON_COLOR[p.name]=PALETTE[i%PALETTE.length]; });
}
function findOrder(id){ id=+id; for(var i=0;i<ORDERS.length;i++) if(ORDERS[i].id===id) return ORDERS[i]; return null; }
function replaceOrder(raw){
  var n = normalizeOrder(raw);
  var i = ORDERS.findIndex(function(x){ return x.id===n.id; });
  if(i>=0) ORDERS[i]=n; else if(n.service_date===iso(SELECTED_DATE)) ORDERS.push(n);
  return n;
}

/* Адрес хранится одной строкой ("Михнево, ул. Промышленная, 4") - первый сегмент до запятой
   считаем городом/нас.пунктом, остальное - уточнением. Упрощение относительно десктопного
   addrParts_ (парсинг ссылок Яндекс.Карт, регэксп городских префиксов) - сознательно не
   перенесено в v1 (см. заметки превью, открытый вопрос про значок «Я»). Текст менеджера
   НЕ переписывается - это только разбивка для отображения. */
function splitAddr(addr){
  if(!addr) return ['',''];
  var i = String(addr).indexOf(',');
  if(i<0) return [addr.trim(), ''];
  return [addr.slice(0,i).trim(), addr.slice(i+1).trim()];
}
function normalizeOrder(o){
  var execs = o.executors||[];
  var main = execs.filter(function(e){return e.role==='main';})[0]||null;
  var reserve = execs.filter(function(e){return e.role==='reserve';})[0]||null;
  var vehicle = main ? { gos:main.vehicle_gos, driver:main.driver_name, own:main.kind==='own', company:main.carrier_name, confirmed:!!main.driver_confirmed_at, executor_id:main.id } : null;
  var pend = (o.pending_request && o.pending_request.status==='pending') ? o.pending_request : null;
  var createdMs = o.created_at ? new Date(o.created_at).getTime() : 0;
  return Object.assign({}, o, {
    from: splitAddr(o.load_address), to: splitAddr(o.unload_address),
    manager: o.manager_name || (o.internal ? 'внутр.' : '—'),
    taken_by: o.taken_by_name,
    vehicle: vehicle, _executors: execs, nd_main: main, nd_reserve: reserve,
    cancel_ack: o.status==='cancelled' ? !!o.otboy_ack_by : true,
    pending: pend ? { id:pend.id, type:pend.type, from_gos:pend.from_gos, to_gos:pend.to_gos, to_driver:pend.to_driver_name,
      from_carrier_name:pend.from_carrier_name, to_carrier_name:pend.to_carrier_name } : null,
    created_new: !execs.length && o.status!=='cancelled' && o.status!=='done' && createdMs && (Date.now()-createdMs) < 10*60*1000,
    transferred_to: o.transferred_to ? fmtDate(fromIso(o.transferred_to.service_date)) : null,
    transferred_to_no: o.transferred_to ? o.transferred_to.day_no : null,
    transferred_from: o.transferred_from ? fmtDate(fromIso(o.transferred_from.service_date)) : null,
    transferred_from_no: o.transferred_from ? o.transferred_from.day_no : null,
    weight: o.cargo_weight_t, rework: o.rework_terms||'—', gabarit: o.gabarit||'Габарит',
    documents: o.documents||'', cargo_dims: o.cargo_dims||'', note: o.note||'',
    payment_status: o.payment_status||'Безнал', cash: !!o.cash
  });
}

function loadMeta(){
  if(META) return Promise.resolve(META);
  return apiGet_('/orders/meta').then(function(r){
    if(!r.ok) return null;
    META = r.data; return META;
  });
}
function loadCounts(){
  // Окно = всё, что построено в карусели (DC_BACK/DC_FWD) - один запрос покрывает и
  // «Перейти к дню» (28 дней, подмножество), и саму ленту целиком.
  var from=iso(addDays(TODAY,-DC_BACK)), to=iso(addDays(TODAY,DC_FWD));
  return apiGet_('/orders/counts', {from:from, to:to}).then(function(r){
    if(!r.ok) return;
    COUNTS={}; (r.data.counts||[]).forEach(function(c){ COUNTS[c.date]=c; });
    renderCarouselCounts();
  });
}
function loadOrders(){
  return apiGet_('/orders', {date:iso(SELECTED_DATE)}).then(function(r){
    if(!r.ok) throw new Error((r.data&&r.data.error) || ('Сервер: '+r.status));
    ORDERS = (r.data.orders||[]).map(normalizeOrder);
    if(r.data.me){ ME = r.data.me; try{ if(ME.name) localStorage.setItem('user_name', ME.name); if(ME.role) localStorage.setItem('user_role', ME.role); }catch(e){} }
    rebuildRoster_(r.data.roster);
    applyRole_();
    render();
  });
}

   4. Роль (admin переключает вручную, как #op2-switch на десктопе; менеджер/логист - фиксирована сессией)
   ══════════════════════════════════════════════════════════════════════════ */
function applyRole_(){
  // Экран выбирается ролью сессии, без ручного переключателя (Влад 19.09: «давай лучше
  // просматривать экран, исходя из роли... неважно видеть тот же интерфейс, который видят
  // сотрудники»). У admin своей роли заявок нет - по умолчанию видит экран менеджера.
  // Роль вьювера ("Смотреть как") - через effectiveIdentity_(), не напрямую ME.role
  // (19.09, тот же фикс, что и в меню - иначе admin в вьювере логиста видел бы экран
  // менеджера, а не логиста).
  var eff = effectiveIdentity_();
  if(eff.role==='logist') ROLE='log';
  else ROLE='mgr';
  // «Мои/Все» - у настоящего менеджера ИЛИ у вьювера "как менеджер" (последний должен вести
  // себя ТОЧНО как реальный менеджер - Влад: "имитировать именно роль этого сотрудника").
  $('mgrSeg').hidden = eff.role!=='manager';
  // Реальный admin БЕЗ вьювера - показываем ВСЕ заявки всегда, иначе список пуст (ни одна
  // заявка не создана от его email). В вьювере - НЕ трогаем MGR_ALL здесь (иначе каждый
  // loadOrders() при смене дня сбрасывал бы ручной тумблер «Мои/Все» обратно) - тумблер
  // ведёт себя как у настоящего менеджера, стартуя с дефолта MGR_ALL=false («Мои»).
  if(ME.role==='admin' && !eff.viewingAs) MGR_ALL=true;
}

function fmtHeaderDate(d){

  return '<span class="wd">'+wd+',</span>'+fmtDate(d)+' <svg><use href="#i-chev"/></svg>';
}

/* ---- карусель дат «Маяк» (утверждено 19.09, превью CJ29KgstWjQQza63LE9ucs) ----
   Непрерывная лента вместо 7 фиксированных чипов - крутится пальцем с инерцией, снап на
   ближайший день, щелчок «Стекло» (высокий тихий тик) на каждый пройденный день. Окно дат
   строится ОДИН раз при загрузке (шире, чем нужно для повседневной работы, чтобы обычный
   свайп никогда не упирался в край) - «Перейти к дню» (шапка, кнопка даты) по-прежнему
   рядом для мгновенного прыжка на любую дату, карусель для навигации день-в-день. */
var DC_BACK = 21, DC_FWD = 45;       // окно дат: TODAY-21 .. TODAY+45
var DC_CHIP_W = 52, DC_GAP = 10, DC_STEP = DC_CHIP_W + DC_GAP;
var DAYS = [];                        // [{date, iso, wd, weekend, isToday}]
var dcChipEls = [];
var dcIdx = 0;                        // непрерывный индекс (дробный во время жеста)
var dcLastTicked = 0;
var dcDragging=false, dcStartX=0, dcStartIdx=0, dcLastX=0, dcLastT=0, dcVel=0, dcRaf=null;
var AC_ = null;
function dcBlip(f1,f2,dur,vol){
  try{
    AC_ = AC_ || new (window.AudioContext||window.webkitAudioContext)();
    var o=AC_.createOscillator(), g=AC_.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f1, AC_.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, AC_.currentTime+dur);
    g.gain.setValueAtTime(vol, AC_.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC_.currentTime+dur);
    o.connect(g); g.connect(AC_.destination); o.start(); o.stop(AC_.currentTime+dur);
  }catch(e){}
}
function dcTickFwd(){ dcBlip(720,760,.035,.02); }
function dcTickBwd(){ dcBlip(760,720,.035,.02); }

function buildDateCarousel(){
  DAYS = [];
  for(var i=-DC_BACK;i<=DC_FWD;i++){
    var d=addDays(TODAY,i);
    DAYS.push({ date:d, iso:iso(d), wd:WD[(d.getDay()+6)%7], weekend:(d.getDay()===0||d.getDay()===6), isToday:i===0 });
  }
  var strip=$('dcStrip');
  strip.innerHTML=''; dcChipEls=[];
  DAYS.forEach(function(day,i){
    var el=document.createElement('div');
    el.className='dchip'+(day.weekend?' weekend':'')+(day.isToday?' today':'');
    el.style.left=(i*DC_STEP)+'px';
    el.innerHTML=day.wd+' '+day.date.getDate()+'<span class="cnt">—</span>';
    el.addEventListener('click', function(){ dcTravelTo(i); });
    strip.appendChild(el);
    dcChipEls.push(el);
  });
  strip.style.width=(DAYS.length*DC_STEP-DC_GAP)+'px';
  var startOffset = Math.round((SELECTED_DATE-TODAY)/86400000);
  dcIdx = Math.max(0, Math.min(DAYS.length-1, startOffset+DC_BACK));
  dcLastTicked = Math.round(dcIdx);
  dcApplyTransform();
  dcOnSettled(DAYS[Math.round(dcIdx)]);
  var wrap=$('dcWrap');
  wrap.addEventListener('pointerdown', dcOnDown);
  wrap.addEventListener('pointermove', dcOnMove);
  wrap.addEventListener('pointerup', dcOnUp);
  wrap.addEventListener('pointercancel', dcOnUp);
}
function renderCarouselCounts(){
  dcChipEls.forEach(function(el,i){
    var c=COUNTS[DAYS[i].iso];
    var cnt=el.querySelector('.cnt'); if(cnt) cnt.textContent = c?c.total:'—';
  });
}
function dcApplyTransform(){
  var centerFromOrigin = dcIdx*DC_STEP + DC_CHIP_W/2;
  $('dcStrip').style.transform = 'translateX(' + (-centerFromOrigin) + 'px)';
  dcChipEls.forEach(function(el,i){
    var dist = Math.abs(i-dcIdx);
    el.style.transform = 'scale(' + Math.max(0.66,1-dist*0.12) + ')';
    el.style.opacity = Math.max(0.32,1-dist*0.26);
  });
}
function dcOnSettled(day){
  dcChipEls.forEach(function(el,i){ el.classList.toggle('sel', i===Math.round(dcIdx)); });
  SELECTED_DATE = day.date;
  $('btnDate').innerHTML = fmtHeaderDate(SELECTED_DATE);
  $('btnToday').hidden = day.isToday;
  startLoad_();
}
function dcMaybeTick(){
  var nearest=Math.round(dcIdx);
  if(nearest===dcLastTicked) return;
  var dir = nearest>dcLastTicked?1:-1, steps=Math.abs(nearest-dcLastTicked);
  for(var s=1;s<=steps;s++){ (function(s){ setTimeout(function(){ (dir>0?dcTickFwd:dcTickBwd)(); }, (s-1)*16); })(s); }
  vib(4);
  dcLastTicked=nearest;
}
function dcOnDown(e){
  dcDragging=true; $('dcWrap').classList.add('dragging');
  cancelAnimationFrame(dcRaf);
  dcStartX=e.clientX; dcLastX=e.clientX; dcLastT=performance.now();
  dcStartIdx=dcIdx; dcVel=0;
  try{ $('dcWrap').setPointerCapture(e.pointerId); }catch(err){}
}
function dcOnMove(e){
  if(!dcDragging) return;
  var now=performance.now();
  var dt=Math.max(8, now-dcLastT);
  var instVel=Math.max(-2.2,Math.min(2.2,(e.clientX-dcLastX)/dt));
  dcVel = 0.7*dcVel + 0.3*instVel;
  dcLastX=e.clientX; dcLastT=now;
  dcIdx = Math.max(0, Math.min(DAYS.length-1, dcStartIdx - (e.clientX-dcStartX)/DC_STEP));
  dcApplyTransform(); dcMaybeTick();
}
function dcOnUp(){
  if(!dcDragging) return;
  dcDragging=false; $('dcWrap').classList.remove('dragging');
  dcInertia(-(dcVel*16)/DC_STEP);
}
function dcInertia(v){
  function step(){
    v*=0.93; dcIdx=Math.max(0,Math.min(DAYS.length-1, dcIdx+v));
    dcApplyTransform(); dcMaybeTick();
    if(Math.abs(v)>0.001 && dcIdx>0 && dcIdx<DAYS.length-1) dcRaf=requestAnimationFrame(step);
    else dcSnap();
  }
  if(Math.abs(v)<0.02){ dcSnap(); return; }
  dcRaf=requestAnimationFrame(step);
}
function dcSnap(){
  var target=Math.max(0,Math.min(DAYS.length-1,Math.round(dcIdx)));
  dcTravelTo(target);
}
function dcTravelTo(target){
  var from=dcIdx, start=performance.now(), dur=(Math.abs(target-from)<1.2)?180:260;
  cancelAnimationFrame(dcRaf);
  function step(){
    var t=Math.min(1,(performance.now()-start)/dur);
    dcIdx = from + (target-from)*(1-Math.pow(1-t,3));
    dcApplyTransform(); dcMaybeTick();
    if(t<1) dcRaf=requestAnimationFrame(step);
    else { dcIdx=target; dcApplyTransform(); dcOnSettled(DAYS[target]); }
  }
  dcRaf=requestAnimationFrame(step);
}
/* Переход на конкретную дату извне (сегодня, «Перейти к дню», после сохранения/переноса
   заявки) - если дата вне построенного окна (редкий перенос далеко вперёд), карусель просто
   останавливается у ближайшего края, но SELECTED_DATE и список заявок - настоящие. */
function goToDate(d){
  var offset = Math.round((d-TODAY)/86400000);
  var target = Math.max(0, Math.min(DAYS.length-1, offset+DC_BACK));
  dcTravelTo(target);
}

function visibleOrders(){
  var list = ORDERS.slice();
  if(ROLE==='mgr'){
    // Сравнение по имени, не по email (19.09) - у ME всегда РЕАЛЬНАЯ почта admin'а, даже
    // во вьювере "как Савиток"; заявки несут имя менеджера (o.manager), не email, из
    // которого можно узнать email вьювера - имя надёжнее и уже есть в данных.
    if(!MGR_ALL) list = list.filter(function(o){ return o.manager===effectiveIdentity_().name; });
    if(SEARCH_Q) list = list.filter(function(o){ return (o.customer||'').toLowerCase().indexOf(SEARCH_Q.toLowerCase())>=0; });
  } else {
    if(LOG_TYPE_FILTER!=='all') list = list.filter(function(o){ return o.equipment_type===LOG_TYPE_FILTER; });
    var mgrKeys=Object.keys(LOG_MGR_FILTER).filter(function(k){return LOG_MGR_FILTER[k];});
    if(mgrKeys.length) list = list.filter(function(o){ return LOG_MGR_FILTER[o.manager]; });
    if(LOG_STAT_FILTER==='nocar') list = list.filter(function(o){ return !o.vehicle && o.status!=='cancelled' && o.status!=='done'; });
    if(LOG_STAT_FILTER==='nd') list = list.filter(function(o){ return o.needs_data; });
    if(LOG_STAT_FILTER==='new') list = list.filter(function(o){ return o.created_new; });
    if(SEARCH_Q) list = list.filter(function(o){ return (o.customer||'').toLowerCase().indexOf(SEARCH_Q.toLowerCase())>=0; });
  }
  list.sort(function(a,b){ return (a.day_no||0)-(b.day_no||0); });
  return list;
}

function vehLineHtml(o){
  if(o.status==='cancelled'){
    if(!o.cancel_ack){
      var g = o.vehicle ? o.vehicle.gos : '—';
      return '<span class="gos strike">'+esc(g)+'</span><span class="empty">отбой не принят</span>'+(ROLE==='log'?'<span class="sp"></span><button class="c-btn ackoff" data-act="ack" data-id="'+o.id+'">✕ Принять отбой</button>':'');
    }
    var g2 = o.vehicle ? o.vehicle.gos : '—';
    return '<span class="gos strike">'+esc(g2)+'</span><span class="empty">отбой принят</span>'+(o.vehicle && ROLE==='log' ? '<span class="sp"></span><button class="c-btn rm" data-act="rm" data-id="'+o.id+'">Снять</button>' : '');
  }
  if(!o.vehicle){
    if(ROLE==='log'){
      if(!o.taken_by){

    html += '<span class="sp"></span><button class="c-btn rm" data-act="rm" data-id="'+o.id+'">Снять</button>';
  }
  return html;
}

(function initSheetSwipe_(){
  var startY=null, startState=null;
  function onStart(e){ if(sheetState==='closed') return; startY=(e.touches?e.touches[0]:e).clientY; startState=sheetState; }
  function onEnd(e){
    if(startY==null) return;
    var endY=(e.changedTouches?e.changedTouches[0]:e).clientY; var dy=endY-startY; startY=null;
    if(dy>60){ if(startState==='full') setDetent('half'); else closeSheet(); }
    else if(dy<-40 && startState==='half') setDetent('full');
  }
  ['grip','shHead'].forEach(function(id){
    var el=$(id);
    el.addEventListener('touchstart', onStart, {passive:true});
    el.addEventListener('touchend', onEnd);
  });
})();

    vib([8,40,8]);
    if(btn){ var orig=btn.innerHTML; btn.innerHTML=doneLabel||'Скопировано ✓'; setTimeout(function(){ btn.innerHTML=orig; }, 1800); }

  function currentReasonAndBtn(){
    var MIN=25000;
    if(!draft.customer){ return {t:'Укажи заказчика', bad:false, dis:true}; }
    if(!draft.equipment_type){ return {t:'Выбери тип техники', bad:false, dis:true}; }
    if(!editing && !draft.price){ return {t:'Укажи цену', bad:false, dis:true}; }
    var seg = /трал/i.test(draft.equipment_type||'') ? 'трал' : (/длинномер/i.test(draft.equipment_type||'')?'длинномер':null);

      cash:draft.cash?1:0, note:draft.note||'', needs_data:draft.needs_data?1:0
    };
    if(draft.customer_entity_id){ payload.customer_entity_id=draft.customer_entity_id; payload.internal=1; }
    if(editing){ payload.id=o.id; }
    else { payload.service_date=draft.service_date; }
    apiPost_('/orders/save', payload).then(function(r){

      var savedDate = fromIso(payload.service_date || o.service_date);
      closeSheet(); goToDate(savedDate);
    });
  });
}

function openVehiclePicker(o){
  ovlState='vehicle'; ovlData={order:o, chosen:null, vehicles:null};
  var ovl=$('ovl');
  ovl.classList.add('on');
  ovl.innerHTML = '<div class="ovl-head"><button class="hbtn icon" id="ovlBack"><svg><use href="#i-close"/></svg></button><div style="padding:0 4px;color:var(--muted)">Загрузка…</div></div><div class="ovl-body"></div>';
  $('ovlBack').addEventListener('click', function(){ closeOvl(); });
  if(hist.depth<1) histPush();
  apiGet_('/orders/vehicles', {date:o.service_date, time:o.service_time||''}).then(function(r){
    if(!r.ok){ toast('Не удалось загрузить парк', null, null, null, {err:true}); closeOvl(); return; }
    ovlData.vehicles = r.data.vehicles||[];
    renderOvl();
  });
}
function closeOvl(fromHist){
  if(!ovlState) return;
  $('ovl').classList.remove('on');
  ovlState=null; ovlData=null;
  if(!fromHist) histPop();
}
function renderOvl(){
  var ovl=$('ovl');
  if(ovlState==='datejump') return renderDateJumpOvl(ovl);
  var o=ovlData.order;
  var wantSeg = /длинномер|борт/i.test(o.equipment_type||'') ? 'bort' : 'tral';
  var vehicles = ovlData.vehicles||[];
  var freeType = vehicles.filter(function(v){ return v.state==='free' && v.seg===wantSeg; });
  var freeOther = vehicles.filter(function(v){ return v.state==='free' && v.seg!==wantSeg; });
  var busy = vehicles.filter(function(v){ return v.state==='busy'; });
  var nodriver = vehicles.filter(function(v){ return v.state==='nodriver'; });
  var repair = vehicles.filter(function(v){ return v.state==='repair'; });
  var needsData = o.needs_data && o.nd_main;

  var html = '<div class="ovl-head"><button class="hbtn icon" id="ovlBack"><svg><use href="#i-close"/></svg></button><input id="ovlSearch" placeholder="3 цифры номера или фамилия"></div>';
  html += '<div class="ovl-body" id="ovlBodyIn">';
  if(needsData){
    html += '<div class="sect-h">Заявленные · данные у заказчика</div>';
    [o.nd_main,o.nd_reserve].filter(Boolean).forEach(function(e,i){
      html += resRow(e.vehicle_gos, (i===0?'основная · ':'резерв · ')+(e.driver_name||'—'), '', false, e.vehicle_gos);
    });
  }
  if(o.vehicle){
    html += '<div class="sect-h">Уже стоит</div>' + resRow(o.vehicle.gos, o.vehicle.driver||'—', 'снять', false, '__remove__');
  }
  html += '<div class="sect-h">Свободны сейчас</div>';
  if(!freeType.length) html += '<div class="info">Нет свободных этого типа</div>';
  freeType.forEach(function(v){ html += resRow(v.gos, v.type+' · '+(v.driver||'—'), '', false, v.gos); });
  if(freeOther.length){ html += '<div class="sect-h">Свободны (другой тип)</div>'; freeOther.forEach(function(v){ html += resRow(v.gos, v.type+' · '+(v.driver||'—'), '', false, v.gos); }); }
  html += '<div class="sect-h">Заняты в это время (доступны)</div>';
  if(!busy.length) html += '<div class="info">Занятых нет</div>';
  busy.forEach(function(v){ html += resRow(v.gos, (v.busy||'')+' · '+(v.driver||'—'), 'занята', false, v.gos, true); });
  html += '<div class="sect-h">Без водителя</div>';
  nodriver.forEach(function(v){ html += resRow(v.gos, v.type, '', true, v.gos); });
  html += '<div class="sect-h">Ремонт, ТО</div>';
  repair.forEach(function(v){ html += resRow(v.gos, v.type+' · '+(v.busy||''), '', true, v.gos); });
  html += '<div class="sect-h">&nbsp;</div><div class="res hire" id="ovlHire"><svg><use href="#i-arr-r"/></svg><div class="meta">Наёмник →</div></div>';
  html += '</div><div class="ovl-foot"><button class="btn primary wide" id="ovlPut" disabled>Выберите машину</button></div>';
  ovl.innerHTML = html;

  $('ovlBack').addEventListener('click', function(){ closeOvl(); });
  $('ovlHire').addEventListener('click', function(){ closeOvl(true); openSheet('hired', o, 'full'); });
  var ovlSearch=$('ovlSearch');
  ovlSearch.addEventListener('input', function(){
    var q=ovlSearch.value.trim().toLowerCase();
    ovl.querySelectorAll('.res[data-gos]').forEach(function(row){
      if(!q){ row.hidden=false; return; }
      var txt=row.textContent.toLowerCase();
      row.hidden = txt.indexOf(q)<0;
    });
  });
  ovl.querySelectorAll('.res[data-gos]').forEach(function(row){
    if(row.classList.contains('dis')) return;
    row.addEventListener('click', function(){
      ovl.querySelectorAll('.res').forEach(function(r){ r.removeAttribute('aria-pressed'); });
      row.setAttribute('aria-pressed','true'); vib(6);
      ovlData.chosen = row.getAttribute('data-gos');
      var btn=$('ovlPut');
      if(ovlData.chosen==='__remove__'){ btn.textContent='Снять '+o.vehicle.gos; }
      else { btn.textContent = (o.vehicle ? 'Заменить на ' : 'Поставить ') + ovlData.chosen + (o.service_time?(' на '+o.service_time):''); }
      btn.disabled=false;
    });
  });
  $('ovlPut').addEventListener('click', function(){
    if(!ovlData.chosen) return;
    var btn=$('ovlPut'); btn.disabled=true;
    if(ovlData.chosen==='__remove__'){
      if(!o.vehicle || !o.vehicle.executor_id){ closeOvl(); return; }
      apiPost_('/orders/executor_remove', {executor_id:o.vehicle.executor_id}).then(function(r){
        if(!r.ok){ btn.disabled=false; return apiErrToast_(r); }
        replaceOrder(r.data.order); vib(30); toast('Машина снята'); closeOvl(); render();
      });
      return;
    }
    apiPost_('/orders/executor_set', {order_id:o.id, gos:ovlData.chosen, mode:'replace'}).then(function(r){
      if(!r.ok){ btn.disabled=false; return apiErrToast_(r); }
      var upd = replaceOrder(r.data.order);
      vib([8,40,8]);
      if(r.data.pending) toast('Замена ждёт менеджера','данные на пропуск изменятся');
      else if(r.data.swapped) toast('Основная теперь '+ovlData.chosen);
      else toast('Поставлено '+ovlData.chosen, o.service_time?('на '+o.service_time):'');
      closeOvl(); render();
    });
  });
}
function resRow(gos, meta, until, disabled, dataGos, warn){
  return '<div class="res'+(disabled?' dis':'')+'"'+(disabled?'':(' data-gos="'+esc(dataGos)+'"'))+'>' +
    '<span class="gos">'+esc(gos)+'</span><span class="meta">'+esc(meta)+'</span>' + (until?'<span class="until'+(warn?'" style="color:var(--tint-amber)':'')+'">'+esc(until)+'</span>':'') + '</div>';
}

/* ---- «Перейти к дню» (28 дней) - счётчики подтягиваем от текущего COUNTS (та же неделя),
   для остальных дней - без числа (лениво не догружаем весь месяц ради этого листа) ---- */
function openOvl(kind){ ovlState=kind; ovlData={}; $('ovl').classList.add('on'); renderOvl(); if(hist.depth<1) histPush(); }
function renderDateJumpOvl(ovl){
  var html = '<div class="ovl-head"><button class="hbtn icon" id="ovlBack"><svg><use href="#i-close"/></svg></button><div style="font-weight:700;padding:0 4px">Перейти к дню</div></div><div class="ovl-body">';
  for(var i=0;i<28;i++){
    var d=addDays(TODAY,i-3);
    var c=COUNTS[iso(d)];
    html += '<div class="jump-row'+(isSameDay(d,TODAY)?' today':'')+'" data-i="'+i+'"><span class="d">'+fmtDate(d)+'</span><span class="wd">'+WD[(d.getDay()+6)%7]+'</span><span class="c mono">'+(c?c.total:'—')+'</span></div>';
  }
  html += '</div>';
  ovl.innerHTML = html;
  $('ovlBack').addEventListener('click', function(){ closeOvl(); });
  ovl.querySelectorAll('.jump-row').forEach(function(row){
    row.addEventListener('click', function(){
      var i=+row.getAttribute('data-i'); var d=addDays(TODAY,i-3);
      vib(4); closeOvl(); goToDate(d);
    });
  });
}

/* Тот же список/иконки/роль-фильтр, что в plan-m.html PAGES_/navAllowedPages_ (19.09,

var PAGES_ = [
  {page:"main", label:"Панель", icon:"i-pg-main"},

  {page:"vehicles", label:"Техника", icon:"i-pg-vehicles", section:"Парк"},
  {page:"logistics-plan", label:"Планировка", icon:"i-pg-logistics-plan", section:"Парк"},
  {page:"dynamics", label:"Динамика", icon:"i-pg-dynamics", section:"Парк"},
  {page:"navigation", label:"Навигация", icon:"i-pg-navigation", section:"Парк"},
  {page:"crm", label:"CRM", icon:"i-pg-crm", section:"Продажи"},
  {page:"counterparty", label:"Проверка контрагента", icon:"i-pg-counterparty", section:"Продажи"},
  {page:"dept-trals", label:"Отдел Тралы", icon:"i-pg-people", section:"Продажи"},
  {page:"receipts", label:"Поступления", icon:"i-pg-receipts", section:"Продажи"},
  {page:"sales", label:"Обзор заказов", icon:"i-pg-sales", section:"Продажи"},
  {page:"sales-mgr", label:"По менеджерам", icon:"i-pg-people", section:"Продажи"},
  {page:"sales-log", label:"По логистам", icon:"i-pg-sales-log", section:"Продажи"},
  {page:"sales-salary", label:"Зарплата", icon:"i-pg-salary", section:"Продажи"},
  {page:"my-page", label:"Личная страница", icon:"i-pg-my-page", section:"Продажи"},
  {page:"order-plan", label:"Задание", icon:"i-pg-order-plan", section:"Продажи"},
  {page:"calculator", label:"Калькулятор", icon:"i-pg-calculator", section:"Продажи"},
  {page:"ryschanow-salary", label:"Зарплата", icon:"i-pg-salary", section:"Продажи"},
  {page:"commercial-head-salary", label:"Зарплата", icon:"i-pg-salary", section:"Продажи"},
  {page:"commercial-head-debt", label:"Дебиторка", icon:"i-pg-debt", section:"Продажи"},
  {page:"column-head-payroll", label:"Зарплата машинистов", icon:"i-pg-column-payroll", section:"Продажи"},

  {page:"debt", label:"Дебиторка", icon:"i-pg-debt", section:"Продажи"}
];
var NAV_COLUMN_HEAD_SUR_ = ["барыльченко", "дьячков"];
var NAV_COMMERCIAL_HEAD_SUR_ = ["ахтамова", "гусейнова"];
// Кого сейчас реально показываем - настоящую сессию (ME) или того, кого admin выбрал через
// "Смотреть как сотрудник" в index.html (19.09, Влад: "если я захожу во вьювер, то я
// полностью, как будто бы, нахожусь в этой роли"). index.html пишет выбор в localStorage
// (см. setViewAs()) - здесь читаем СВЕЖИМ каждый раз, не кэшируем, admin мог переключить
// вьювер в другой вкладке.
function effectiveIdentity_(){
  if (ME.role === 'admin') {
    try {
      var va = JSON.parse(localStorage.getItem('view_as') || 'null');
      if (va && va.name && va.type) return {name: va.name, role: va.type, viewingAs: true};
    } catch(e){}
  }
  return {name: ME.name, role: ME.role, viewingAs: false};
}
function navAllowedPages_(){
  var eff = effectiveIdentity_();
  if (eff.role === 'admin'){
    // Персональные пункты (Зарплата Рыщанова/руководителей коммерческих групп/начальника
    // автоколонны) - только при вьювере ИЛИ в собственном логине этих людей, не в обычной
    // админ-панели, см. applyRoleUI() в index.html (personalOnlyPages).
    var personalOnly = ['ryschanow-salary', 'commercial-head-salary', 'commercial-head-debt', 'column-head-payroll'];
    return PAGES_.map(function(p){ return p.page; }).filter(function(id){ return personalOnly.indexOf(id) < 0; });
  }
  var sur = (eff.name||"").trim().split(/\s+/)[0].toLowerCase();
  var isRyschanow = sur === "сильчев" || sur === "рыщанов";
  var isCommercialHead = NAV_COMMERCIAL_HEAD_SUR_.indexOf(sur) >= 0;
  var isColumnHead = NAV_COLUMN_HEAD_SUR_.indexOf(sur) >= 0;
  var allowed = ["my-page", "calculator", "logistics-plan"];
  if (!isColumnHead) allowed.push("order-plan");
  if (isRyschanow) allowed.push("ryschanow-salary");
  if (isCommercialHead) allowed.push("commercial-head-salary", "commercial-head-debt");
  if (isColumnHead) allowed.push("column-head-payroll");
  if (eff.role === "manager") allowed.push("crm", "counterparty", "dept-trals");
  return allowed;
}
function openDrawer(){
  navdrawerOpen_=true;
  var d=$('navdrawer');
  var eff = effectiveIdentity_();
  var allowed = navAllowedPages_();
  var sectioned = allowed.length > 8, lastSection = null;
  var html='<div class="nd-head">'+esc(eff.name||'TS HUB')+'</div><div class="nd-body">';
  if (eff.viewingAs) {
    html += '<div class="nd-item" data-nav="__exit-viewas" style="color:var(--red,#e24b4a)">✕ Обычный вид (админ)</div>';
  }
  PAGES_.forEach(function(p){
    if(allowed.indexOf(p.page)<0) return;
    if (sectioned && p.section && p.section !== lastSection){ lastSection = p.section; html += '<div class="nd-sec">'+esc(p.section)+'</div>'; }
    html+='<div class="nd-item'+(p.page==='order-plan'?' on':'')+'" data-nav="'+p.page+'"><svg><use href="#'+p.icon+'"/></svg><span>'+esc(p.label)+'</span></div>';
  });
  html+='<div class="nd-sec">Общее</div><div class="nd-item" data-nav="settings"><svg><use href="#i-settings"/></svg><span>Настройки</span></div>';
  html+='</div>';
  d.innerHTML=html;
  d.classList.add('open');
  $('scrim').classList.add('on');
  d.querySelectorAll('[data-nav]').forEach(function(el){
    el.addEventListener('click', function(){
      var id=el.getAttribute('data-nav');
      if(id==='order-plan'){ closeDrawer(); return; }
      if(id==='settings'){ closeDrawer(); openSheet('settings', {}, 'full'); return; }
      if(id==='__exit-viewas'){ try{ localStorage.removeItem('view_as'); }catch(e){} location.href = 'index.html'; return; }
      location.href = 'index.html#page=' + id;
    });
  });
  if(hist.depth<1) histPush();
}
function closeDrawer(fromHist){
  if(!navdrawerOpen_) return;
  navdrawerOpen_=false;
  $('navdrawer').classList.remove('open');
  $('scrim').classList.remove('on');
  if(!fromHist) histPop();
}

/* ══════════════════════════════════════════════════════════════════════════
   12. История (Back закрывает лист/оверлей, не страницу) - plan-m 1295-1301, ВЕРБАТИМ
   ══════════════════════════════════════════════════════════════════════════ */
function histPush(){ if(hist.ignore>0){ hist.pendingPush=true; return; } try{ history.pushState({d:hist.depth+1},''); }catch(e){} hist.depth++; }
function histPop(){ if(hist.depth>0){ hist.depth--; hist.ignore++; try{ history.back(); }catch(e){} } }
window.addEventListener('popstate', function(){
  if(hist.ignore>0){ hist.ignore--; if(hist.pendingPush){ hist.pendingPush=false; if(sheetState!=='closed'||ovlState||navdrawerOpen_){ try{history.pushState({d:hist.depth+1},'');}catch(e){} hist.depth++; } } return; }
  hist.depth=Math.max(0,hist.depth-1);
  if(navdrawerOpen_) closeDrawer(true); else if(ovlState) closeOvl(true); else if(sheetState!=='closed') closeSheet(true);
});

/* ══════════════════════════════════════════════════════════════════════════
   13. Тост
   ══════════════════════════════════════════════════════════════════════════ */
var toastTimer=null;
function toast(text, sub, actionLabel, onAction, opts){
  opts=opts||{};
  var t=$('toast');
  t.className='toast'+(opts.err?' err':'');
  t.innerHTML = '<span>'+esc(text)+'</span>'+(sub?('<span class="sub">'+esc(sub)+'</span>'):'')+(actionLabel?('<span class="act" id="toastAct">'+esc(actionLabel)+'</span>'):'');
  t.classList.add('on');
  clearTimeout(toastTimer);
  var ms = actionLabel ? 6000 : 2600;
  toastTimer=setTimeout(function(){ t.classList.remove('on'); }, ms);
  var act=$('toastAct');
  if(act) act.addEventListener('click', function(){ t.classList.remove('on'); clearTimeout(toastTimer); if(onAction) onAction(); });
}

/* ══════════════════════════════════════════════════════════════════════════
   14. Общий render, --vvh, поллинг, вход, boot (files/plan-m.html 2183-2343, адаптировано)
   ══════════════════════════════════════════════════════════════════════════ */
function render(){
  renderVerdict();
  renderLogFilters();
  renderList();
  $('mgrSeg').hidden = ME.role!=='manager';
}

function syncVvh(){
  var vv = window.visualViewport, h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty('--vvh', Math.round(h) + 'px');
}
syncVvh();
if (window.visualViewport) window.visualViewport.addEventListener('resize', syncVvh);
window.addEventListener('resize', syncVvh);

function setLoadbar_(state, text){
  var bar=$('loadbar'), btn=$('loadbarBtn');
  bar.className='loadbar'+(state?' on':'')+(state==='err'?' err':'');
  $('loadbarDot').hidden = state!=='loading';
  $('loadbarT').textContent = text||'';
  btn.hidden = state!=='err';
}
$('loadbarBtn').addEventListener('click', function(){ startLoad_(); });

var loadAttempt_=0;
function startLoad_(){
  var bg = ORDERS.length>0;
  setLoadbar_('loading', bg?'Обновляю…':'Загружаю заявки…');
  if(!bg) renderSkeleton_();
  loadOrders().then(function(){
    loadAttempt_=0;
    setLoadbar_(null,'');
  }).catch(function(err){
    var msg=String((err&&err.message)||err||'');
    if(/Не авторизован|нужен id_token|Доступ отозван/i.test(msg)){ try{ localStorage.removeItem('session_token'); }catch(e){} showLogin_(); return; }
    if(loadAttempt_<1){ loadAttempt_++; setLoadbar_('loading', bg?'Не получилось, обновляю…':'Не получилось, повторяю…'); setTimeout(startLoad_, 2500); return; }
    setLoadbar_('err', (bg?'Не удалось обновить - показаны прошлые данные · ':'Не удалось загрузить: ')+msg);
  });
}

var pollTimer_=null;
function startPolling_(){
  pollTimer_=setInterval(function(){
    if(document.hidden) return;
    if(sheetState!=='closed' || ovlState) return; // не дёргаем данные под открытой формой
    apiGet_('/orders', {date:iso(SELECTED_DATE)}).then(function(r){
      if(!r.ok) return;
      ORDERS = (r.data.orders||[]).map(normalizeOrder);
      if(r.data.me) ME = r.data.me;
      rebuildRoster_(r.data.roster);
      render();
    });
    loadCounts();
  }, 7000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) startLoad_(); });
}

function showLogin_(){
  $('app').hidden=true; $('loginState').hidden=false;
  if (window.google && google.accounts && google.accounts.id) initGoogleButton_();
  else { var iv=setInterval(function(){ if(window.google && google.accounts && google.accounts.id){ clearInterval(iv); initGoogleButton_(); } }, 200); setTimeout(function(){ clearInterval(iv); }, 15000); }
}
function initGoogleButton_(){
  google.accounts.id.initialize({client_id: GOOGLE_CLIENT_ID_, callback: onGoogleCredential_});
  $('googleBtn').innerHTML='';
  google.accounts.id.renderButton($('googleBtn'), {theme:'filled_black', size:'large', text:'signin_with', locale:'ru'});
}
function onGoogleCredential_(resp){
  apiGet_('/auth/google', {id_token: resp.credential}).then(function(r){
    if(!r.ok || !r.data.session_token){ toast('Не удалось войти', (r.data&&r.data.error)||'', null, null, {err:true}); return; }
    setSessionToken_(r.data.session_token);
    try{ if(r.data.name) localStorage.setItem('user_name', r.data.name); if(r.data.role) localStorage.setItem('user_role', r.data.role); }catch(e){}
    $('loginState').hidden=true; $('app').hidden=false;
    boot_();
  }).catch(function(){ toast('Ошибка сети при входе', null, null, null, {err:true}); });
}

window.addEventListener('offline', function(){ $('netbar').classList.add('on'); $('netTime').textContent = new Date().toTimeString().slice(0,5); });
window.addEventListener('online', function(){ $('netbar').classList.remove('on'); toast('Связь восстановлена'); startLoad_(); });

function boot_(){
  buildDateCarousel();
  logUiEvent_('viewport', '', window.innerWidth+'x'+window.innerHeight);
  loadMeta();
  loadCounts();
  startPolling_();
}
function boot(){
  if(sessionToken_()){ $('app').hidden=false; boot_(); }
  else showLogin_();
}
document.addEventListener('DOMContentLoaded', boot);
})();
